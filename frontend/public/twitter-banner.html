<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Market — Twitter Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050507;
    color: #FAFAFA;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .canvas {
    width: 1500px;
    height: 500px;
    background: #050507;
    position: relative;
    overflow: hidden;
  }

  /* Subtle glows */
  .glow-1 {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(239,68,68,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  .glow-2 {
    position: absolute;
    left: 10%;
    top: 20%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(34,197,94,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  .glow-3 {
    position: absolute;
    right: 5%;
    bottom: 10%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(239,68,68,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    opacity: 0.015;
    background-image: radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px);
    background-size: 20px 20px;
    z-index: 0;
  }

  /* Logo grid — 12 cols × 6 rows = 72 */
  .logo-wall {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px;
    padding: 8px;
    z-index: 2;
  }

  .src {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.03);
    position: relative;
    overflow: hidden;
  }

  .src img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 8px;
    opacity: 0.65;
  }

  /* Some nodes glow green */
  .src.ag::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 10px;
    border: 1px solid rgba(34,197,94,0.2);
  }

  .src.ag img { opacity: 0.85; }

  /* Some nodes glow red */
  .src.ar::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 10px;
    border: 1px solid rgba(239,68,68,0.15);
  }

  .src.ar img { opacity: 0.85; }

  /* Center overlay — GM branding */
  .brand-overlay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 48px;
    background: rgba(5,5,7,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    backdrop-filter: blur(20px);
  }

  .brand-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo { width: 28px; height: 28px; }

  .brand-name {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #FAFAFA;
  }

  .brand-tagline {
    font-size: 13px;
    font-weight: 600;
    color: rgba(250,250,250,0.4);
    letter-spacing: 0.02em;
    text-align: center;
  }

  .brand-tagline .accent {
    color: #EF4444;
    font-weight: 700;
  }

  .brand-stats {
    display: flex;
    gap: 24px;
    margin-top: 4px;
  }

  .brand-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .brand-stat-val {
    font-size: 18px;
    font-weight: 900;
    color: #FAFAFA;
    letter-spacing: -0.03em;
  }

  .brand-stat-label {
    font-size: 9px;
    font-weight: 600;
    color: rgba(250,250,250,0.3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
</style>
</head>
