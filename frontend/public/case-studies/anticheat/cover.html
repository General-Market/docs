<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover · The Anti-Cheat</title>
<style>
:root {
  --ink: #1D1D1F;
  --ink-3: #6E6E73;
  --paper: #FFFFFF;
  --blue: #0071E3;
  --blue-tint: #B5D4F5;
  --night: #0B0C0E;
  --display: "SF Pro Display", "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif;
  --serif: "New York", "Times New Roman", Georgia, serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 675px; background: var(--paper); }
body {
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: var(--ink);
  letter-spacing: -0.022em;
  display: flex;
  align-items: center;
  justify-content: center;
}
.frame { width: 1200px; height: 675px; background: var(--blue); padding: 18px; }
.inner {
  width: 100%;
  height: 100%;
  background: var(--night) url('candles.png') center / cover no-repeat;
  border-radius: 14px;
  padding: 56px 64px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
}
.inner::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(11,12,14,0.94) 0%, rgba(11,12,14,0.55) 55%, rgba(11,12,14,0.88) 100%);
  border-radius: 14px;
}
.inner > * { position: relative; z-index: 2; }
.top { display: flex; align-items: center; gap: 16px; }
.logo { width: 48px; height: 48px; background: #FFF; border-radius: 11px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.eyebrow { font-family: var(--mono); font-size: 16px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--blue-tint); font-weight: 700; }
.content { display: flex; flex-direction: column; justify-content: center; }
.pretitle { font-family: var(--display); font-size: 32px; font-weight: 600; letter-spacing: -0.018em; color: rgba(255,255,255,0.78); margin-bottom: 16px; line-height: 1.2; }
.title { font-family: var(--display); font-size: 156px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.92; color: #FFF; margin-bottom: 24px; }
.title em { font-family: var(--serif); font-style: italic; font-weight: 500; letter-spacing: -0.028em; color: var(--blue-tint); }
.sub { font-family: var(--display); font-size: 24px; font-weight: 500; letter-spacing: -0.012em; color: rgba(255,255,255,0.85); line-height: 1.35; max-width: 920px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.pills { display: flex; gap: 10px; }
.pill { font-family: var(--mono); font-size: 14px; letter-spacing: 0.12em; color: #FFF; border: 1.5px solid rgba(255,255,255,0.55); padding: 8px 16px; border-radius: 980px; font-weight: 600; }
.arrow { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--blue-tint); letter-spacing: -0.01em; }
.signature { position: absolute; bottom: 18px; right: 24px; font-family: var(--mono); font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; font-weight: 500; z-index: 3; }
</style>
</head>
<body>
<div class="frame">
  <div class="inner">
    <div class="top">
      <div class="logo"><img src="/download/general-logo.png" alt="General Market" onerror="this.onerror=null;this.src='/logo.svg';"></div>
      <div class="eyebrow">GENERAL MARKET · TECHNICAL REVIEW № 001</div>
    </div>
    <div class="content">
      <div class="pretitle">Trading has 8 named exploits.</div>
      <div class="title">The <em>Anti-Cheat</em></div>
      <div class="sub">Video games solved all of them between 1992 and 2020, so we did the embarrassing thing and read the literature.</div>
    </div>
    <div class="foot">
      <div class="pills">
        <span class="pill">QUAKE 1996</span>
        <span class="pill">STARCRAFT 1998</span>
        <span class="pill">VANGUARD 2020</span>
      </div>
      <div class="arrow">read at generalmarket.io →</div>
    </div>
    <div class="signature">@generalmarket</div>
  </div>
</div>
</body>
</html>
