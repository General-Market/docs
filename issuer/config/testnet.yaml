# Issuer Node Configuration - Index L3 Testnet
#
# Configuration priority: CLI args > Environment variables > This file > Defaults
#
# For private keys, prefer using environment variables:
#   ISSUER_PRIVATE_KEY=0x... (Ethereum signing key)
#   ISSUER_BLS_KEY_PATH=/path/to/bls.key (BLS signing key file)

# Node identity (1-20, unique per issuer)
node_id: 1

# P2P listen port (default: 9000 + node_id)
port: 9001

# Index L3 RPC endpoint
rpc_url: "http://142.132.164.24/"

# BLS key file path (32-byte BN254 private key)
bls_key_path: "./keys/bls-node1.key"

# Contract addresses (proxy addresses from L3 testnet deployment)
# These can also be loaded from --deployment-file deployments/local.json
index_address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
governance_address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
issuer_registry_address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
collateral_registry_address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
bls_custody_address: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
l3_bridge_custody_address: "0x0165878A594ca255338adfa4d48449f69242Eb8F"

# Peer addresses for 3-node testnet (ip:port format)
# Adjust IPs to match your testnet deployment
peers:
  - "127.0.0.1:9002"
  - "127.0.0.1:9003"

# Logging
log_level: "info"
log_dir: "./logs"
json_logs: false

# Private key file path (alternative to ISSUER_PRIVATE_KEY env var)
# private_key_path: "./keys/issuer1.key"
