[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
ethers.workspace = true
serde.workspace = true
rmp-serde.workspace = true
futures.workspace = true
rand = "0.8"
async-stream = "0.3"

# BLS cryptography (BN254 curve - compatible with EVM precompiles)
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"

# Utilities for BLS
sha2 = "0.10"
hex = "0.4"

# HTTP client for Bitget API
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
base64 = "0.22"
serde_json = "1"
urlencoding = "2"

# On-chain quote fallback
rust_decimal = "1"
hex-literal = "0.4"
dashmap = "5"
chrono.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Hot-reload runtime
arc-swap = "1.7"
notify = "6.1"
axum = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Solana dependencies for Squads v4 integration
solana-sdk = "2"
solana-client = "2"
borsh = "1"
bs58 = "0.5"
bincode = "1"

# Ed25519 key management (Story 5.11)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3"
