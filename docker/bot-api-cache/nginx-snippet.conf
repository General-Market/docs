    # /bot-api/ — public cache in front of internal data-node.
    # Varnish listens on 127.0.0.1:6081. Endpoint whitelist is enforced
    # in the VCL, so nginx passes everything through.
    location /bot-api/ {
        # Conservative rate limit — generous enough for a working bot
        # but bounded enough that a misbehaving script can't overwhelm
        # Varnish. Zone defined in nginx.conf; see below.
        limit_req zone=bot_api burst=30 nodelay;

        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

# Rate-limit zone (add to /etc/nginx/nginx.conf inside http { }):
#
#     limit_req_zone $binary_remote_addr zone=bot_api:10m rate=60r/m;
#
# 60 requests per minute per IP, burst of 30 handled instantly.
# Tighten later if abuse appears.
