# Static landing pages for AI agents and humans who arrive cold at
# generalmarket.io and want to build a bot.
#
# Insert into /etc/nginx/sites-enabled/generalmarket-frontend inside the
# 443 server block, before the catch-all `location / { ... }`.

    # llms.txt — machine-readable summary for AI agents. De-facto convention.
    location = /llms.txt {
        alias /var/www/generalmarket-static/llms.txt;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header X-Robots-Tag "noarchive";
        expires 1h;
    }

    # /bots — human-readable landing that points at the bot repo, infra,
    # and measured edge. Follows llms.txt for discovery by agents.
    location = /bots {
        root /var/www/generalmarket-static;
        try_files /bots.html =404;
        add_header Content-Type "text/html; charset=utf-8";
        expires 5m;
    }

    location = /bots/ {
        return 301 /bots;
    }

# Static files live at /var/www/generalmarket-static/{llms.txt,bots.html} —
# deployed from this directory via scp + sudo cp. Redeploy with:
#
#   scp llms.txt bots.html vps3:/opt/bot-api-cache/
#   ssh vps3 'sudo cp /opt/bot-api-cache/{llms.txt,bots.html} /var/www/generalmarket-static/'
