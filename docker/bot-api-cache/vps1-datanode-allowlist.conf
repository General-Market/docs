# Snippet to replace the existing `location /data-node/ { ... }` block
# on VPS 1 nginx. Locks public access down to the frontend server's
# public IP (which fronts the Varnish cache at /bot-api/).

location /data-node/ {
    # Allowlist: only VPS 3 (frontend + Varnish cache) and loopback.
    allow 159.195.77.160;
    allow 127.0.0.1;
    # Oracle nodes live on the same host, reach the local proxy over loopback.
    deny all;

    # Existing proxy config — unchanged.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400;
    proxy_pass http://127.0.0.1:8200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header X-Accel-Buffering no;
    proxy_set_header Connection "";
}

# Rate-limit the oracle reveal paths (/oracle1, /oracle2, /oracle3).
# These MUST stay public — bots POST bitmaps here. Protection is
# per-IP throttling, not allowlist.
#
# Add to /etc/nginx/nginx.conf inside http { }:
#
#     limit_req_zone $binary_remote_addr zone=oracle_reveal:20m rate=120r/m;
#
# Then inside each oracle location block (1/2/3):
#
#     limit_req zone=oracle_reveal burst=40 nodelay;
#
# 120 req/min with burst 40 handles legitimate bot reveals (a bot joins
# one batch per 60s → 1 reveal/min) plus health-check traffic.
