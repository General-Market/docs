services:
  itp-bot:
    build:
      context: ../../..
      dockerfile: docker/rust-service.Dockerfile
      args:
        SERVICE: itp-bot
        RUNTIME_DEPS: "ca-certificates libssl3 curl"
    container_name: testnet-itp-bot
    network_mode: host
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 512m
    cpus: "0.5"
    volumes:
      - /tmp/bot-key.txt:/tmp/bot-key.txt:ro
      - ../../../itp-bot/manifest.json:/app/manifest.json:ro
      - ../../../frontend/public/deployed-assets.json:/app/deployed-assets.json:ro
      - ../../../deployments/active-deployment.json:/app/deployment.json:ro
    environment:
      - DATA_NODE_URL=http://localhost:8200
      - DATA_NODE_AUTH_TOKEN=${DATA_NODE_AUTH_TOKEN}
      - L3_RPC_URL=http://142.132.164.24/
      - BOT_KEY_FILE=/tmp/bot-key.txt
      - DEPLOYED_ASSETS_PATH=/app/deployed-assets.json
    # ENTRYPOINT is service-entrypoint (symlink to /usr/local/bin/itp-bot).
    # command: is args only — don't repeat the binary path.
    command:
      - "--manifest"
      - "/app/manifest.json"
      - "--deployed-assets"
      - "/app/deployed-assets.json"
      - "--deployment-file"
      - "/app/deployment.json"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8210/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
