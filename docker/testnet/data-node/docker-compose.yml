# testnet.sh generates docker-compose.override.yml with dynamic command
# (--index-address, --database-url from deployment JSON).

services:
  data-node:
    build:
      context: ../../..
      dockerfile: docker/rust-service.Dockerfile
      args:
        SERVICE: data-node
    container_name: testnet-data-node
    network_mode: host
    restart: unless-stopped
    env_file:
      - ../../../data-node/.env
      # system.env overrides empty creds (BITGET_READONLY_*) in data-node/.env.
      # Compose merges env_files in order; later entries win. Keep system.env
      # out of git — it holds real API secrets.
      - ../../../system.env
    volumes:
      - ../../../data-node/.env:/app/data-node/.env:ro
      - ../../../data-node/migrations:/app/data-node/migrations:ro
      - ../../../deployments/active-deployment.json:/app/deployments/active-deployment.json:ro
      - ../../../deployments/morpho-e2e.json:/app/deployments/morpho-e2e.json:ro
      - ../../../deployments/vision-batches.json:/app/deployments/vision-batches.json:ro
      - ../../../data/symbol-map.json:/app/data/symbol-map.json:ro
      - ../../../assets.json:/app/assets.json:ro
      - ../../../frontend/data/sources-display.json:/app/config/sources-display.json:ro
      - ../../../frontend/data/fund-branding.json:/app/config/fund-branding.json:ro
      - ../../../deployments/batch-markets.json:/app/deployments/batch-markets.json:ro
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
