# ╔════════════════════════════════════════════════════════╗
# ║  Vision Swarm — 10 bots in 1 container (threaded)     ║
# ╠════════════════════════════════════════════════════════╣
# ║  Start:    source swarm.env && docker compose up -d     ║
# ║  Stop:     docker compose down                          ║
# ║  Logs:     docker compose logs -f vision-swarm          ║
# ╚════════════════════════════════════════════════════════╝

services:
  vision-swarm:
    build:
      context: ../../..
      dockerfile: docker/testnet/vision-swarm/Dockerfile
    container_name: vision-swarm
    entrypoint: ["python", "swarm_runner.py"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./pnl-data:/app/pnl-data
      - ../../../deployments/active-deployment.json:/app/deployments/active-deployment.json:ro
      - ../../../deployments/vision-batches.json:/app/deployments/vision-batches.json:ro
    tmpfs:
      - /tmp
    env_file:
      - swarm.env
    environment:
      BOT_COUNT: "10"
      BOT_KEYS: "${SWARM_BOT_0_KEY},${SWARM_BOT_1_KEY},${SWARM_BOT_2_KEY},${SWARM_BOT_3_KEY},${SWARM_BOT_4_KEY},${SWARM_BOT_5_KEY},${SWARM_BOT_6_KEY},${SWARM_BOT_7_KEY},${SWARM_BOT_8_KEY},${SWARM_BOT_9_KEY},${SWARM_BOT_10_KEY}"
      BOT_STRATEGIES: "momentum,contrarian,random,bullish,bearish,momentum,contrarian,random,bullish,bearish,random"
      BOT_STAKES: "1.5,1.3,1.2,1.4,1.6,1.1,1.7,1.8,1.9,1.15,2.0"
      STAGGER_SECS: "3"
      PNL_DIR: "/app/pnl-data"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
