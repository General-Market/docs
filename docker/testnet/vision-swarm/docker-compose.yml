# ╔════════════════════════════════════════════════════════╗
# ║  Vision Swarm — 10 bots in 1 container (threaded)     ║
# ╠════════════════════════════════════════════════════════╣
# ║  Start:    source swarm.env && docker compose up -d     ║
# ║  Stop:     docker compose down                          ║
# ║  Logs:     docker compose logs -f vision-swarm          ║
# ╚════════════════════════════════════════════════════════╝

services:
  vision-swarm:
    build:
      context: ../../..
      dockerfile: docker/testnet/vision-swarm/Dockerfile
    container_name: vision-swarm
    entrypoint: ["python", "swarm_runner.py"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./pnl-data:/app/pnl-data
      - ../../../deployments/active-deployment.json:/app/deployments/active-deployment.json:ro
      - ../../../deployments/vision-batches.json:/app/deployments/vision-batches.json:ro
    tmpfs:
      - /tmp
    env_file:
      - swarm.env
    environment:
      BOT_COUNT: "3"
      POLL_INTERVAL: "180"
      MAX_BATCHES: "20"
      BOT_STRATEGIES: "momentum,momentum,momentum_noise,momentum_noise,momentum_threshold,momentum_threshold,momentum,momentum_noise,momentum_threshold,contrarian,momentum"
      BOT_STAKES: "1.5,1.3,1.2,1.4,1.6,1.1,1.7,1.8,1.9,1.15,2.0"
      STAGGER_SECS: "3"
      PNL_DIR: "/app/pnl-data"
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
