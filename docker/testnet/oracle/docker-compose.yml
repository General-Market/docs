# testnet.sh generates docker-compose.override.yml with:
# - Full command per oracle (--from-block, --vision-*, --bridge-proxy)
# - Volumes (key files, deployment JSONs, WAL dir)
#
# This base file defines build + network + logging only.

x-oracle-base: &oracle-base
  build:
    context: ../../..
    dockerfile: docker/rust-service.Dockerfile
    args:
      SERVICE: oracle
      EXTRA_BINS: bls-tool
  network_mode: host
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  # /health is the runtime liveness endpoint. /ready is a deploy-ceremony gate
  # (pinned to 503 in steady state when registry_sync isn't fully caught up).
  # Using /ready here turns every oracle into a permanent false-positive.
  oracle-1:
    <<: *oracle-base
    container_name: testnet-oracle-1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:10001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  oracle-2:
    <<: *oracle-base
    container_name: testnet-oracle-2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:10002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  oracle-3:
    <<: *oracle-base
    container_name: testnet-oracle-3
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:10003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
