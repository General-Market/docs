[databases]
index_prices = host=127.0.0.1 port=5432 dbname=index_prices user=max password=pgbouncer_internal_2024

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction pooling — connections returned to pool after each transaction.
; This is the only sane mode for serverless-style workloads with many short queries.
pool_mode = transaction

; Server-side pool: how many real Postgres connections PgBouncer will open.
; Postgres has max_connections=100. We reserve 80 for PgBouncer, 20 for direct/admin.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Client-side: how many clients can connect to PgBouncer simultaneously.
; This is the whole point — hundreds of app connections multiplex into 20 real ones.
max_client_conn = 500

; Client auth: trust (private network only — not exposed to internet)
; PgBouncer authenticates to Postgres using SCRAM hash from userlist
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

; Timeouts
server_idle_timeout = 300
client_idle_timeout = 600
query_timeout = 300
client_login_timeout = 30

; sqlx sends extra_float_digits on connect — PgBouncer rejects it in transaction mode
ignore_startup_parameters = extra_float_digits,options

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin access (for SHOW POOLS, RELOAD, etc.)
admin_users = max
stats_users = max

; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3
