# testnet.sh generates docker-compose.override.yml with full command
# (morpho addresses, vault, oracle from deployment JSONs).

services:
  curator:
    build:
      context: ../../..
      dockerfile: docker/rust-service.Dockerfile
      args:
        SERVICE: curator
        EXTRA_MEMBERS: oracle
        RUNTIME_DEPS: "ca-certificates libssl3 curl"
    command: ["/usr/local/bin/curator"]
    container_name: testnet-curator
    network_mode: host
    restart: "no"
    healthcheck:
      # Quote API default listen port is 8080. /health/ready returns 503 when
      # no successful eth_call in the last 5 minutes — the condition we want
      # to detect. pgrep is kept as a fallback for pre-API boot.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || pgrep curator >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
