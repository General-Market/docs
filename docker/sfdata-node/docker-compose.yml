# sfdata-node deployment for VPS 3.
#
# Runs the scrape-heavy data-node (tubes, chaturbate) in total isolation
# from VPS 1's main data-node. SF_MODE=1 is set by the binary itself (see
# data-node/src/sf_main.rs) so any source not in the SF_MODE_ALLOWED list
# is silently skipped at spawn time.
#
# Database: uses its own Postgres instance on the same host. If you'd rather
# share VPS 2's Postgres, replace `sf-postgres` with a remote URL in the
# DATABASE_URL env.

services:
  sf-postgres:
    image: postgres:16-alpine
    container_name: sfdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfdata
      POSTGRES_USER: sfdata
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - sf-pg-data:/var/lib/postgresql/data
    secrets:
      - pg_password
    networks:
      - sf-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfdata -d sfdata"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  sfdata-node:
    build:
      context: ../..
      dockerfile: docker/sfdata-node/Dockerfile
    container_name: sfdata-node
    restart: unless-stopped
    depends_on:
      sf-postgres:
        condition: service_healthy
    env_file:
      - ./sfdata-node.env
    environment:
      RUST_LOG: "info,sqlx=warn"
      # Scrape-only binary — bitget feed is irrelevant, accept mock prices
      # so the startup guard does not refuse to launch.
      DATA_NODE_MOCK_PRICES: "true"
    volumes:
      # Minimum config files the data-node binary expects even in SF_MODE.
      - ../../deployments/active-deployment.json:/app/deployments/active-deployment.json:ro
      - ../../deployments/morpho-e2e.json:/app/deployments/morpho-e2e.json:ro
      - ../../deployments/vision-batches.json:/app/deployments/vision-batches.json:ro
      - ../../deployments/batch-markets.json:/app/deployments/batch-markets.json:ro
      - ../../data/symbol-map.json:/app/data/symbol-map.json:ro
      - ../../assets.json:/app/assets.json:ro
      - ../../config/sources-display.json:/app/config/sources-display.json:ro
      - ../../config/fund-branding.json:/app/config/fund-branding.json:ro
    networks:
      - sf-internal
      - sf-public
    ports:
      # Internal API port — expose ONLY on a private interface if possible.
      # Firewall this to VPS 1 only via ufw / iptables on the host.
      - "127.0.0.1:8200:8200"
    # Read the docker-mounted secret at container start, compose DATABASE_URL
    # in a shell owned by the container, then exec the Rust binary. The
    # doubled dollar signs ($$) prevent compose from interpolating the vars
    # at parse time — they're meant for the runtime shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DATABASE_URL="postgres://sfdata:$$(cat /run/secrets/pg_password)@sf-postgres:5432/sfdata"
        exec /usr/local/bin/sfdata-node serve
    secrets:
      - source: pg_password
        target: pg_password
        mode: 0444
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  sf-internal:
    driver: bridge
    internal: true
  sf-public:
    driver: bridge

volumes:
  sf-pg-data:

secrets:
  pg_password:
    file: ./pg_password.secret
