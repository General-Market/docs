[package]
name = "data-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "data-node"
path = "src/main.rs"

# Vendored OpenSSL for cross-compilation (transitive dep from solana-sdk)
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dependencies]
common = { path = "../common" }

# Async runtime
tokio.workspace = true

# CLI
clap = { version = "4", features = ["derive", "env"] }

# .env file loading
dotenvy = "0.15"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "compression-gzip"] }

# SSE streaming
tokio-stream = "0.1"
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal"] }

# Ethereum
ethers.workspace = true

# HTTP client (CoinGecko)
reqwest = { version = "0.12", features = ["json"] }

# Encoding
hex = "0.4"
base64 = "0.22"
md5 = "0.7"

# HMAC signing for snapshot responses
hmac = "0.12"
sha2 = "0.10"

# Constant-time comparison (explorer auth)
subtle = "2"

# Protobuf (GTFS-RT)
prost = "0.13"

# WebSocket (AISstream)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# XML parsing (SEC 13F)
quick-xml = { version = "0.37", features = ["serialize"] }

# URL parsing (oracle health collector)
url = "2"

# Randomization (oracle health collector)
rand = "0.8"

# Market data providers (from AA)
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono-tz = "0.10"
dashmap = "5.5"
regex = "1.12.3"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"
