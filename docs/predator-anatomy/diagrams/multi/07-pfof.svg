<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2050" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF453A"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <!-- background stage -->
  <rect x="0" y="0" width="1600" height="2050" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="320" rx="720" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="120" y="180"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">EXTRACTION 07 · THE CASH ROUTE</text>

  <!-- title (two lines) -->
  <text x="120" y="290"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0A0A0A" class="bloom">Your broker</text>
  <text x="120" y="380"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0052FF" class="bloom">has three owners.</text>

  <!-- tagline -->
  <text x="120" y="455"
        font-family="'SF Pro Text', sans-serif"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">Citadel paid $943M for nine months of retail order flow in 2024. They paid because it works.</text>

  <!-- voice + context -->
  <line x1="120" y1="500" x2="1480" y2="500" stroke="rgba(10,10,12,0.10)" stroke-width="1"/>
  <text x="120" y="555" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">VOICE OF THE OPERATOR</text>
  <text x="120" y="605" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">I make more money by getting you to transact more.</text>
  <text x="120" y="643" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">PFOF is inherently here to stay.</text>
  <text x="120" y="687" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.35" fill="#0A0A0A">Vladimir Tenev</text>
  <text x="120" y="711" font-family="'SF Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#6E727A">CEO, ROBINHOOD MARKETS · CNBC, DECEMBER 2023</text>
  <text x="860" y="605" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Tenev's admission, on camera, is the</text>
  <text x="860" y="631" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">cleanest statement of the conflict.</text>
  <text x="860" y="657" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The broker's revenue grows with user</text>
  <text x="860" y="683" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">activity, because every order is sold</text>
  <text x="860" y="709" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">to a wholesaler who pays cash for flow.</text>

  <!-- step 01 -->
  <circle cx="160" cy="820" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="825" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">01</text>
  <text x="210" y="814" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Retail clicks Buy.</text>
  <text x="210" y="850" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">A retail trader places a market order</text>
  <text x="210" y="874" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">through Robinhood. One hundred AAPL.</text>
  <g transform="translate(900, 790)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">ROBINHOOD · BUY</text>
    <text x="0" y="72" font-size="34" font-weight="800" letter-spacing="-1.1" fill="#0A0A0A">100 AAPL</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">market order · $17,200</text>
  </g>

  <line x1="160" y1="844" x2="160" y2="969" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 02 -->
  <circle cx="160" cy="995" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1000" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">02</text>
  <text x="210" y="989" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Routed to a wholesaler.</text>
  <text x="210" y="1025" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Robinhood does not send to NYSE.</text>
  <text x="210" y="1049" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">It routes to Citadel Securities.</text>
  <g transform="translate(900, 965)">
    <rect x="0" y="20" width="110" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="55" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">RETAIL</text>
    <text x="55" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">retail</text>
    <rect x="135" y="20" width="110" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="190" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">ROBINHOOD</text>
    <text x="190" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">broker</text>
    <rect x="270" y="20" width="120" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="330" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">CITADEL</text>
    <text x="330" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">wholesaler</text>
    <line x1="112" y1="36" x2="133" y2="36" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="247" y1="36" x2="268" y2="36" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="195" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.6" fill="#0052FF">order routed</text>
  </g>

  <line x1="160" y1="1019" x2="160" y2="1144" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 03 -->
  <circle cx="160" cy="1170" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1175" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">03</text>
  <text x="210" y="1164" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Cash to the broker.</text>
  <text x="210" y="1200" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Citadel pays Robinhood roughly $1.30 —</text>
  <text x="210" y="1224" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">payment for order flow.</text>
  <g transform="translate(900, 1140)">
    <rect x="0" y="20" width="110" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="55" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">RETAIL</text>
    <text x="55" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">retail</text>
    <rect x="135" y="20" width="110" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="190" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">ROBINHOOD</text>
    <text x="190" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">broker</text>
    <rect x="270" y="20" width="120" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="330" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">CITADEL</text>
    <text x="330" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">wholesaler</text>
    <line x1="133" y1="68" x2="112" y2="68" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="268" y1="68" x2="247" y2="68" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="195" y="100" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.6" fill="#0052FF">$1.30 PFOF cash</text>
  </g>

  <line x1="160" y1="1194" x2="160" y2="1319" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 04 -->
  <circle cx="160" cy="1345" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1350" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">04</text>
  <text x="210" y="1339" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Token improvement returns.</text>
  <text x="210" y="1375" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Citadel fills at NBBO midpoint and hands</text>
  <text x="210" y="1399" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">back twenty cents of 'improvement'.</text>
  <g transform="translate(900, 1315)">
    <rect x="0" y="20" width="110" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="55" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">RETAIL</text>
    <text x="55" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">retail</text>
    <rect x="135" y="20" width="110" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="190" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">ROBINHOOD</text>
    <text x="190" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">broker</text>
    <rect x="270" y="20" width="120" height="60" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="330" y="44" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.0" fill="#6E727A">CITADEL</text>
    <text x="330" y="68" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="800" fill="#0A0A0A">wholesaler</text>
    <line x1="133" y1="68" x2="112" y2="68" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="268" y1="68" x2="247" y2="68" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="195" y="100" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.6" fill="#0052FF">$0.20 'improvement'</text>
  </g>

  <line x1="160" y1="1369" x2="160" y2="1494" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 05 -->
  <circle cx="160" cy="1520" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1525" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">05</text>
  <text x="210" y="1514" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Citadel hedges in public.</text>
  <text x="210" y="1550" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">On a real exchange, Citadel takes the</text>
  <text x="210" y="1574" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">offsetting position at the NBBO bid.</text>
  <g transform="translate(900, 1490)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">CITADEL · HEDGES PUBLIC</text>
    <text x="0" y="62" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="700" fill="#0A0A0A">long 100 AAPL</text>
    <line x1="0" y1="76" x2="180" y2="76" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">sells on NYSE / ARCA at NBBO bid</text>
  </g>

  <line x1="160" y1="1544" x2="160" y2="1669" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 06 -->
  <circle cx="160" cy="1695" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1700" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">06</text>
  <text x="210" y="1689" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Who paid whom.</text>
  <text x="210" y="1725" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Citadel kept $3.50. Robinhood kept $1.10.</text>
  <text x="210" y="1749" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Retail subsidised both.</text>
  <g transform="translate(900, 1665)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">FINAL RECEIPT</text>
    <text x="0" y="50" font-family="'SF Mono', monospace" font-size="13" font-weight="700" fill="#0052FF">Citadel</text>
    <text x="200" y="50" text-anchor="end" font-family="'SF Mono', monospace" font-size="16" font-weight="800" fill="#0A0A0A">+$3.50</text>
    <text x="0" y="74" font-family="'SF Mono', monospace" font-size="13" font-weight="700" fill="#0052FF">Robinhood</text>
    <text x="200" y="74" text-anchor="end" font-family="'SF Mono', monospace" font-size="16" font-weight="800" fill="#0A0A0A">+$1.10</text>
    <text x="0" y="98" font-family="'SF Mono', monospace" font-size="13" font-weight="700" fill="#6E727A">Retail "improvement"</text>
    <text x="200" y="98" text-anchor="end" font-family="'SF Mono', monospace" font-size="16" font-weight="800" fill="#FF453A">+$0.20</text>
  </g>

  <!-- economics -->
  <line x1="120" y1="1900" x2="1480" y2="1900" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
  <text x="280" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">PFOF PAID (9MO)</text>
  <text x="280" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">$943M</text>
  <text x="800" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ANNUAL TAKE</text>
  <text x="800" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">$3–5B</text>
  <text x="1320" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ON GENERAL</text>
  <text x="1320" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0052FF">$0</text>
</svg>
