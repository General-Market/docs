<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 1100" width="1068" height="1100">
<defs>
<style>
/* All sizes precomputed from apple.com letter-spacing em values */
.eyebrow { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 2.34px; text-transform: uppercase; }
.title   { font: 700 40px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.88px; }
.titleEm { font: 500 40px "New York", "Times New Roman", Georgia, serif; fill: #0071E3; letter-spacing: -0.64px; font-style: italic; }
.tagline { font: 500 19px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #6E6E73; letter-spacing: -0.228px; }
.stepNum { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #0071E3; letter-spacing: 0; }
.stepH   { font: 700 17px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.374px; }
.stepC   { font: 400 14px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #424245; letter-spacing: -0.07px; }
.illL    { font: 600 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 0.44px; }
.illP    { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #1D1D1F; }
.illP-r  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #FF3B30; }
.illP-g  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #34C759; }
.illP-b  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #0071E3; }
.ecoL    { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 1.98px; text-transform: uppercase; }
.ecoF    { font: 800 28px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.616px; }
</style>
</defs>
<rect width="1068" height="1100" fill="#FFFFFF"/>

  <defs>
    <marker id="aHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/>
    </marker>
    <marker id="aHeadBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0071E3"/>
    </marker>
    <marker id="aHeadGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34C759"/>
    </marker>
    <marker id="aHeadRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3B30"/>
    </marker>
  </defs>
<text x="534.0" y="70" text-anchor="middle" class="eyebrow">EXTRACTION 07 · THE CASH ROUTE</text>
  <text x="534.0" y="130" text-anchor="middle"><tspan class="title">Your broker </tspan><tspan class="titleEm">has three owners.</tspan></text>
  <text x="534.0" y="186" text-anchor="middle" class="tagline">None of them is you. Citadel paid $943M for nine months of order flow in 2024.</text>
<rect x="0" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="38" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="38" y="347" text-anchor="middle" class="stepNum">01</text>
  <text x="64" y="347" class="stepH">Retail clicks Buy</text>
  <g transform="translate(0, 372)"><rect x="80" y="40" width="180" height="200" rx="20" fill="#F5F5F7" stroke="#E8E8ED"/>
  <text x="170" y="80" text-anchor="middle" class="illL">ROBINHOOD APP</text>
  <rect x="100" y="100" width="140" height="40" rx="10" fill="#34C759"/>
  <text x="170" y="126" text-anchor="middle" style="font: 700 15px 'SF Pro Text'; fill: #FFFFFF">BUY 100 AAPL</text>
  <text x="170" y="170" text-anchor="middle" class="illL">click</text>
  <text x="170" y="200" text-anchor="middle" class="illP">$17,200 order</text></g>
  <text x="24" y="596" class="stepC">A retail trader places a market order through</text>
  <text x="24" y="614" class="stepC">their broker app.</text>
<rect x="364" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="402" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="402" y="347" text-anchor="middle" class="stepNum">02</text>
  <text x="428" y="347" class="stepH">Rerouted to a wholesaler</text>
  <g transform="translate(364, 372)"><rect x="20" y="60" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#E8E8ED" stroke-width="1"/>
  <text x="60.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #1D1D1F">RETAIL</text>
  <text x="60.0" y="112" text-anchor="middle" style="font: 500 9px 'SF Mono', monospace; fill: #1D1D1F; opacity: 0.75">$17.2K</text>
  <rect x="130" y="60" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#E8E8ED" stroke-width="1"/>
  <text x="170.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #1D1D1F">BROKER</text>
  <text x="170.0" y="112" text-anchor="middle" style="font: 500 9px 'SF Mono', monospace; fill: #1D1D1F; opacity: 0.75">Robinhood</text>
  <rect x="240" y="60" width="80" height="80" rx="12" fill="#0071E3" stroke="#0071E3" stroke-width="1"/>
  <text x="280.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #FFFFFF">WHOLESALER</text>
  <text x="280.0" y="112" text-anchor="middle" style="font: 500 9px 'SF Mono', monospace; fill: #FFFFFF; opacity: 0.75">Citadel</text>
  <path d="M 102 78 L 126 78" stroke="#1D1D1F" stroke-width="1.8" fill="none" marker-end="url(#aHead)"/>
  <text x="115.0" y="72" text-anchor="middle" class="illP-b" style="fill: #1D1D1F">order</text>
  <path d="M 212 78 L 236 78" stroke="#1D1D1F" stroke-width="1.8" fill="none" marker-end="url(#aHead)"/>
  <text x="225.0" y="72" text-anchor="middle" class="illP-b" style="fill: #1D1D1F">rerouted</text>
  <text x="170" y="200" text-anchor="middle" class="illL" style="fill: #6E6E73">order does not reach a public exchange</text></g>
  <text x="388" y="596" class="stepC">Robinhood does not send the order to NYSE. It</text>
  <text x="388" y="614" class="stepC">routes to Citadel Securities.</text>
<rect x="728" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="766" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="766" y="347" text-anchor="middle" class="stepNum">03</text>
  <text x="792" y="347" class="stepH">Cash to the broker</text>
  <g transform="translate(728, 372)"><rect x="20" y="60" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#E8E8ED" stroke-width="1"/>
  <text x="60.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #1D1D1F">RETAIL</text>
  <rect x="130" y="60" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#E8E8ED" stroke-width="1"/>
  <text x="170.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #1D1D1F">BROKER</text>
  <text x="170.0" y="112" text-anchor="middle" style="font: 500 9px 'SF Mono', monospace; fill: #1D1D1F; opacity: 0.75">Robinhood</text>
  <rect x="240" y="60" width="80" height="80" rx="12" fill="#0071E3" stroke="#0071E3" stroke-width="1"/>
  <text x="280.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #FFFFFF">WHOLESALER</text>
  <text x="280.0" y="112" text-anchor="middle" style="font: 500 9px 'SF Mono', monospace; fill: #FFFFFF; opacity: 0.75">Citadel</text>
  <path d="M 242 122 L 212 122" stroke="#34C759" stroke-width="1.8" fill="none" marker-start="url(#aHead759)"/>
  <text x="225.0" y="136" text-anchor="middle" class="illP-b" style="fill: #34C759">$1.30 PFOF</text>
  <text x="170" y="200" text-anchor="middle" class="illP-g">cash paid for the order</text></g>
  <text x="752" y="596" class="stepC">Citadel pays Robinhood ~$1.30 in cash —</text>
  <text x="752" y="614" class="stepC">payment for order flow.</text>
<rect x="0" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="38" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="38" y="711" text-anchor="middle" class="stepNum">04</text>
  <text x="64" y="711" class="stepH">Token improvement returns</text>
  <g transform="translate(0, 736)"><rect x="20" y="60" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#E8E8ED" stroke-width="1"/>
  <text x="60.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #1D1D1F">RETAIL</text>
  <rect x="130" y="60" width="80" height="80" rx="12" fill="#FFFFFF" stroke="#E8E8ED" stroke-width="1"/>
  <text x="170.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #1D1D1F">BROKER</text>
  <rect x="240" y="60" width="80" height="80" rx="12" fill="#0071E3" stroke="#0071E3" stroke-width="1"/>
  <text x="280.0" y="92" text-anchor="middle" style="font: 700 11px 'SF Pro Text', sans-serif; fill: #FFFFFF">WHOLESALER</text>
  <text x="280.0" y="112" text-anchor="middle" style="font: 500 9px 'SF Mono', monospace; fill: #FFFFFF; opacity: 0.75">Citadel</text>
  <path d="M 242 122 L 102 122" stroke="#FF3B30" stroke-width="1.8" fill="none" marker-start="url(#aHeadB30)"/>
  <text x="170.0" y="136" text-anchor="middle" class="illP-b" style="fill: #FF3B30">$0.20 'improvement'</text>
  <text x="170" y="200" text-anchor="middle" class="illL">filled at NBBO midpoint</text></g>
  <text x="24" y="960" class="stepC">Citadel fills at NBBO midpoint and hands back</text>
  <text x="24" y="978" class="stepC">$0.20 of 'price improvement.'</text>
<rect x="364" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="402" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="402" y="711" text-anchor="middle" class="stepNum">05</text>
  <text x="428" y="711" class="stepH">Citadel hedges in public</text>
  <g transform="translate(364, 736)"><rect x="40" y="40" width="120" height="80" rx="10" fill="#0071E3"/>
  <text x="100" y="74" text-anchor="middle" style="font: 700 12px 'SF Pro Text'; fill: #FFFFFF">CITADEL</text>
  <text x="100" y="94" text-anchor="middle" style="font: 500 10px 'SF Mono'; fill: #E8F2FE">long 100 AAPL</text>
  <rect x="200" y="40" width="120" height="80" rx="10" fill="#1D1D1F"/>
  <text x="260" y="74" text-anchor="middle" style="font: 700 12px 'SF Pro Text'; fill: #FFFFFF">NYSE / ARCA</text>
  <text x="260" y="94" text-anchor="middle" style="font: 500 10px 'SF Mono'; fill: #FFFFFF; opacity: 0.7">public venue</text>
  <path d="M 162 80 L 198 80" stroke="#1D1D1F" stroke-width="1.8" marker-end="url(#aHead)"/>
  <text x="180" y="64" text-anchor="middle" class="illL">hedge</text>
  <text x="170" y="180" text-anchor="middle" class="illL">offsetting trade at NBBO bid</text></g>
  <text x="388" y="960" class="stepC">On a real venue, Citadel takes the offsetting</text>
  <text x="388" y="978" class="stepC">position at the NBBO bid.</text>
<rect x="728" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="766" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="766" y="711" text-anchor="middle" class="stepNum">06</text>
  <text x="792" y="711" class="stepH">Who paid whom</text>
  <g transform="translate(728, 736)"><text x="170" y="30" text-anchor="middle" class="illL">FINAL RECEIPT</text>
  <text x="40" y="78" class="stepH">Citadel kept</text>
  <text x="320" y="78" text-anchor="end" class="illP-g" style="font-size: 20px">+$3.50</text>
  <text x="40" y="118" class="stepH">Robinhood kept</text>
  <text x="320" y="118" text-anchor="end" class="illP-b" style="font-size: 20px">+$1.10</text>
  <text x="40" y="158" class="stepH">Retail "improvement"</text>
  <text x="320" y="158" text-anchor="end" class="illP-r" style="font-size: 20px">+$0.20</text>
  <line x1="40" y1="180" x2="320" y2="180" stroke="#E8E8ED"/>
  <text x="40" y="208" class="stepH">Citadel · 9 mo of 2024</text>
  <text x="320" y="208" text-anchor="end" class="illP" style="font-size: 16px">$943M paid</text></g>
  <text x="752" y="960" class="stepC">Citadel kept $3.50 on the spread. Robinhood</text>
  <text x="752" y="978" class="stepC">kept $1.10. Retail subsidised both.</text>
<rect x="0" y="1048" width="340" height="80" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <text x="20" y="1074" class="ecoL">PFOF PAID (CITADEL 9MO)</text>
  <text x="20" y="1108" class="ecoF" style="fill: #1D1D1F">$943M</text>
  <rect x="364" y="1048" width="340" height="80" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <text x="384" y="1074" class="ecoL">ANNUAL TAKE (CITADEL)</text>
  <text x="384" y="1108" class="ecoF" style="fill: #1D1D1F">$3–5B</text>
  <rect x="728" y="1048" width="340" height="80" rx="14" fill="#E8F2FE" stroke="#0071E3" stroke-width="1"/>
  <text x="748" y="1074" class="ecoL">ON GENERAL</text>
  <text x="748" y="1108" class="ecoF" style="fill: #0071E3">$0</text>
</svg>
