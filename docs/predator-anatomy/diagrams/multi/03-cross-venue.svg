<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2050" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF453A"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <!-- background stage -->
  <rect x="0" y="0" width="1600" height="2050" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="320" rx="720" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="120" y="180"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">EXTRACTION 03 · THE LAG</text>

  <!-- title (two lines) -->
  <text x="120" y="290"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0A0A0A" class="bloom">Eighty milliseconds</text>
  <text x="120" y="380"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0052FF" class="bloom">of light.</text>

  <!-- tagline -->
  <text x="120" y="455"
        font-family="'SF Pro Text', sans-serif"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">Same asset. Two venues. The arbitrageur reads both mailboxes and writes one cheque.</text>

  <!-- voice + context -->
  <line x1="120" y1="500" x2="1480" y2="500" stroke="rgba(10,10,12,0.10)" stroke-width="1"/>
  <text x="120" y="555" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">VOICE OF THE OPERATOR</text>
  <text x="120" y="605" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">Two prices for the same thing</text>
  <text x="120" y="643" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">cannot survive in front of a fast firm.</text>
  <text x="120" y="687" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.35" fill="#0A0A0A">Vincent Viola</text>
  <text x="120" y="711" font-family="'SF Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#6E727A">FOUNDER, VIRTU FINANCIAL · THE NEW YORK TIMES</text>
  <text x="860" y="605" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Virtu reported one losing trading day</text>
  <text x="860" y="631" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">in 1,238. The reason is structural: a</text>
  <text x="860" y="657" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">global arbitrageur with microwave links</text>
  <text x="860" y="683" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">between matching engines does not bet on</text>
  <text x="860" y="709" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">direction. It collects the difference.</text>

  <!-- step 01 -->
  <circle cx="160" cy="820" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="825" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">01</text>
  <text x="210" y="814" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Equilibrium.</text>
  <text x="210" y="850" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Both venues quote ETH at $4,000.</text>
  <text x="210" y="874" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The arbitrageur is idle.</text>
  <g transform="translate(900, 790)">
    <rect x="0" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="12" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">BINANCE</text>
    <text x="12" y="62" font-size="22" font-weight="800" fill="#0A0A0A">$4,000</text>
    <text x="12" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">idle</text>
    <rect x="190" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="202" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">COINBASE</text>
    <text x="202" y="62" font-size="22" font-weight="800" fill="#0A0A0A">$4,000</text>
    <text x="202" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">idle</text>
  </g>

  <line x1="160" y1="844" x2="160" y2="969" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 02 -->
  <circle cx="160" cy="995" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1000" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">02</text>
  <text x="210" y="989" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Binance prints first.</text>
  <text x="210" y="1025" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">A whale buy hits Binance.</text>
  <text x="210" y="1049" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Coinbase hasn't seen it.</text>
  <g transform="translate(900, 965)">
    <rect x="0" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="12" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">BINANCE</text>
    <text x="12" y="62" font-size="22" font-weight="800" fill="#0052FF">$4,005</text>
    <text x="12" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">↑ whale buy</text>
    <rect x="190" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="202" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">COINBASE</text>
    <text x="202" y="62" font-size="22" font-weight="800" fill="#0A0A0A">$4,000</text>
    <text x="202" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">stale</text>
  </g>

  <line x1="160" y1="1019" x2="160" y2="1144" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 03 -->
  <circle cx="160" cy="1170" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1175" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">03</text>
  <text x="210" y="1164" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">The lag window opens.</text>
  <text x="210" y="1200" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">For eighty milliseconds, only the</text>
  <text x="210" y="1224" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">co-located firm sees both prices.</text>
  <g transform="translate(900, 1140)">
    <rect x="0" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="12" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">BINANCE</text>
    <text x="12" y="62" font-size="22" font-weight="800" fill="#0052FF">$4,005</text>
    <text x="12" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">moved</text>
    <rect x="190" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="202" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">COINBASE</text>
    <text x="202" y="62" font-size="22" font-weight="800" fill="#0A0A0A">$4,000</text>
    <text x="202" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">LAG · 80 MS</text>
  </g>

  <line x1="160" y1="1194" x2="160" y2="1319" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 04 -->
  <circle cx="160" cy="1345" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1350" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">04</text>
  <text x="210" y="1339" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Buy the stale side.</text>
  <text x="210" y="1375" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Two hundred thousand of ETH bought</text>
  <text x="210" y="1399" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">on Coinbase at the stale $4,000.</text>
  <g transform="translate(900, 1315)">
    <rect x="0" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="12" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">BINANCE</text>
    <text x="12" y="62" font-size="22" font-weight="800" fill="#0052FF">$4,005</text>
    <rect x="190" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="202" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">COINBASE</text>
    <text x="202" y="62" font-size="22" font-weight="800" fill="#0A0A0A">$4,000</text>
    <text x="202" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">stale</text>
    <line x1="150" y1="50" x2="190" y2="50" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="170" y="38" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.6" fill="#0052FF">BUY $200K</text>
  </g>

  <line x1="160" y1="1369" x2="160" y2="1494" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 05 -->
  <circle cx="160" cy="1520" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1525" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">05</text>
  <text x="210" y="1514" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Hedge the fast side.</text>
  <text x="210" y="1550" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Simultaneous sell on Binance at $4,005.</text>
  <text x="210" y="1574" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Net inventory: zero.</text>
  <g transform="translate(900, 1490)">
    <rect x="0" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="12" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">BINANCE</text>
    <text x="12" y="62" font-size="22" font-weight="800" fill="#0052FF">$4,005</text>
    <rect x="190" y="0" width="150" height="100" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="202" y="24" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6E727A">COINBASE</text>
    <text x="202" y="62" font-size="22" font-weight="800" fill="#0A0A0A">$4,000</text>
    <text x="202" y="88" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6E727A">stale</text>
    <line x1="190" y1="80" x2="150" y2="80" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="170" y="124" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.6" fill="#0052FF">SELL $200K</text>
  </g>

  <line x1="160" y1="1544" x2="160" y2="1669" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 06 -->
  <circle cx="160" cy="1695" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1700" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">06</text>
  <text x="210" y="1689" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Receipt.</text>
  <text x="210" y="1725" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Coinbase catches up at t+80 ms.</text>
  <text x="210" y="1749" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Five dollars per unit is banked.</text>
  <g transform="translate(900, 1665)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">PER ETH ARBITRAGED</text>
    <text x="0" y="72" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#0052FF">+$5</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">risk-free, hundreds × day</text>
  </g>

  <!-- economics -->
  <line x1="120" y1="1900" x2="1480" y2="1900" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
  <text x="280" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">OPERATOR SPEND</text>
  <text x="280" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">~$400K/yr</text>
  <text x="800" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ANNUAL TAKE</text>
  <text x="800" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">$500K–2M</text>
  <text x="1320" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ON GENERAL</text>
  <text x="1320" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0052FF">$0</text>
</svg>
