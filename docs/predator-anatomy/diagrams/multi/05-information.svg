<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 1100" width="1068" height="1100">
<defs>
<style>
/* All sizes precomputed from apple.com letter-spacing em values */
.eyebrow { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 2.34px; text-transform: uppercase; }
.title   { font: 700 40px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.88px; }
.titleEm { font: 500 40px "New York", "Times New Roman", Georgia, serif; fill: #0071E3; letter-spacing: -0.64px; font-style: italic; }
.tagline { font: 500 19px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #6E6E73; letter-spacing: -0.228px; }
.stepNum { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #0071E3; letter-spacing: 0; }
.stepH   { font: 700 17px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.374px; }
.stepC   { font: 400 14px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #424245; letter-spacing: -0.07px; }
.illL    { font: 600 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 0.44px; }
.illP    { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #1D1D1F; }
.illP-r  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #FF3B30; }
.illP-g  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #34C759; }
.illP-b  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #0071E3; }
.ecoL    { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 1.98px; text-transform: uppercase; }
.ecoF    { font: 800 28px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.616px; }
</style>
</defs>
<rect width="1068" height="1100" fill="#FFFFFF"/>

  <defs>
    <marker id="aHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/>
    </marker>
    <marker id="aHeadBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0071E3"/>
    </marker>
    <marker id="aHeadGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34C759"/>
    </marker>
    <marker id="aHeadRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3B30"/>
    </marker>
  </defs>
<text x="534.0" y="70" text-anchor="middle" class="eyebrow">EXTRACTION 05 · THE CALENDAR</text>
  <text x="534.0" y="130" text-anchor="middle"><tspan class="title">Earnings are old news </tspan><tspan class="titleEm">to ten people.</tspan></text>
  <text x="534.0" y="186" text-anchor="middle" class="tagline">By the time the press release prints, the position has already paid for the satellite.</text>
<rect x="0" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="38" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="38" y="347" text-anchor="middle" class="stepNum">01</text>
  <text x="64" y="347" class="stepH">Receipts before the company</text>
  <g transform="translate(0, 372)"><text x="170" y="30" text-anchor="middle" class="illL">JAN · CREDIT-CARD PANEL</text>
  <rect x="60" y="60" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#E8E8ED"/>
  <text x="170" y="100" text-anchor="middle" style="font: 800 36px 'SF Pro Display'; fill: #34C759; letter-spacing: -0.79px">+22%</text>
  <text x="170" y="130" text-anchor="middle" class="illL">YoY service-center receipts</text>
  <text x="170" y="160" text-anchor="middle" class="illL" style="fill: #6E6E73">YipitData · $120K / yr</text></g>
  <text x="24" y="596" class="stepC">A credit-card data panel shows Tesla service</text>
  <text x="24" y="614" class="stepC">revenue up 22% YoY in January.</text>
<rect x="364" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="402" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="402" y="347" text-anchor="middle" class="stepNum">02</text>
  <text x="428" y="347" class="stepH">Counted from orbit</text>
  <g transform="translate(364, 372)"><text x="170" y="30" text-anchor="middle" class="illL">FEB · SATELLITE IMAGERY</text>
  <rect x="60" y="60" width="220" height="120" rx="10" fill="#1D1D1F"/>
  <text x="170" y="100" text-anchor="middle" style="font: 800 36px 'SF Pro Display'; fill: #FFFFFF; letter-spacing: -0.79px">+18%</text>
  <text x="170" y="130" text-anchor="middle" class="illL" style="fill: #FFFFFF; opacity: 0.7">Shanghai factory parking lot</text>
  <text x="170" y="160" text-anchor="middle" class="illL" style="fill: #FFFFFF; opacity: 0.5">RS Metrics · $80K / yr</text></g>
  <text x="388" y="596" class="stepC">Satellite imagery confirms the factory parking</text>
  <text x="388" y="614" class="stepC">lot is 18% fuller than the prior quarter.</text>
<rect x="728" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="766" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="766" y="347" text-anchor="middle" class="stepNum">03</text>
  <text x="792" y="347" class="stepH">Confirmed by the inside</text>
  <g transform="translate(728, 372)"><text x="170" y="30" text-anchor="middle" class="illL">MAR · EXPERT NETWORK</text>
  <rect x="60" y="60" width="220" height="120" rx="10" fill="#F5F5F7" stroke="#E8E8ED"/>
  <text x="170" y="100" text-anchor="middle" style="font: 700 17px 'SF Pro Display'; fill: #1D1D1F; letter-spacing: -0.374px">"Tooling capacity confirmed"</text>
  <text x="170" y="130" text-anchor="middle" class="illL">— ex-Tesla supply-chain VP</text>
  <text x="170" y="160" text-anchor="middle" class="illL" style="fill: #6E6E73">GLG · $150K / yr</text></g>
  <text x="752" y="596" class="stepC">A paid call with a former supply-chain VP</text>
  <text x="752" y="614" class="stepC">confirms the capacity is real.</text>
<rect x="0" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="38" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="38" y="711" text-anchor="middle" class="stepNum">04</text>
  <text x="64" y="711" class="stepH">Position opens</text>
  <g transform="translate(0, 736)"><text x="170" y="30" text-anchor="middle" class="illL">LATE MAR · FUND ENTRY</text>
  <text x="170" y="100" text-anchor="middle" style="font: 800 36px 'SF Pro Display'; fill: #0071E3; letter-spacing: -0.79px">LONG CALLS</text>
  <text x="170" y="130" text-anchor="middle" class="illL">positioned before consensus</text>
  <text x="170" y="160" text-anchor="middle" class="illL">three pieces of evidence aligned</text></g>
  <text x="24" y="960" class="stepC">With three pieces of evidence aligned, the</text>
  <text x="24" y="978" class="stepC">fund opens a directional position.</text>
<rect x="364" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="402" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="402" y="711" text-anchor="middle" class="stepNum">05</text>
  <text x="428" y="711" class="stepH">The print</text>
  <g transform="translate(364, 736)"><text x="170" y="30" text-anchor="middle" class="illL">APR · EARNINGS DAY</text>
  <line x1="20" y1="160" x2="320" y2="160" stroke="#E8E8ED"/>
  <path d="M 20 140 L 80 138 L 130 142 L 160 140 L 170 90 L 320 80" fill="none" stroke="#1D1D1F" stroke-width="2"/>
  <circle cx="170" cy="90" r="6" fill="#34C759"/>
  <text x="170" y="74" text-anchor="middle" class="illP-g">+8%</text>
  <text x="170" y="185" text-anchor="middle" class="illL">earnings beat printed</text></g>
  <text x="388" y="960" class="stepC">Tesla announces a beat. The stock jumps 8%.</text>
  <text x="388" y="978" class="stepC">The fund's edge crystallises.</text>
<rect x="728" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="766" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="766" y="711" text-anchor="middle" class="stepNum">06</text>
  <text x="792" y="711" class="stepH">Retail reads the headline</text>
  <g transform="translate(728, 736)"><text x="170" y="30" text-anchor="middle" class="illL">APR · 4:01 PM</text>
  <rect x="40" y="60" width="260" height="120" rx="10" fill="#F5F5F7" stroke="#E8E8ED"/>
  <text x="170" y="90" text-anchor="middle" style="font: 800 16px 'SF Pro Display'; fill: #FF3B30; letter-spacing: -0.352px">TESLA BEATS EXPECTATIONS</text>
  <text x="170" y="120" text-anchor="middle" class="illL">CNBC headline · retail reads it</text>
  <text x="170" y="150" text-anchor="middle" class="illL" style="fill: #6E6E73">fund has already exited at the open</text></g>
  <text x="752" y="960" class="stepC">Four-oh-one p.m. The fund has already exited.</text>
  <text x="752" y="978" class="stepC">The retail reader is buying the top.</text>
<rect x="0" y="1048" width="340" height="80" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <text x="20" y="1074" class="ecoL">OPERATOR SPEND</text>
  <text x="20" y="1108" class="ecoF" style="fill: #1D1D1F">~$714K / yr</text>
  <rect x="364" y="1048" width="340" height="80" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <text x="384" y="1074" class="ecoL">ANNUAL TAKE</text>
  <text x="384" y="1108" class="ecoF" style="fill: #1D1D1F">$500K–2M</text>
  <rect x="728" y="1048" width="340" height="80" rx="14" fill="#E8F2FE" stroke="#0071E3" stroke-width="1"/>
  <text x="748" y="1074" class="ecoL">ON GENERAL</text>
  <text x="748" y="1108" class="ecoF" style="fill: #0071E3">$0</text>
</svg>
