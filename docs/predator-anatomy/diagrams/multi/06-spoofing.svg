<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2050" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF453A"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <!-- background stage -->
  <rect x="0" y="0" width="1600" height="2050" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="320" rx="720" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="120" y="180"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">EXTRACTION 06 · THE WALL THAT WASN'T</text>

  <!-- title (two lines) -->
  <text x="120" y="290"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0A0A0A" class="bloom">Build a wall.</text>
  <text x="120" y="380"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0052FF" class="bloom">Cancel it.</text>

  <!-- tagline -->
  <text x="120" y="455"
        font-family="'SF Pro Text', sans-serif"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">The chart is not a record. The chart is a stage. JPMorgan paid $920M for the run.</text>

  <!-- voice + context -->
  <line x1="120" y1="500" x2="1480" y2="500" stroke="rgba(10,10,12,0.10)" stroke-width="1"/>
  <text x="120" y="555" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">VOICE OF THE OPERATOR</text>
  <text x="120" y="605" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">We regret the conduct of certain former</text>
  <text x="120" y="643" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">employees who placed orders they did not intend to fill.</text>
  <text x="120" y="687" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.35" fill="#0A0A0A">JPMorgan Chase</text>
  <text x="120" y="711" font-family="'SF Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#6E727A">OFFICIAL STATEMENT · DOJ PRESS RELEASE · SEPTEMBER 2020</text>
  <text x="860" y="605" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The firm placed and cancelled thousands</text>
  <text x="860" y="631" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">of orders in precious metals and Treasuries</text>
  <text x="860" y="657" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">to create false impressions of supply and</text>
  <text x="860" y="683" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">demand. Eight years of practice. One</text>
  <text x="860" y="709" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">press release of contrition.</text>

  <!-- step 01 -->
  <circle cx="160" cy="820" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="825" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">01</text>
  <text x="210" y="814" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Thin book, hidden intent.</text>
  <text x="210" y="850" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The book is thin.</text>
  <text x="210" y="874" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The MM wants to sell at the top.</text>
  <g transform="translate(900, 790)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">THIN BOOK · PRIVATE INTENT</text>
    <line x1="0" y1="50" x2="320" y2="50" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <rect x="10" y="44" width="14" height="12" fill="rgba(10,10,12,0.30)"/>
    <rect x="50" y="44" width="10" height="12" fill="rgba(10,10,12,0.30)"/>
    <rect x="100" y="44" width="16" height="12" fill="rgba(10,10,12,0.30)"/>
    <text x="0" y="84" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">MM wants to sell at the top</text>
    <text x="0" y="108" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="#6E727A">INVISIBLE TO THE TAPE</text>
  </g>

  <line x1="160" y1="844" x2="160" y2="969" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 02 -->
  <circle cx="160" cy="995" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1000" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">02</text>
  <text x="210" y="989" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">The wall goes up.</text>
  <text x="210" y="1025" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Five million posted at $99.</text>
  <text x="210" y="1049" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The chart reads conviction.</text>
  <g transform="translate(900, 965)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">THE WALL APPEARS</text>
    <rect x="0" y="38" width="320" height="32" fill="#0052FF"/>
    <text x="160" y="60" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF">$5M @ $99.00</text>
    <text x="0" y="98" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">the chart now reads</text>
    <text x="0" y="118" font-family="'SF Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.8" fill="#0052FF">STRONG SUPPORT</text>
  </g>

  <line x1="160" y1="1019" x2="160" y2="1144" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 03 -->
  <circle cx="160" cy="1170" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1175" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">03</text>
  <text x="210" y="1164" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Retail reads support.</text>
  <text x="210" y="1200" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The wall is flagged as buy-side conviction.</text>
  <text x="210" y="1224" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Retail buys the dip.</text>
  <g transform="translate(900, 1140)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">RETAIL RESPONSE</text>
    <text x="0" y="60" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="500" fill="#1F1F24">$99.00 looks like a floor</text>
    <text x="0" y="86" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="700" fill="#0052FF">→ buy the dip</text>
    <text x="0" y="112" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="#6E727A">BUYERS CROSS THE SPREAD</text>
  </g>

  <line x1="160" y1="1194" x2="160" y2="1319" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 04 -->
  <circle cx="160" cy="1345" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1350" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">04</text>
  <text x="210" y="1339" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Retail fills the offer.</text>
  <text x="210" y="1375" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Convinced by the wall, retail</text>
  <text x="210" y="1399" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">crosses the spread at $99.05.</text>
  <g transform="translate(900, 1315)">
    <rect x="0" y="0" width="320" height="44" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="14" y="28" font-family="'SF Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6E727A">OFFER</text>
    <text x="306" y="28" text-anchor="end" font-family="'SF Mono', monospace" font-size="18" font-weight="700" fill="#0A0A0A">$99.05</text>
    <rect x="0" y="54" width="320" height="44" fill="none" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="14" y="82" font-family="'SF Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6E727A">BID</text>
    <text x="306" y="82" text-anchor="end" font-family="'SF Mono', monospace" font-size="18" font-weight="700" fill="#0A0A0A">$98.95</text>
    <text x="0" y="124" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6E727A">RETAIL BOUGHT AT $99.05</text>
    <circle cx="296" cy="22" r="9" fill="#0052FF"/>
    <text x="296" y="26" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
  </g>

  <line x1="160" y1="1369" x2="160" y2="1494" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 05 -->
  <circle cx="160" cy="1520" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1525" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">05</text>
  <text x="210" y="1514" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">The wall disappears.</text>
  <text x="210" y="1550" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Forty-seven milliseconds after appearing,</text>
  <text x="210" y="1574" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">the wall is cancelled.</text>
  <g transform="translate(900, 1490)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">THE WALL DISAPPEARS</text>
    <rect x="0" y="38" width="320" height="32" fill="none" stroke="#FF453A" stroke-width="1.5" stroke-dasharray="6,6"/>
    <text x="160" y="60" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" fill="#FF453A">CANCELLED</text>
    <text x="0" y="98" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">wall lifespan</text>
    <text x="0" y="118" font-family="'SF Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.8" fill="#FF453A">47 MILLISECONDS</text>
  </g>

  <line x1="160" y1="1544" x2="160" y2="1669" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 06 -->
  <circle cx="160" cy="1695" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1700" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">06</text>
  <text x="210" y="1689" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">The drop.</text>
  <text x="210" y="1725" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">No real support. Price falls to $98.85.</text>
  <text x="210" y="1749" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">The round trip is kept.</text>
  <g transform="translate(900, 1665)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">PER SHARE TO MM</text>
    <text x="0" y="72" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#0052FF">+$0.20</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">$99.05 fill · $98.85 close</text>
  </g>

  <!-- economics -->
  <line x1="120" y1="1900" x2="1480" y2="1900" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
  <text x="280" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">MARGINAL SPEND</text>
  <text x="280" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">~$0</text>
  <text x="800" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ANNUAL TAKE</text>
  <text x="800" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">$200K–2M</text>
  <text x="1320" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ON GENERAL</text>
  <text x="1320" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0052FF">$0</text>
</svg>
