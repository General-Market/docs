<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 1100" width="1068" height="1100">
<defs>
<style>
/* All sizes precomputed from apple.com letter-spacing em values */
.eyebrow { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 2.34px; text-transform: uppercase; }
.title   { font: 700 40px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.88px; }
.titleEm { font: 500 40px "New York", "Times New Roman", Georgia, serif; fill: #0071E3; letter-spacing: -0.64px; font-style: italic; }
.tagline { font: 500 19px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #6E6E73; letter-spacing: -0.228px; }
.stepNum { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #0071E3; letter-spacing: 0; }
.stepH   { font: 700 17px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.374px; }
.stepC   { font: 400 14px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #424245; letter-spacing: -0.07px; }
.illL    { font: 600 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 0.44px; }
.illP    { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #1D1D1F; }
.illP-r  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #FF3B30; }
.illP-g  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #34C759; }
.illP-b  { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #0071E3; }
.ecoL    { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E6E73; letter-spacing: 1.98px; text-transform: uppercase; }
.ecoF    { font: 800 28px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #1D1D1F; letter-spacing: -0.616px; }
</style>
</defs>
<rect width="1068" height="1100" fill="#FFFFFF"/>

  <defs>
    <marker id="aHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/>
    </marker>
    <marker id="aHeadBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0071E3"/>
    </marker>
    <marker id="aHeadGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34C759"/>
    </marker>
    <marker id="aHeadRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3B30"/>
    </marker>
  </defs>
<text x="534.0" y="70" text-anchor="middle" class="eyebrow">EXTRACTION 06 · THE WALL THAT WASN'T</text>
  <text x="534.0" y="130" text-anchor="middle"><tspan class="title">Build a wall. </tspan><tspan class="titleEm">Cancel it.</tspan></text>
  <text x="534.0" y="186" text-anchor="middle" class="tagline">The chart is not a record. The chart is a stage.</text>
<rect x="0" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="38" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="38" y="347" text-anchor="middle" class="stepNum">01</text>
  <text x="64" y="347" class="stepH">Thin book, hidden intent</text>
  <g transform="translate(0, 372)"><text x="170" y="30" text-anchor="middle" class="illL">ORDER BOOK · THIN</text><rect x="40" y="55" width="40" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="75" width="52" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="95" width="64" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="125" width="60" height="14" fill="#0071E3" opacity="0.6" rx="3"/><rect x="40" y="145" width="68" height="14" fill="#0071E3" opacity="0.6" rx="3"/><rect x="40" y="165" width="76" height="14" fill="#0071E3" opacity="0.6" rx="3"/>
  <text x="280" y="100" text-anchor="end" class="illL">MM has private sell intent</text></g>
  <text x="24" y="596" class="stepC">Order book is thin. MM wants to sell at the</text>
  <text x="24" y="614" class="stepC">highest visible price.</text>
<rect x="364" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="402" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="402" y="347" text-anchor="middle" class="stepNum">02</text>
  <text x="428" y="347" class="stepH">The wall goes up</text>
  <g transform="translate(364, 372)"><text x="170" y="30" text-anchor="middle" class="illL">SAME BOOK + WALL</text><rect x="40" y="55" width="40" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="75" width="52" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="95" width="64" height="14" fill="#FF3B30" opacity="0.6" rx="3"/>
  <rect x="40" y="125" width="240" height="20" fill="#0071E3" rx="3"/>
  <text x="160" y="139" text-anchor="middle" style="font: 700 11px 'SF Mono'; fill: #FFFFFF">$5M BID @ $99.00</text><rect x="40" y="155" width="40" height="14" fill="#0071E3" opacity="0.4" rx="3"/><rect x="40" y="175" width="48" height="14" fill="#0071E3" opacity="0.4" rx="3"/></g>
  <text x="388" y="596" class="stepC">MM posts a $5M bid at $99. To the chart it</text>
  <text x="388" y="614" class="stepC">looks like serious support.</text>
<rect x="728" y="304" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="766" cy="342" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="766" y="347" text-anchor="middle" class="stepNum">03</text>
  <text x="792" y="347" class="stepH">Retail reads the wall as support</text>
  <g transform="translate(728, 372)"><text x="170" y="30" text-anchor="middle" class="illL">RETAIL CHART · MIN 13</text>
  <line x1="20" y1="140" x2="320" y2="140" stroke="#E8E8ED" stroke-dasharray="3 3"/>
  <text x="320" y="136" text-anchor="end" class="illL">$99.00 support</text>
  <path d="M 20 110 L 80 112 L 130 120 L 180 130 L 240 138 L 300 134" fill="none" stroke="#1D1D1F" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" class="illP-b">"strong bid at $99"</text></g>
  <text x="752" y="596" class="stepC">Charting tools flag the wall as buy-side</text>
  <text x="752" y="614" class="stepC">conviction. The thesis spreads.</text>
<rect x="0" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="38" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="38" y="711" text-anchor="middle" class="stepNum">04</text>
  <text x="64" y="711" class="stepH">Retail fills the MM's offer</text>
  <g transform="translate(0, 736)"><text x="40" y="24" class="illL">PRICE</text>
  <text x="260" y="24" text-anchor="end" class="illL">SIZE</text>
  <rect x="40" y="42" width="220" height="36" rx="6" fill="#FF3B30" opacity="0.9"/>
  <text x="56" y="65" fill="#FFFFFF" style="font: 700 13px 'SF Mono', monospace">OFFER MM @ $99.05</text>
  <rect x="40" y="86" width="220" height="36" rx="6" fill="#0071E3" opacity="0.9"/>
  <text x="56" y="109" fill="#FFFFFF" style="font: 700 13px 'SF Mono', monospace">BID $5M wall</text>
  <text x="150" y="156" text-anchor="middle" class="illL">retail buys $99.05</text>
  <circle cx="270" cy="50" r="14" fill="#34C759" opacity="0.18"/>
  <text x="270" y="55" text-anchor="middle" style="font: 800 14px 'SF Pro Text'; fill: #34C759">✓</text></g>
  <text x="24" y="960" class="stepC">Convinced by the wall, retail crosses the</text>
  <text x="24" y="978" class="stepC">spread and buys at $99.05.</text>
<rect x="364" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="402" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="402" y="711" text-anchor="middle" class="stepNum">05</text>
  <text x="428" y="711" class="stepH">The wall disappears</text>
  <g transform="translate(364, 736)"><text x="170" y="30" text-anchor="middle" class="illL">+47 ms · WALL CANCELLED</text><rect x="40" y="55" width="40" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="75" width="52" height="14" fill="#FF3B30" opacity="0.6" rx="3"/><rect x="40" y="95" width="64" height="14" fill="#FF3B30" opacity="0.6" rx="3"/>
  <rect x="40" y="125" width="240" height="20" fill="none" stroke="#0071E3" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
  <text x="160" y="139" text-anchor="middle" style="font: 700 11px 'SF Mono'; fill: #6E6E73">$0 · CANCELLED</text><rect x="40" y="155" width="40" height="14" fill="#0071E3" opacity="0.3" rx="3"/><rect x="40" y="175" width="48" height="14" fill="#0071E3" opacity="0.3" rx="3"/>
  <text x="170" y="225" text-anchor="middle" class="illP-r">lifespan: 47 ms total</text></g>
  <text x="388" y="960" class="stepC">Forty-seven milliseconds after appearing, the</text>
  <text x="388" y="978" class="stepC">wall is cancelled.</text>
<rect x="728" y="668" width="340" height="340" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <circle cx="766" cy="706" r="14" fill="#FFFFFF" stroke="#0071E3" stroke-width="1.5"/>
  <text x="766" y="711" text-anchor="middle" class="stepNum">06</text>
  <text x="792" y="711" class="stepH">The drop</text>
  <g transform="translate(728, 736)"><text x="170" y="30" text-anchor="middle" class="illL">SECONDS LATER</text>
  <line x1="20" y1="100" x2="320" y2="100" stroke="#E8E8ED" stroke-dasharray="3 3"/>
  <text x="20" y="96" class="illL">$99.05 fill</text>
  <line x1="20" y1="180" x2="320" y2="180" stroke="#E8E8ED" stroke-dasharray="3 3"/>
  <text x="20" y="200" class="illL">$98.85</text>
  <path d="M 20 100 L 80 110 L 130 125 L 180 145 L 240 165 L 300 178" fill="none" stroke="#1D1D1F" stroke-width="2"/>
  <text x="290" y="220" text-anchor="end" class="illP-g">+$0.20 / share</text></g>
  <text x="752" y="960" class="stepC">With no real support, price falls to $98.85.</text>
  <text x="752" y="978" class="stepC">MM kept the round trip.</text>
<rect x="0" y="1048" width="340" height="80" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <text x="20" y="1074" class="ecoL">MARGINAL SPEND</text>
  <text x="20" y="1108" class="ecoF" style="fill: #1D1D1F">~$0</text>
  <rect x="364" y="1048" width="340" height="80" rx="14" fill="#FBFBFD" stroke="#E8E8ED" stroke-width="1"/>
  <text x="384" y="1074" class="ecoL">ANNUAL TAKE</text>
  <text x="384" y="1108" class="ecoF" style="fill: #1D1D1F">$200K–2M</text>
  <rect x="728" y="1048" width="340" height="80" rx="14" fill="#E8F2FE" stroke="#0071E3" stroke-width="1"/>
  <text x="748" y="1074" class="ecoL">ON GENERAL</text>
  <text x="748" y="1108" class="ecoF" style="fill: #0071E3">$0</text>
</svg>
