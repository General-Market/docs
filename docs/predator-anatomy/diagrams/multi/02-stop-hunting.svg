<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2050" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0052FF"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF453A"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <!-- background stage -->
  <rect x="0" y="0" width="1600" height="2050" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="320" rx="720" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="2050" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="120" y="180"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">EXTRACTION 02 · THE WICK</text>

  <!-- title (two lines) -->
  <text x="120" y="290"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0A0A0A" class="bloom">Your support</text>
  <text x="120" y="380"
        font-size="72" font-weight="800" letter-spacing="-2.4" fill="#0052FF" class="bloom">is their menu.</text>

  <!-- tagline -->
  <text x="120" y="455"
        font-family="'SF Pro Text', sans-serif"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">Stops cluster at obvious levels. Depth-of-book makes the menu legible to one side only.</text>

  <!-- voice + context -->
  <line x1="120" y1="500" x2="1480" y2="500" stroke="rgba(10,10,12,0.10)" stroke-width="1"/>
  <text x="120" y="555" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">VOICE OF THE OPERATOR</text>
  <text x="120" y="605" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">Markets are an extraordinarily competitive</text>
  <text x="120" y="643" font-size="26" font-weight="500" letter-spacing="-0.55" fill="#0A0A0A">arena. The information advantage is the game.</text>
  <text x="120" y="687" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.35" fill="#0A0A0A">Kenneth C. Griffin</text>
  <text x="120" y="711" font-family="'SF Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5" fill="#6E727A">FOUNDER &amp; CEO, CITADEL LLC · CITADEL.COM</text>
  <text x="860" y="605" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Citadel's hedge fund and securities arms</text>
  <text x="860" y="631" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">see depth retail cannot. Fourteen thousand</text>
  <text x="860" y="657" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">stops at $99.50 read to the firm as a</text>
  <text x="860" y="683" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">coordinated exit it can trigger at will.</text>

  <!-- step 01 -->
  <circle cx="160" cy="820" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="825" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">01</text>
  <text x="210" y="814" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Stops cluster at support.</text>
  <text x="210" y="850" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Retail places stops where the chart</text>
  <text x="210" y="874" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">looks like support.</text>
  <g transform="translate(900, 790)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6E727A">PRICE</text>
    <line x1="0" y1="60" x2="320" y2="60" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="80" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <line x1="160" y1="60" x2="160" y2="80" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <line x1="260" y1="60" x2="260" y2="80" stroke="rgba(10,10,12,0.30)" stroke-width="1.5"/>
    <text x="160" y="100" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#0A0A0A">$99.50 — support</text>
    <text x="160" y="118" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6E727A">CLUSTER OF STOPS BELOW</text>
  </g>

  <line x1="160" y1="844" x2="160" y2="969" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 02 -->
  <circle cx="160" cy="995" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1000" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">02</text>
  <text x="210" y="989" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Depth makes them legible.</text>
  <text x="210" y="1025" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Level 3 shows every working order.</text>
  <text x="210" y="1049" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Retail buys the chart, not the depth.</text>
  <g transform="translate(900, 965)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">LEVEL 3 DEPTH FEED</text>
    <text x="0" y="72" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#0052FF">14,028</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">working stops at $99.50</text>
    <text x="0" y="124" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6E727A">$200K / YR / VENUE</text>
  </g>

  <line x1="160" y1="1019" x2="160" y2="1144" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 03 -->
  <circle cx="160" cy="1170" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1175" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">03</text>
  <text x="210" y="1164" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">The push.</text>
  <text x="210" y="1200" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Five million sold into a thin book.</text>
  <text x="210" y="1224" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Price slides toward the cluster.</text>
  <g transform="translate(900, 1140)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">PUSH SELLS</text>
    <text x="0" y="72" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#0A0A0A">$5M</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">sold into the thin book</text>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#FF453A" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  </g>

  <line x1="160" y1="1194" x2="160" y2="1319" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 04 -->
  <circle cx="160" cy="1345" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1350" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">04</text>
  <text x="210" y="1339" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Cascade triggers.</text>
  <text x="210" y="1375" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Price touches $99.45. The stop wall</text>
  <text x="210" y="1399" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">fires as one synchronised market-sell.</text>
  <g transform="translate(900, 1315)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">CASCADE</text>
    <text x="0" y="72" font-size="32" font-weight="800" letter-spacing="-1.0" fill="#FF453A">$99.45</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">stop wall fires as one</text>
    <text x="0" y="124" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6E727A">SYNCHRONISED MARKET-SELL</text>
  </g>

  <line x1="160" y1="1369" x2="160" y2="1494" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 05 -->
  <circle cx="160" cy="1520" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1525" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">05</text>
  <text x="210" y="1514" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Forced auction.</text>
  <text x="210" y="1550" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Twenty million of unwanted sells.</text>
  <text x="210" y="1574" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Price overshoots to $98.20.</text>
  <g transform="translate(900, 1490)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">FORCED SELLS ADDED</text>
    <text x="0" y="72" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#FF453A">$20M</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">overshoot to $98.20</text>
  </g>

  <line x1="160" y1="1544" x2="160" y2="1669" stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- step 06 -->
  <circle cx="160" cy="1695" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
  <text x="160" y="1700" text-anchor="middle" font-family="'SF Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#0052FF">06</text>
  <text x="210" y="1689" font-size="28" font-weight="700" letter-spacing="-0.62" fill="#0A0A0A">Cover and resell.</text>
  <text x="210" y="1725" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Cover the short low.</text>
  <text x="210" y="1749" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="400" letter-spacing="-0.35" fill="#1F1F24">Resell into the recovery.</text>
  <g transform="translate(900, 1665)">
    <text x="0" y="22" font-family="'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#6E727A">COVER · RESELL</text>
    <text x="0" y="72" font-size="36" font-weight="800" letter-spacing="-1.2" fill="#0052FF">$98.20 → $101</text>
    <text x="0" y="100" font-family="'SF Pro Text', sans-serif" font-size="14" font-weight="500" fill="#1F1F24">round trip on the wick</text>
  </g>

  <!-- economics -->
  <line x1="120" y1="1900" x2="1480" y2="1900" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
  <text x="280" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">OPERATOR SPEND</text>
  <text x="280" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">~$350K/yr</text>
  <text x="800" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">PER CASCADE</text>
  <text x="800" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0A0A0A">$50K–500K</text>
  <text x="1320" y="1955" text-anchor="middle" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">ON GENERAL</text>
  <text x="1320" y="2015" text-anchor="middle" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0052FF">$0</text>
</svg>
