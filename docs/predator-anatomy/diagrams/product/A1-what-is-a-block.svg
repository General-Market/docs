<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0052FF"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1300" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="780" rx="660" ry="260" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="800" y="180" text-anchor="middle"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="22" font-weight="700" letter-spacing="4" fill="#6E727A">PROTOCOL · A1 · THE BUNDLE</text>

  <!-- title -->
  <text x="800" y="320" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0A0A0A" class="bloom">One hundred bets.</text>
  <text x="800" y="420" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0052FF" class="bloom">One sealed ticket.</text>

  <!-- 100 tiny bets in a 10x10 grid above the envelope -->
  <g>
    <text x="800" y="540" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="14" font-weight="700"
          letter-spacing="2.5" fill="#6E727A">100 MARKETS · UP / DOWN</text>
  </g>

  <!-- bet grid: 10 cols × 4 rows of tiny ticker dots, each labeled UP/DOWN
       2 bands x 50 mini chips arranged into a wide funnel. -->
  <g transform="translate(800, 620)">
    <!-- row 1: 25 -->
    <g font-family="'SF Mono', monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle">
      <g transform="translate(-540, 0)">
        <!-- 25 chips, spaced 45px -->
        <g><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(45,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(90,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(135,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(180,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(225,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(270,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(315,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(360,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(405,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(450,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(495,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(540,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(585,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(630,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(675,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(720,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(765,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(810,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(855,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(900,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(945,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(990,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(1035,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(1080,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
      </g>
      <g transform="translate(-380, 38)">
        <g><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(45,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(90,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(135,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(180,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(225,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(270,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(315,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(360,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(405,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(450,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(495,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(540,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(585,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(630,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
        <g transform="translate(675,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▲</text></g>
        <g transform="translate(720,0)"><circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/><text y="4">▼</text></g>
      </g>
    </g>

    <!-- funnel converging into envelope -->
    <line x1="-340" y1="80" x2="-180" y2="160" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
    <line x1="340" y1="80" x2="180" y2="160" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
    <line x1="-50" y1="80" x2="-50" y2="160" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
    <line x1="50" y1="80" x2="50" y2="160" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>

    <!-- envelope (hand-drawn path) -->
    <g transform="translate(0, 290)">
      <!-- envelope body -->
      <path d="M -240 -60 L 240 -60 L 240 80 L -240 80 Z"
            fill="#FFFFFF" stroke="#0052FF" stroke-width="2.5"/>
      <!-- envelope flap -->
      <path d="M -240 -60 L 0 60 L 240 -60"
            fill="none" stroke="#0052FF" stroke-width="2.5"/>
      <!-- wax seal -->
      <circle cx="0" cy="10" r="32" fill="#0052FF"/>
      <text x="0" y="18" text-anchor="middle"
            font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="800"
            fill="#F0F2F4">B</text>
      <!-- label on envelope -->
      <text x="-220" y="-26" font-family="'SF Mono', monospace" font-size="12"
            font-weight="700" letter-spacing="2" fill="#6E727A">BLOCK #042</text>
      <text x="200" y="-26" text-anchor="end"
            font-family="'SF Mono', monospace" font-size="12" font-weight="700"
            letter-spacing="2" fill="#6E727A">SEALED · 100 BETS</text>
    </g>
  </g>

  <!-- caption -->
  <text x="800" y="1180" text-anchor="middle"
        font-size="26" font-weight="500" letter-spacing="-0.58" fill="#1F1F24">A block is one ticket that bundles a hundred up-or-down bets.</text>
  <text x="800" y="1220" text-anchor="middle"
        font-size="26" font-weight="500" letter-spacing="-0.58" fill="#1F1F24">One purchase. One pool. One round. A hundred outcomes.</text>
</svg>
