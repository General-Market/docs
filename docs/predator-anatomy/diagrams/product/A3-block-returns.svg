<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1300" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="780" rx="700" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="800" y="180" text-anchor="middle"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="22" font-weight="700" letter-spacing="4" fill="#6E727A">PROTOCOL · A3 · THE ARITHMETIC</text>

  <!-- title -->
  <text x="800" y="320" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0A0A0A" class="bloom">Forty wrong.</text>
  <text x="800" y="420" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0052FF" class="bloom">Profit anyway.</text>

  <!-- caption -->
  <text x="800" y="500" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="22" font-weight="500"
        letter-spacing="-0.48" fill="#6E727A">Each winning market pays more than each losing market costs.</text>

  <!-- 100-cell grid: 60 blue wins (rows 1-6) + 40 red losses (rows 7-10). 10x10 cells, 40px cell, 8px gap, total 472px square. Centered. -->
  <g transform="translate(564, 580)">
    <!-- legend -->
    <g transform="translate(0, -36)">
      <rect x="0"   y="0" width="14" height="14" rx="3" fill="#0052FF"/>
      <text x="22"  y="12"
            font-family="'SF Mono', monospace" font-size="13" font-weight="600"
            letter-spacing="1.8" fill="#6E727A">60 WINS</text>
      <rect x="170" y="0" width="14" height="14" rx="3" fill="#FF453A" opacity="0.85"/>
      <text x="192" y="12"
            font-family="'SF Mono', monospace" font-size="13" font-weight="600"
            letter-spacing="1.8" fill="#6E727A">40 LOSSES</text>
    </g>

    <!-- rows 1-6: blue wins (60 cells) -->
    <g>
      <rect x="0"   y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="48"  y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="96"  y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="144" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="192" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="240" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="288" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="336" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="384" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="432" y="0"   width="40" height="40" rx="6" fill="#0052FF"/>

      <rect x="0"   y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="48"  y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="96"  y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="144" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="192" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="240" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="288" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="336" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="384" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="432" y="48"  width="40" height="40" rx="6" fill="#0052FF"/>

      <rect x="0"   y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="48"  y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="96"  y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="144" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="192" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="240" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="288" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="336" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="384" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="432" y="96"  width="40" height="40" rx="6" fill="#0052FF"/>

      <rect x="0"   y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="48"  y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="96"  y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="144" y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="192" y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="240" y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="288" y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="336" y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="384" y="144" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="432" y="144" width="40" height="40" rx="6" fill="#0052FF"/>

      <rect x="0"   y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="48"  y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="96"  y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="144" y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="192" y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="240" y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="288" y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="336" y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="384" y="192" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="432" y="192" width="40" height="40" rx="6" fill="#0052FF"/>

      <rect x="0"   y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="48"  y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="96"  y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="144" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="192" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="240" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="288" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="336" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="384" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
      <rect x="432" y="240" width="40" height="40" rx="6" fill="#0052FF"/>
    </g>

    <!-- rows 7-10: red losses (40 cells) -->
    <g>
      <rect x="0"   y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="48"  y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="96"  y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="144" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="192" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="240" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="288" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="336" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="384" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="432" y="288" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>

      <rect x="0"   y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="48"  y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="96"  y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="144" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="192" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="240" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="288" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="336" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="384" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="432" y="336" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>

      <rect x="0"   y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="48"  y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="96"  y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="144" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="192" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="240" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="288" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="336" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="384" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="432" y="384" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>

      <rect x="0"   y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="48"  y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="96"  y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="144" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="192" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="240" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="288" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="336" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="384" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
      <rect x="432" y="432" width="40" height="40" rx="6" fill="#FF453A" opacity="0.85"/>
    </g>
  </g>

  <!-- Economics row -->
  <g transform="translate(0, 1180)">
    <text x="380" y="0" text-anchor="middle"
          font-family="'SF Pro Display', sans-serif" font-size="40" font-weight="800"
          letter-spacing="-1.4" fill="#0A0A0A">+$1.20</text>
    <text x="380" y="34" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="13" font-weight="700"
          letter-spacing="2.34" fill="#6E727A">EACH WIN PAYS</text>

    <text x="800" y="0" text-anchor="middle"
          font-family="'SF Pro Display', sans-serif" font-size="40" font-weight="800"
          letter-spacing="-1.4" fill="#0A0A0A">−$0.50</text>
    <text x="800" y="34" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="13" font-weight="700"
          letter-spacing="2.34" fill="#6E727A">EACH LOSS COSTS</text>

    <text x="1220" y="0" text-anchor="middle"
          font-family="'SF Pro Display', sans-serif" font-size="40" font-weight="800"
          letter-spacing="-1.4" fill="#0052FF">+$52</text>
    <text x="1220" y="34" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="13" font-weight="700"
          letter-spacing="2.34" fill="#6E727A">NET ON 100 BLOCKS</text>
  </g>
</svg>
