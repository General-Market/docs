<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0052FF"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1300" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="800" rx="700" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="800" y="180" text-anchor="middle"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="22" font-weight="700" letter-spacing="4" fill="#6E727A">PROTOCOL · B1 · THE THREE PHASES</text>

  <!-- title -->
  <text x="800" y="320" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0A0A0A" class="bloom">Submit. Reveal.</text>
  <text x="800" y="420" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0052FF" class="bloom">Claim.</text>

  <!-- caption -->
  <text x="800" y="510" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="22" font-weight="500"
        letter-spacing="-0.48" fill="#6E727A">Three ten-minute phases. While you submit, no one sees you.</text>

  <!-- timeline rail with arrowhead -->
  <g transform="translate(0, 800)">
    <line x1="200" y1="0" x2="1400" y2="0"
          stroke="rgba(10,10,12,0.22)" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <!-- tick marks at t=0, 10, 20, 30 -->
    <line x1="200"  y1="-10" x2="200"  y2="10" stroke="rgba(10,10,12,0.22)" stroke-width="1.5"/>
    <line x1="600"  y1="-10" x2="600"  y2="10" stroke="rgba(10,10,12,0.22)" stroke-width="1.5"/>
    <line x1="1000" y1="-10" x2="1000" y2="10" stroke="rgba(10,10,12,0.22)" stroke-width="1.5"/>
    <line x1="1400" y1="-10" x2="1400" y2="10" stroke="rgba(10,10,12,0.22)" stroke-width="1.5"/>

    <!-- time labels -->
    <text x="200"  y="50" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="14" font-weight="700"
          letter-spacing="1.4" fill="#6E727A">t = 0</text>
    <text x="600"  y="50" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="14" font-weight="700"
          letter-spacing="1.4" fill="#6E727A">t = 10 min</text>
    <text x="1000" y="50" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="14" font-weight="700"
          letter-spacing="1.4" fill="#6E727A">t = 20 min</text>
    <text x="1400" y="50" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="14" font-weight="700"
          letter-spacing="1.4" fill="#6E727A">t = 30 min</text>
  </g>

  <!-- phase 1 — SUBMIT -->
  <g transform="translate(400, 660)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="20" font-weight="700"
          letter-spacing="2" fill="#0052FF">01</text>
    <text x="0" y="100" text-anchor="middle"
          font-size="44" font-weight="800" letter-spacing="-1" fill="#0A0A0A">Submit.</text>
    <text x="0" y="148" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="13" font-weight="600"
          letter-spacing="2.34" fill="#6E727A">SEALED</text>
    <text x="0" y="210" text-anchor="middle"
          font-family="'SF Pro Text', sans-serif" font-size="18" font-weight="500"
          letter-spacing="-0.4" fill="#1F1F24">You place your bets.</text>
    <text x="0" y="240" text-anchor="middle"
          font-family="'SF Pro Text', sans-serif" font-size="18" font-weight="500"
          letter-spacing="-0.4" fill="#1F1F24">No one can read them.</text>
  </g>

  <!-- phase 2 — REVEAL -->
  <g transform="translate(800, 660)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="20" font-weight="700"
          letter-spacing="2" fill="#0052FF">02</text>
    <text x="0" y="100" text-anchor="middle"
          font-size="44" font-weight="800" letter-spacing="-1" fill="#0A0A0A">Reveal.</text>
    <text x="0" y="148" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="13" font-weight="600"
          letter-spacing="2.34" fill="#6E727A">PRINTED</text>
    <text x="0" y="210" text-anchor="middle"
          font-family="'SF Pro Text', sans-serif" font-size="18" font-weight="500"
          letter-spacing="-0.4" fill="#1F1F24">Markets close. Prices print.</text>
    <text x="0" y="240" text-anchor="middle"
          font-family="'SF Pro Text', sans-serif" font-size="18" font-weight="500"
          letter-spacing="-0.4" fill="#1F1F24">Every bet, at once.</text>
  </g>

  <!-- phase 3 — CLAIM -->
  <g transform="translate(1200, 660)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="20" font-weight="700"
          letter-spacing="2" fill="#0052FF">03</text>
    <text x="0" y="100" text-anchor="middle"
          font-size="44" font-weight="800" letter-spacing="-1" fill="#0052FF">Claim.</text>
    <text x="0" y="148" text-anchor="middle"
          font-family="'SF Mono', monospace" font-size="13" font-weight="600"
          letter-spacing="2.34" fill="#6E727A">PAID</text>
    <text x="0" y="210" text-anchor="middle"
          font-family="'SF Pro Text', sans-serif" font-size="18" font-weight="500"
          letter-spacing="-0.4" fill="#1F1F24">Winners split the pool.</text>
    <text x="0" y="240" text-anchor="middle"
          font-family="'SF Pro Text', sans-serif" font-size="18" font-weight="500"
          letter-spacing="-0.4" fill="#1F1F24">Losers, the silence.</text>
  </g>

  <!-- closing knife -->
  <text x="800" y="1200" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="600"
        letter-spacing="2.5" fill="#6E727A">ELSEWHERE, EVERY ORDER IS VISIBLE THE SECOND YOU PLACE IT.</text>
</svg>
