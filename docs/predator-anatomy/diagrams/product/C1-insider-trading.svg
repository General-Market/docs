<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0052FF"/>
    </marker>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1300" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#dotgrid)"/>
  <ellipse cx="800" cy="720" rx="640" ry="240" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1600" height="1300" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="800" y="200" text-anchor="middle"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="22" font-weight="700" letter-spacing="4" fill="#6E727A">REFUSAL · C1 · INSIDER TRADING</text>

  <!-- problem -->
  <text x="800" y="440" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#FF453A">Some traders see the bet</text>
  <text x="800" y="540" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#FF453A">before it settles.</text>

  <!-- down arrow -->
  <line x1="800" y1="620" x2="800" y2="760" stroke="#0052FF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- shield, just left of the fix line -->
  <g transform="translate(440, 850) scale(3.6)">
    <path d="M12 1.4 L22 5 L22 13 C22 19 17.4 24.8 12 26.6 C6.6 24.8 2 19 2 13 L2 5 Z" fill="#0052FF"/>
    <path d="M7.6 13.4 L10.8 16.6 L16.8 9.6" stroke="#F0F2F4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- fix -->
  <text x="820" y="910" text-anchor="middle"
        font-size="84" font-weight="800" letter-spacing="-3.2" fill="#0052FF" class="bloom">Sealed bets.</text>

  <!-- caption -->
  <text x="800" y="1100" text-anchor="middle"
        font-size="26" font-weight="500" letter-spacing="-0.58" fill="#1F1F24">Bets are encrypted until the round closes.</text>
  <text x="800" y="1140" text-anchor="middle"
        font-size="26" font-weight="500" letter-spacing="-0.58" fill="#1F1F24">An insider with one secret still has ninety-nine guesses left.</text>

  <text x="800" y="1230" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="16" font-weight="700"
        letter-spacing="3" fill="#6E727A">EDGE: 100% → 0.1%</text>
</svg>
