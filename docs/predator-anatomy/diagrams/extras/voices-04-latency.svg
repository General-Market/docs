<text x="84" y="220" font-family="'SF Mono', monospace" font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">VOICE · 04</text>

<text x="84" y="360" font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500" letter-spacing="-0.8" fill="#0A0A0A">“See value,</text>
<text x="84" y="408" font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500" letter-spacing="-0.8" fill="#0A0A0A">place bet,</text>
<text x="84" y="476" font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500" letter-spacing="-0.8" fill="#0A0A0A">line’s</text>
<text x="84" y="524" font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500" letter-spacing="-0.8" fill="#0A0A0A">already</text>
<text x="84" y="572" font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500" letter-spacing="-0.8" fill="#0A0A0A">shifted.”</text>

<text x="84" y="1980" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="500" letter-spacing="-0.35" fill="#6E727A">— retail trader</text>
<text x="84" y="2006" font-family="'SF Pro Text', sans-serif" font-size="16" font-weight="500" letter-spacing="-0.35" fill="#6E727A">r/sportsbook, 2024</text>
