<text x="1390" y="988" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:800;fill:#FFFFFF;letter-spacing:0.8px">PRED</text>
<text x="1390" y="1002" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:10px;font-weight:800;fill:#FFFFFF;letter-spacing:0.8px">ATOR</text>
<path d="M 1372 972 L 1306 1002" fill="none" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
