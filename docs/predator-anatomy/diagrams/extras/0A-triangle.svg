<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" width="1800" height="1400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0052FF"/>
    </marker>
    <style>
      .bloom {
        filter:
          drop-shadow(0 0 6px rgba(255,255,255,0.95))
          drop-shadow(0 0 24px rgba(255,255,255,0.55))
          drop-shadow(0 8px 36px rgba(0, 82, 255, 0.32));
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1400" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="900" y="160" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="18" font-weight="700"
        letter-spacing="3.2" fill="#6E727A">THEORY · 0A · MIMETIC DESIRE</text>

  <!-- title (one declarative line) -->
  <text x="900" y="290" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="96" font-weight="800"
        letter-spacing="-4.8" fill="#0A0A0A" class="bloom">You don't want the trade.</text>

  <!-- diagram: triangle on the dot-grid stage, no card -->
  <!-- vertices: Object at top (900, 600), You bottom-left (380, 1080), Model bottom-right (1420, 1080) -->

  <!-- triangle edges - 1.5px lines -->
  <line x1="900" y1="600" x2="380" y2="1080" stroke="#0A0A0A" stroke-width="1.5" opacity="0.45"/>
  <line x1="900" y1="600" x2="1420" y2="1080" stroke="#0A0A0A" stroke-width="1.5" opacity="0.45"/>

  <!-- the imitation vector — base of triangle, Base blue -->
  <line x1="410" y1="1080" x2="1390" y2="1080" stroke="#0052FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="900" y="1062" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="18" font-weight="700"
        letter-spacing="1.6" fill="#0052FF">LOOKS TO</text>

  <!-- the desire vector — model → object, Base blue, dashed (the lie) -->
  <line x1="1400" y1="1058" x2="920" y2="630" stroke="#0052FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="1280" y="820" text-anchor="start"
        font-family="'SF Mono', monospace" font-size="18" font-weight="700"
        letter-spacing="1.6" fill="#0052FF">WANTS</text>

  <!-- the illusion — subject → object, dashed faint -->
  <line x1="400" y1="1058" x2="880" y2="630" stroke="#6E727A" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="500" y="820" text-anchor="end"
        font-family="'SF Mono', monospace" font-size="16" font-weight="600"
        letter-spacing="1" fill="#6E727A">(thinks)</text>

  <!-- node: OBJECT (top) -->
  <circle cx="900" cy="600" r="18" fill="#0A0A0A"/>
  <text x="900" y="540" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#6E727A">OBJECT</text>
  <text x="900" y="496" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="30" font-weight="700"
        letter-spacing="-0.66" fill="#0A0A0A">beating the institutions</text>

  <!-- node: YOU (bottom-left) -->
  <circle cx="380" cy="1080" r="18" fill="#0A0A0A"/>
  <text x="380" y="1130" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#6E727A">SUBJECT</text>
  <text x="380" y="1166" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="20" font-weight="500"
        letter-spacing="-0.44" fill="#1F1F24">you</text>

  <!-- node: MODEL (bottom-right) -->
  <circle cx="1420" cy="1080" r="18" fill="#0052FF"/>
  <text x="1420" y="1130" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#0052FF">MODEL</text>
  <text x="1420" y="1166" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="20" font-weight="500"
        letter-spacing="-0.44" fill="#1F1F24">the mediator</text>
  <text x="1420" y="1196" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="600"
        letter-spacing="1" fill="#6E727A">smart-money flow · DD thread · the influencer</text>

  <!-- caption (knife) -->
  <text x="900" y="1300" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="22" font-weight="500"
        letter-spacing="-0.48" fill="#6E727A">Mimetic desire — Girard, 1961. The object is always borrowed.</text>
</svg>
