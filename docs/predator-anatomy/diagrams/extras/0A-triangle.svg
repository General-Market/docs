<text x="900" y="88" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:15px;font-weight:700;fill:#6E6E73;letter-spacing:2.7px">THEORY · 01</text>
<text x="958" y="200" text-anchor="end" style="font-family:'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:80px;font-weight:700;fill:#1D1D1F;letter-spacing:-1.76px">You don't want the trade.</text>
<text x="982" y="200" text-anchor="start" style="font-family:'New York', 'Times New Roman', Georgia, serif;font-size:80px;font-weight:500;fill:#0071E3;font-style:italic;letter-spacing:-1.28px">You want to beat them.</text>
<text x="900" y="290" text-anchor="middle" style="font-family:'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;font-weight:500;fill:#6E6E73;letter-spacing:-0.288px">Mimetic desire — Girard 1961. The object of desire is never the object itself; it is</text>
<text x="900" y="326" text-anchor="middle" style="font-family:'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;font-weight:500;fill:#6E6E73;letter-spacing:-0.288px">mediated by a third party. The retail trader does not want $TSLA. The retail trader</text>
<path d="M 520 1010 L 900 440 L 1280 1010 Z" fill="none" stroke="#D2D2D7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<circle cx="900" cy="440" r="16" fill="#1D1D1F"/>
<text x="900" y="404" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:14px;font-weight:700;fill:#6E6E73;letter-spacing:2.52px">OBJECT</text>
<text x="900" y="368" text-anchor="middle" style="font-family:'New York', 'Times New Roman', Georgia, serif;font-size:28px;font-weight:500;fill:#1D1D1F;font-style:italic;letter-spacing:-0.448px">“beating the institutions”</text>
<text x="900" y="496" text-anchor="middle" style="font-family:'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;font-weight:500;fill:#6E6E73">status, not yield</text>
<circle cx="520" cy="1010" r="16" fill="#1D1D1F"/>
<text x="520" y="1054" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:14px;font-weight:700;fill:#6E6E73;letter-spacing:2.52px">YOU</text>
<text x="520" y="1086" text-anchor="middle" style="font-family:'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;font-weight:500;fill:#6E6E73">the subject</text>
<circle cx="1280" cy="1010" r="16" fill="#0071E3"/>
<text x="1280" y="1054" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:14px;font-weight:700;fill:#0071E3;letter-spacing:2.52px">MODEL</text>
<text x="1280" y="1086" text-anchor="middle" style="font-family:'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;font-weight:500;fill:#0071E3">the mediator</text>
<text x="1280" y="1110" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;font-size:12px;font-weight:600;fill:#6E6E73">“smart money flow” · DD thread · the influencer</text>
