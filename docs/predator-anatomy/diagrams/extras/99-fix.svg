<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <style>
      .bloom {
        filter:
          drop-shadow(0 0 6px rgba(255,255,255,0.95))
          drop-shadow(0 0 24px rgba(255,255,255,0.55))
          drop-shadow(0 8px 36px rgba(0, 82, 255, 0.32));
      }
    </style>
  </defs>

  <rect x="0" y="0" width="2400" height="1600" fill="#F0F2F4"/>
  <rect x="0" y="0" width="2400" height="1600" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="2400" height="1600" fill="url(#vignette)"/>

  <!-- halo behind wordmark -->
  <ellipse cx="1200" cy="720" rx="900" ry="280" fill="url(#halo)" filter="url(#haloBlur)"/>

  <!-- eyebrow -->
  <text x="1200" y="320" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="22" font-weight="700"
        letter-spacing="4" fill="#6E727A">THE FIX · ONE PRIMITIVE</text>

  <!-- hero wordmark -->
  <text x="1200" y="640" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="180" font-weight="800"
        letter-spacing="-9" fill="#0A0A0A" class="bloom">Block</text>
  <text x="1200" y="820" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="180" font-weight="800"
        letter-spacing="-9" fill="#0052FF" class="bloom">trading.</text>

  <!-- tagline -->
  <text x="1200" y="930" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="32" font-weight="500"
        letter-spacing="-0.7" fill="#6E727A">Sealed bets. Parimutuel settlement. One clearing price per round.</text>

  <!-- mechanism counter row -->
  <line x1="700" y1="1080" x2="980" y2="1080" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>
  <line x1="1420" y1="1080" x2="1700" y2="1080" stroke="rgba(10,10,12,0.22)" stroke-width="1"/>

  <g font-family="'SF Mono', monospace" font-size="16" font-weight="700" fill="#0052FF" letter-spacing="2">
    <circle cx="1020" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1020" y="1087" text-anchor="middle">01</text>
    <circle cx="1080" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1080" y="1087" text-anchor="middle">02</text>
    <circle cx="1140" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1140" y="1087" text-anchor="middle">03</text>
    <circle cx="1200" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1200" y="1087" text-anchor="middle">04</text>
    <circle cx="1260" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1260" y="1087" text-anchor="middle">05</text>
    <circle cx="1320" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1320" y="1087" text-anchor="middle">06</text>
    <circle cx="1380" cy="1080" r="22" fill="none" stroke="#0052FF" stroke-width="1.5"/>
    <text x="1380" y="1087" text-anchor="middle">07</text>
  </g>

  <text x="1200" y="1170" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="16" font-weight="700"
        letter-spacing="3" fill="#6E727A">SEVEN EXTRACTIONS — REFUSED</text>

  <!-- closing line -->
  <text x="1200" y="1380" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500"
        letter-spacing="-0.8" fill="#0A0A0A">If you can’t trade like a hedge fund,</text>
  <text x="1200" y="1432" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="36" font-weight="500"
        letter-spacing="-0.8" fill="#0052FF">trade where hedge funds trade like you.</text>

  <!-- caption -->
  <text x="1200" y="1520" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="16" font-weight="700"
        letter-spacing="3" fill="#6E727A">GENERALMARKET.IO</text>
</svg>
