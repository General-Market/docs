<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" width="1800" height="1400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0052FF"/>
    </marker>
    <marker id="arrBlueRev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#0052FF"/>
    </marker>
    <style>
      .bloom {
        filter:
          drop-shadow(0 0 6px rgba(255,255,255,0.95))
          drop-shadow(0 0 24px rgba(255,255,255,0.55))
          drop-shadow(0 8px 36px rgba(0, 82, 255, 0.32));
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1400" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="900" y="160" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="18" font-weight="700"
        letter-spacing="3.2" fill="#6E727A">THEORY · 0B · RIVALRY · THE DOUBLES</text>

  <!-- title -->
  <text x="900" y="290" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="96" font-weight="800"
        letter-spacing="-4.8" fill="#0A0A0A" class="bloom">Start winning. The door closes.</text>

  <!-- two mirrored figures — symmetric diagram, no card wrap -->
  <!-- left figure: RETAIL, right figure: HOUSE. They start as doubles, then a wall drops. -->

  <!-- vertical wall down the middle — the "limit", Base blue -->
  <line x1="900" y1="500" x2="900" y2="1180" stroke="#0052FF" stroke-width="3"/>
  <text x="900" y="475" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#0052FF">THE LIMIT</text>

  <!-- LEFT — retail figure -->
  <!-- head -->
  <circle cx="440" cy="600" r="48" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- body -->
  <path d="M 440 660 L 440 880" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- reaching arm (toward the limit) -->
  <path d="M 440 720 L 760 740" fill="none" stroke="#0A0A0A" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <!-- legs -->
  <path d="M 440 880 L 380 980" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  <path d="M 440 880 L 500 980" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>

  <text x="440" y="1060" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#0A0A0A">RETAIL</text>
  <text x="440" y="1098" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="20" font-weight="500"
        letter-spacing="-0.44" fill="#1F1F24">starts winning</text>

  <!-- RIGHT — house figure (mirror of left) -->
  <circle cx="1360" cy="600" r="48" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  <path d="M 1360 660 L 1360 880" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  <!-- reaching arm meeting the wall -->
  <path d="M 1360 720 L 1040 740" fill="none" stroke="#0A0A0A" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path d="M 1360 880 L 1300 980" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  <path d="M 1360 880 L 1420 980" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>

  <text x="1360" y="1060" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#0A0A0A">HOUSE</text>
  <text x="1360" y="1098" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="20" font-weight="500"
        letter-spacing="-0.44" fill="#1F1F24">closes the table</text>

  <!-- labels on the wall — the rungs -->
  <g font-family="'SF Mono', monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#6E727A">
    <line x1="860" y1="560" x2="940" y2="560" stroke="#0052FF" stroke-width="1.5"/>
    <text x="950" y="566">PRINCIPAL TRADER</text>
    <line x1="860" y1="640" x2="940" y2="640" stroke="#0052FF" stroke-width="1.5"/>
    <text x="950" y="646">FUND LP</text>
    <line x1="860" y1="720" x2="940" y2="720" stroke="#0052FF" stroke-width="1.5"/>
    <text x="950" y="726">PROP FIRM</text>
    <line x1="860" y1="800" x2="940" y2="800" stroke="#0052FF" stroke-width="1.5"/>
    <text x="950" y="806">SMALL FUNDED</text>
    <line x1="860" y1="880" x2="940" y2="880" stroke="#0052FF" stroke-width="1.5"/>
    <text x="950" y="886">RETAIL</text>
  </g>

  <!-- max bet stat — the violence of the limit, big number on the dot-grid stage -->
  <text x="900" y="1232" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">DRAFTKINGS · MAX BET · 14H AFTER VIP INVITE</text>
  <text x="900" y="1330" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="120" font-weight="800"
        letter-spacing="-6" fill="#0052FF" class="bloom">$1.37</text>
</svg>
