<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" width="1800" height="1400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <style>
      .bloom {
        filter:
          drop-shadow(0 0 6px rgba(255,255,255,0.95))
          drop-shadow(0 0 24px rgba(255,255,255,0.55))
          drop-shadow(0 8px 36px rgba(0, 82, 255, 0.32));
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1400" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="900" y="160" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="18" font-weight="700"
        letter-spacing="3.2" fill="#6E727A">THEORY · 0D · PHARMAKON</text>

  <!-- title -->
  <text x="900" y="290" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="96" font-weight="800"
        letter-spacing="-4.8" fill="#0A0A0A" class="bloom">Cure and poison, same hand.</text>

  <!-- halo behind the shield -->
  <ellipse cx="900" cy="850" rx="540" ry="280" fill="url(#halo)" filter="url(#haloBlur)"/>

  <!-- the broken mechanism: a gear cracked through the centre.
       Eight-tooth gear at (900, 850), radius 220. Faint, ink-coloured, broken. -->
  <g opacity="0.32">
    <!-- gear outer teeth, drawn as a star polygon -->
    <path d="
      M 900 610
      L 940 644 L 988 626
      L 1010 670 L 1062 678
      L 1062 730 L 1108 758
      L 1086 802 L 1118 842
      L 1086 884 L 1108 928
      L 1062 956 L 1062 1008
      L 1010 1016 L 988 1060
      L 940 1042 L 900 1076
      L 860 1042 L 812 1060
      L 790 1016 L 738 1008
      L 738 956 L 692 928
      L 714 884 L 682 842
      L 714 802 L 692 758
      L 738 730 L 738 678
      L 790 670 L 812 626
      L 860 644 Z"
      fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
    <!-- gear inner ring -->
    <circle cx="900" cy="843" r="120" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
    <!-- gear hub -->
    <circle cx="900" cy="843" r="36" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
  </g>

  <!-- the fracture: jagged line tearing through the gear -->
  <path d="M 650 700 L 760 790 L 720 850 L 880 900 L 840 960 L 1020 980 L 990 1040 L 1180 1020"
        fill="none" stroke="#0A0A0A" stroke-width="2.5" opacity="0.55" stroke-linejoin="miter"/>

  <!-- the shield — ShieldIcon path scaled and centred over the gear.
       Original viewBox 24×28. Scale to ~360 wide → factor 15. Centre at (900, 850).
       Path origin offset: shape spans x[2..22] y[1.4..26.6]; centre = (12, 14).
       transform: translate(900 - 12*15, 850 - 14*15) scale(15) = translate(720, 640) scale(15) -->
  <g transform="translate(720, 640) scale(15)">
    <path d="M12 1.4 L22 5 L22 13 C22 19 17.4 24.8 12 26.6 C6.6 24.8 2 19 2 13 L2 5 Z"
          fill="#0052FF"/>
    <path d="M7.6 13.4 L10.8 16.6 L16.8 9.6"
          stroke="#0A0A0A" stroke-width="2.6" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- label for the shield -->
  <text x="900" y="1180" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#0052FF">THE APP</text>
  <text x="900" y="1220" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="700"
        letter-spacing="-0.7" fill="#0A0A0A">makes the cycle visible. Visibility kills it.</text>

  <!-- caption (knife) -->
  <text x="900" y="1320" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="22" font-weight="500"
        letter-spacing="-0.48" fill="#6E727A">Pharmakon — Plato, 370 BCE. The remedy is the wound, named.</text>
</svg>
