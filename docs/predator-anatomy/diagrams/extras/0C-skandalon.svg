<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" width="1800" height="1400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0052FF"/>
    </marker>
    <style>
      .bloom {
        filter:
          drop-shadow(0 0 6px rgba(255,255,255,0.95))
          drop-shadow(0 0 24px rgba(255,255,255,0.55))
          drop-shadow(0 8px 36px rgba(0, 82, 255, 0.32));
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1400" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#dotgrid)"/>
  <rect x="0" y="0" width="1800" height="1400" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="900" y="160" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="18" font-weight="700"
        letter-spacing="3.2" fill="#6E727A">THEORY · 0C · SKANDALON</text>

  <!-- title -->
  <text x="900" y="290" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="96" font-weight="800"
        letter-spacing="-4.8" fill="#0A0A0A" class="bloom">The crowd needs one to blame.</text>

  <!-- halo behind the scapegoat node -->
  <ellipse cx="900" cy="870" rx="360" ry="200" fill="url(#halo)" filter="url(#haloBlur)"/>

  <!-- four converging arrows on the centre node.
       Sources at the cardinals, target at (900, 870), radius 16 around centre. -->

  <!-- North source: (900, 510) -->
  <line x1="900" y1="540" x2="900" y2="820" stroke="#0052FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- East source: (1280, 870) -->
  <line x1="1250" y1="870" x2="970" y2="870" stroke="#0052FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- South source: (900, 1230) -->
  <line x1="900" y1="1200" x2="900" y2="920" stroke="#0052FF" stroke-width="2" marker-end="url(#arrBlue)"/>
  <!-- West source: (520, 870) -->
  <line x1="550" y1="870" x2="830" y2="870" stroke="#0052FF" stroke-width="2" marker-end="url(#arrBlue)"/>

  <!-- crowd node: NORTH -->
  <circle cx="900" cy="510" r="14" fill="#0A0A0A"/>
  <text x="900" y="468" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">RETAIL</text>

  <!-- crowd node: EAST -->
  <circle cx="1280" cy="870" r="14" fill="#0A0A0A"/>
  <text x="1320" y="876" text-anchor="start"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">PRESS</text>

  <!-- crowd node: SOUTH -->
  <circle cx="900" cy="1230" r="14" fill="#0A0A0A"/>
  <text x="900" y="1282" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">CONGRESS</text>

  <!-- crowd node: WEST -->
  <circle cx="520" cy="870" r="14" fill="#0A0A0A"/>
  <text x="480" y="876" text-anchor="end"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">SEC</text>

  <!-- the scapegoat — Base blue, slightly larger -->
  <circle cx="900" cy="870" r="22" fill="#0052FF"/>
  <text x="900" y="942" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#0052FF">SCAPEGOAT</text>
  <text x="900" y="982" text-anchor="middle"
        font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="700"
        letter-spacing="-0.7" fill="#0A0A0A">one name. one face. one app.</text>
  <text x="900" y="1024" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="600"
        letter-spacing="1" fill="#6E727A">named on camera · screenshotted · forgiven by Monday</text>

  <!-- caption (knife) -->
  <text x="900" y="1340" text-anchor="middle"
        font-family="'SF Pro Text', sans-serif" font-size="22" font-weight="500"
        letter-spacing="-0.48" fill="#6E727A">Naming the predator does not unmake it. It re-elects it.</text>
</svg>
