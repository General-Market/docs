<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Price chart: steady at $100, wicks down to $99.45 to trigger a cluster of stops at $99.50, then snaps back to $100.50"><rect width="660" height="280" fill="#FBFBFD"/>
        <defs>
          <style>
            .gx { stroke: #ECECEE; stroke-width: 1; }
            .ax2 { stroke: #D2D2D7; stroke-width: 1; }
            .pl { stroke: #1D1D1F; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
            .stop-line { stroke: #DD0426; stroke-width: 1; stroke-dasharray: 4 3; }
            .stop-bar { fill: #DD0426; opacity: 0.7; }
            .lblP { font: 600 11px var(--mono, monospace); fill: #6E6E73; }
            .lblA { font: 700 12px var(--mono, monospace); fill: #1D1D1F; }
            .annot { font: 700 11px var(--mono, monospace); fill: #DD0426; letter-spacing: 0.04em; }
          </style>
        </defs>
        <!-- Grid -->
        <line x1="60" y1="56" x2="640" y2="56" class="gx"/>
        <line x1="60" y1="108" x2="640" y2="108" class="gx"/>
        <line x1="60" y1="160" x2="640" y2="160" class="gx"/>
        <line x1="60" y1="212" x2="640" y2="212" class="gx"/>
        <!-- Y axis labels -->
        <text x="48" y="60" text-anchor="end" class="lblP">$101</text>
        <text x="48" y="112" text-anchor="end" class="lblP">$100.50</text>
        <text x="48" y="164" text-anchor="end" class="lblP">$100</text>
        <text x="48" y="216" text-anchor="end" class="lblP">$99.50</text>
        <!-- Stop cluster band at $99.50 -->
        <rect x="60" y="208" width="580" height="14" class="stop-bar"/>
        <text x="640" y="216" text-anchor="end" font-family="SF Mono, monospace" font-weight="700" font-size="11" fill="#FFF">STOP CLUSTER</text>
        <!-- Price line: flat → wick → snap back -->
        <path class="pl" d="M 60 160 L 140 158 L 220 162 L 300 160 L 340 162 L 380 215 L 420 220 L 440 180 L 480 148 L 520 112 L 580 110 L 640 114"/>
        <!-- Wick highlight -->
        <circle cx="400" cy="222" r="6" fill="#DD0426" opacity="0.85"/>
        <text x="400" y="248" text-anchor="middle" class="annot">STOPS TRIGGERED</text>
        <!-- MM annotation -->
        <text x="120" y="180" class="lblA">MM sells $5M</text>
        <path d="M 120 184 L 140 200" stroke="#1D1D1F" stroke-width="1.5" fill="none" marker-end="url(#arrK)"/>
        <text x="540" y="98" class="lblA">MM covers, sells $101</text>
        <path d="M 540 102 L 520 110" stroke="#1D1D1F" stroke-width="1.5" fill="none" marker-end="url(#arrK)"/>
        <defs>
          <marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F"/>
          </marker>
        </defs>
        <text x="350" y="270" text-anchor="middle" class="lblP">Level 3 feed showed the wall. Five million in selling triggered twenty million of forced unwinds.</text>
      </svg>