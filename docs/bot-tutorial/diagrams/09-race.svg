<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <style>
    .eyebrow { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E727A; letter-spacing: 2.34px; }
    .title   { font: 700 44px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #0A0A0A; letter-spacing: -0.968px; }
    .tagline { font: 500 19px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #6E727A; letter-spacing: -0.228px; }
    .term-mute { font: 500 12px "SF Mono", ui-monospace, Menlo, monospace; fill: #8A8E94; }
    .term     { font: 500 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #E8E8ED; }
    .term-cmd { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .term-tag { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #2997FF; }
    .term-ok  { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #34C759; }
    .term-bad { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #FF453A; }
    .term-mut { font: 500 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #8A8E94; }
    .term-acc { font: 700 14px "SF Mono", ui-monospace, Menlo, monospace; fill: #FFD60A; }
    .pill    { font: 700 16px "SF Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .caption { font: 400 16px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #1F1F24; letter-spacing: -0.08px; }
    .vs      { font: 800 28px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #0A0A0A; letter-spacing: -0.616px; }
    .tag-l   { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E727A; letter-spacing: 1.98px; }
    .res-head { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E727A; letter-spacing: 1.4px; }
    .res-row  { font: 500 16px "SF Mono", ui-monospace, Menlo, monospace; fill: #0A0A0A; letter-spacing: -0.08px; }
    .res-name { font: 700 16px "SF Mono", ui-monospace, Menlo, monospace; fill: #0A0A0A; letter-spacing: -0.08px; }
  </style>

  <rect x="0" y="0" width="1500" height="1100" rx="14" fill="#F0F2F4" stroke="#E8E8ED" stroke-width="1"/>

  <text x="60" y="82" class="eyebrow">STEP 09 · THE RACE</text>
  <text x="60" y="146" class="title">Run two strategies. Let them disagree.</text>
  <text x="60" y="190" class="tagline">Two wallets. Two strategies. Same block, same tick. Backtest accuracy is theory. Race PnL is evidence.</text>

  <!-- left terminal: ensemble -->
  <rect x="60" y="240" width="660" height="500" rx="12" fill="#0A0A0A"/>
  <rect x="60" y="240" width="660" height="44" rx="12" fill="#2C2C2E"/>
  <rect x="60" y="276" width="660" height="8" fill="#2C2C2E"/>
  <circle cx="86" cy="262" r="6" fill="#FF5F57"/>
  <circle cx="106" cy="262" r="6" fill="#FEBC2E"/>
  <circle cx="126" cy="262" r="6" fill="#28C840"/>
  <text x="148" y="266" class="term-mute">wallet A · ensemble</text>

  <g transform="translate(86, 312)">
    <text x="0" y="0" class="term-mute">$ </text>
    <text x="14" y="0" class="term-cmd">live_trader.py --strategy ensemble --deposit 0.1</text>

    <text x="0" y="32" class="term-tag">[trader]</text>
    <text x="76" y="32" class="term">batch 412 · 8217 markets</text>
    <text x="0" y="56" class="term-tag">[trader]</text>
    <text x="76" y="56" class="term">strategy=ensemble</text>
    <text x="0" y="80" class="term-tag">[trader]</text>
    <text x="76" y="80" class="term">join </text>
    <text x="112" y="80" class="term-ok">✓</text>
    <text x="128" y="80" class="term-mut">tx 0x7e2c…</text>

    <text x="0" y="124" class="term-tag">[reveal]</text>
    <text x="80" y="124" class="term">oracle{1,2,3}</text>
    <text x="196" y="124" class="term-ok">✓</text>

    <text x="0" y="166" class="term-mut">tick    bets    pnl     cum</text>
    <text x="0" y="190" class="term-mut">───── ───── ────── ───────</text>
    <text x="0" y="214" class="term">412   ↑↑↓↑   </text>
    <text x="148" y="214" class="term-ok">+0.008</text>
    <text x="216" y="214" class="term">+0.008</text>
    <text x="0" y="238" class="term">413   ↓↑↑↑   </text>
    <text x="148" y="238" class="term-ok">+0.012</text>
    <text x="216" y="238" class="term">+0.020</text>
    <text x="0" y="262" class="term">414   ↓↓↑↓   </text>
    <text x="148" y="262" class="term-bad">−0.003</text>
    <text x="216" y="262" class="term">+0.017</text>
    <text x="0" y="286" class="term">415   ↑↑↑↓   </text>
    <text x="148" y="286" class="term-ok">+0.015</text>
    <text x="216" y="286" class="term">+0.032</text>
    <text x="0" y="310" class="term">  …</text>
    <text x="0" y="334" class="term">423   ↓↑↑↑   </text>
    <text x="148" y="334" class="term-ok">+0.011</text>
    <text x="216" y="334" class="term">+0.087</text>

    <text x="0" y="380" class="term-mut">12 joins · 1.20 wagered · </text>
    <text x="0" y="404" class="term-ok">PnL +0.087  ·  ROI +7.2%</text>
  </g>

  <!-- VS divider -->
  <g transform="translate(750, 480)">
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#0052FF" stroke-width="1.5"/>
    <text x="0" y="9" class="vs" text-anchor="middle" style="fill:#0052FF">vs</text>
  </g>

  <!-- right terminal: all_yes -->
  <rect x="780" y="240" width="660" height="500" rx="12" fill="#0A0A0A"/>
  <rect x="780" y="240" width="660" height="44" rx="12" fill="#2C2C2E"/>
  <rect x="780" y="276" width="660" height="8" fill="#2C2C2E"/>
  <circle cx="806" cy="262" r="6" fill="#FF5F57"/>
  <circle cx="826" cy="262" r="6" fill="#FEBC2E"/>
  <circle cx="846" cy="262" r="6" fill="#28C840"/>
  <text x="868" y="266" class="term-mute">wallet B · all_yes</text>

  <g transform="translate(806, 312)">
    <text x="0" y="0" class="term-mute">$ </text>
    <text x="14" y="0" class="term-cmd">live_trader.py --strategy all_yes --deposit 0.1</text>

    <text x="0" y="32" class="term-tag">[trader]</text>
    <text x="76" y="32" class="term">batch 412 · 8217 markets</text>
    <text x="0" y="56" class="term-tag">[trader]</text>
    <text x="76" y="56" class="term">strategy=all_yes</text>
    <text x="0" y="80" class="term-tag">[trader]</text>
    <text x="76" y="80" class="term">join </text>
    <text x="112" y="80" class="term-ok">✓</text>
    <text x="128" y="80" class="term-mut">tx 0x91ab…</text>

    <text x="0" y="124" class="term-tag">[reveal]</text>
    <text x="80" y="124" class="term">oracle{1,2,3}</text>
    <text x="196" y="124" class="term-ok">✓</text>

    <text x="0" y="166" class="term-mut">tick    bets    pnl     cum</text>
    <text x="0" y="190" class="term-mut">───── ───── ────── ───────</text>
    <text x="0" y="214" class="term">412   ↑↑↑↑   </text>
    <text x="148" y="214" class="term-bad">−0.004</text>
    <text x="216" y="214" class="term">−0.004</text>
    <text x="0" y="238" class="term">413   ↑↑↑↑   </text>
    <text x="148" y="238" class="term-ok">+0.006</text>
    <text x="216" y="238" class="term">+0.002</text>
    <text x="0" y="262" class="term">414   ↑↑↑↑   </text>
    <text x="148" y="262" class="term-bad">−0.011</text>
    <text x="216" y="262" class="term">−0.009</text>
    <text x="0" y="286" class="term">415   ↑↑↑↑   </text>
    <text x="148" y="286" class="term-ok">+0.005</text>
    <text x="216" y="286" class="term">−0.004</text>
    <text x="0" y="310" class="term">  …</text>
    <text x="0" y="334" class="term">423   ↑↑↑↑   </text>
    <text x="148" y="334" class="term-bad">−0.007</text>
    <text x="216" y="334" class="term">−0.043</text>

    <text x="0" y="380" class="term-mut">12 joins · 1.20 wagered · </text>
    <text x="0" y="404" class="term-bad">PnL −0.043  ·  ROI −3.6%</text>
  </g>

  <!-- bottom: race report -->
  <rect x="60" y="760" width="1380" height="200" rx="12" fill="#FFFFFF" stroke="#E8E8ED"/>
  <text x="92" y="800" class="tag-l">RACE REPORT  ·  ./race.sh ensemble all_yes 0.1</text>

  <g transform="translate(92, 826)">
    <text x="0" y="0" class="res-head">STRATEGY</text>
    <text x="280" y="0" class="res-head">JOINS</text>
    <text x="420" y="0" class="res-head">WAGERED</text>
    <text x="620" y="0" class="res-head">PNL</text>
    <text x="820" y="0" class="res-head">ROI</text>
    <text x="980" y="0" class="res-head">CUM CURVE</text>

    <line x1="0" y1="14" x2="1296" y2="14" stroke="#E8E8ED"/>

    <text x="0" y="50" class="res-name">ensemble</text>
    <text x="280" y="50" class="res-row">12</text>
    <text x="420" y="50" class="res-row">1.20 wUSDC</text>
    <text x="620" y="50" class="res-row" style="fill:#0A7C42">+0.087</text>
    <text x="820" y="50" class="res-row" style="fill:#0A7C42">+7.2%</text>
    <!-- mini sparkline -->
    <polyline points="980,52 1010,48 1040,46 1070,42 1100,40 1130,36 1160,34 1190,30 1220,28 1250,26 1280,22" fill="none" stroke="#0A7C42" stroke-width="2"/>

    <line x1="0" y1="74" x2="1296" y2="74" stroke="#F5F5F7"/>

    <text x="0" y="106" class="res-name">all_yes</text>
    <text x="280" y="106" class="res-row">12</text>
    <text x="420" y="106" class="res-row">1.20 wUSDC</text>
    <text x="620" y="106" class="res-row" style="fill:#D70015">−0.043</text>
    <text x="820" y="106" class="res-row" style="fill:#D70015">−3.6%</text>
    <polyline points="980,104 1010,108 1040,106 1070,112 1100,114 1130,118 1160,116 1190,122 1220,124 1250,126 1280,130" fill="none" stroke="#D70015" stroke-width="2"/>
  </g>

  <rect x="60" y="970" width="1380" height="64" rx="12" fill="#0052FF"/>
  <text x="92" y="1010" class="pill">$ ./race.sh ensemble all_yes 0.1   →   diff +0.130 wUSDC  (+10.8pp)</text>
  <text x="60" y="1066" class="caption">The only honest benchmark for a bot is another bot. The pool is silent. Your race partner is not.</text>
</svg>
