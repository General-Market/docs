<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1100" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1500" height="1100" fill="url(#dotgrid)"/>
  <ellipse cx="750" cy="330" rx="640" ry="220" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1500" height="1100" fill="url(#vignette)"/>

  <text x="750" y="190" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">STEP 05 · THE BACKTEST</text>

  <text x="750" y="320" text-anchor="middle"
        font-size="96" font-weight="800" letter-spacing="-4.8" fill="#0A0A0A" class="bloom">Yesterday, in eight seconds.</text>

  <g transform="translate(750, 670)">
    <rect x="-580" y="-200" width="1160" height="400" rx="10"
          fill="url(#termBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="-550" cy="-170" r="7" fill="#FF5F57"/>
    <circle cx="-528" cy="-170" r="7" fill="#FEBC2E"/>
    <circle cx="-506" cy="-170" r="7" fill="#28C840"/>
    <text x="-470" y="-165"
          font-family="'SF Mono', monospace"
          font-size="18" font-weight="500" letter-spacing="1.4" fill="#9aa0a6">backtest — 72h walk-forward</text>
    <line x1="-580" y1="-140" x2="580" y2="-140" stroke="rgba(255,255,255,0.08)"/>

    <text x="-540" y="-80" font-family="'SF Mono', monospace" font-size="24" font-weight="500" fill="#9aa0a6">$</text>
    <text x="-510" y="-80" font-family="'SF Mono', monospace" font-size="24" font-weight="500" fill="#f1f3f5">main.py backtest --strategy ensemble --hours 72</text>

    <text x="-540" y="-30" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#5B79FF">[bt]</text>
    <text x="-480" y="-30" font-family="'SF Mono', monospace" font-size="22" font-weight="500" fill="#f1f3f5">8,217 markets × 4,320 ticks  ·  35.5M predictions</text>

    <text x="-540" y="20" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#5B79FF">[result]</text>
    <text x="-440" y="20" font-family="'SF Mono', monospace" font-size="22" font-weight="500" fill="#f1f3f5">aggregate accuracy  </text>
    <text x="-180" y="20" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#FFD60A">97.1%</text>

    <text x="-540" y="60" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#5B79FF">[result]</text>
    <text x="-440" y="60" font-family="'SF Mono', monospace" font-size="22" font-weight="500" fill="#f1f3f5">lift over baseline  </text>
    <text x="-180" y="60" font-family="'SF Mono', monospace" font-size="22" font-weight="700" fill="#28C840">+0.5pp</text>

    <text x="-540" y="100" font-family="'SF Mono', monospace" font-size="22" font-weight="500" fill="#9aa0a6">elapsed 38s</text>

    <text x="-540" y="160" font-family="'SF Mono', monospace" font-size="26" font-weight="700" fill="#28C840">✓ the edge lives in the 19% of ticks that flip.</text>
  </g>

  <text x="750" y="970" text-anchor="middle"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">Forty-eight hours of yesterday. The dead market remembers every move.</text>
</svg>
