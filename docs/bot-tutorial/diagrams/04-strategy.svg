<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <style>
    .eyebrow { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E727A; letter-spacing: 2.34px; }
    .title   { font: 700 44px "SF Pro Display", "Helvetica Neue", sans-serif; fill: #0A0A0A; letter-spacing: -0.968px; }
    .tagline { font: 500 19px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #6E727A; letter-spacing: -0.228px; }
    .row-tag { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #0052FF; letter-spacing: 0.91px; }
    .row-name{ font: 700 22px "SF Mono", ui-monospace, Menlo, monospace; fill: #0A0A0A; letter-spacing: -0.484px; }
    .row-desc{ font: 500 16px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #1F1F24; letter-spacing: -0.08px; }
    .row-mut { font: 400 14px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #6E727A; letter-spacing: -0.07px; }
    .pill    { font: 700 16px "SF Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .caption { font: 400 16px "SF Pro Text", "Helvetica Neue", sans-serif; fill: #1F1F24; letter-spacing: -0.08px; }
    .side-l  { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E727A; letter-spacing: 1.98px; }
    .code    { font: 500 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #0A0A0A; }
    .code-kw { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #AF52DE; }
    .code-str{ font: 500 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #D70015; }
    .code-fn { font: 700 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #0052FF; }
    .code-c  { font: 500 13px "SF Mono", ui-monospace, Menlo, monospace; fill: #6E727A; }
    .tier-1  { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #34C759; letter-spacing: 1.98px; }
    .tier-2  { font: 700 11px "SF Mono", ui-monospace, Menlo, monospace; fill: #FF9F0A; letter-spacing: 1.98px; }
  </style>

  <rect x="0" y="0" width="1500" height="1100" rx="14" fill="#F0F2F4" stroke="#E8E8ED" stroke-width="1"/>

  <text x="60" y="82" class="eyebrow">STEP 04 · THE THESIS</text>
  <text x="60" y="146" class="title">Pick a theory of the future.</text>
  <text x="60" y="190" class="tagline">Seven strategies in the registry. All wrong. Some less wrong than others.</text>

  <!-- left panel: strategy list -->
  <rect x="60" y="240" width="880" height="680" rx="12" fill="#FFFFFF" stroke="#E8E8ED"/>

  <!-- each row -->
  <g transform="translate(92, 274)">
    <text x="0" y="0" class="tier-1">NO MODEL · INSTANT</text>
  </g>

  <g transform="translate(92, 308)">
    <text x="0" y="0" class="row-name">momentum</text>
    <text x="0" y="32" class="row-desc">Bet on inertia. The world keeps doing what it just did.</text>
    <text x="0" y="56" class="row-mut">Direction of last N ticks → same direction.</text>
  </g>
  <line x1="92" y1="390" x2="908" y2="390" stroke="#E8E8ED"/>

  <g transform="translate(92, 416)">
    <text x="0" y="0" class="row-name">rolling</text>
    <text x="0" y="32" class="row-desc">Short-horizon EMA. Smoothed inertia.</text>
    <text x="0" y="56" class="row-mut">Exponential moving average of returns. Decays the past.</text>
  </g>
  <line x1="92" y1="498" x2="908" y2="498" stroke="#E8E8ED"/>

  <g transform="translate(92, 524)">
    <text x="0" y="0" class="row-name">contrarian</text>
    <text x="0" y="32" class="row-desc">Bet against the trend. The world owes you a reversion.</text>
    <text x="0" y="56" class="row-mut">Opposite of momentum. The patient man's prayer.</text>
  </g>
  <line x1="92" y1="606" x2="908" y2="606" stroke="#E8E8ED"/>

  <g transform="translate(92, 632)">
    <text x="0" y="0" class="row-name">all_yes</text>
    <text x="0" y="32" class="row-desc">UP on every market. The honest baseline.</text>
    <text x="0" y="56" class="row-mut">Beat this and the strategy has earned its name.</text>
  </g>

  <g transform="translate(92, 728)">
    <text x="0" y="0" class="tier-2">TRAINED · OPINIONATED</text>
  </g>

  <g transform="translate(92, 762)">
    <text x="0" y="0" class="row-name">xgb</text>
    <text x="0" y="32" class="row-desc">Gradient-boosted trees on 18 features. ~0.5pp lift.</text>
    <text x="0" y="56" class="row-mut">Needs train-xgb. Three minutes of CPU per training.</text>
  </g>
  <line x1="92" y1="844" x2="908" y2="844" stroke="#E8E8ED"/>

  <g transform="translate(92, 870)">
    <text x="0" y="0" class="row-name">ensemble  <tspan class="row-mut">·  blend xgb + rolling</tspan></text>
    <text x="0" y="32" class="row-desc">Weighted vote. Smoother than either alone.</text>
  </g>

  <!-- right panel: define your own -->
  <g transform="translate(980, 240)">
    <rect x="0" y="0" width="460" height="320" rx="12" fill="#FFFFFF" stroke="#E8E8ED"/>
    <text x="24" y="36" class="side-l">OR — WRITE YOUR OWN</text>
    <text x="24" y="64" class="row-mut">strategy.py — register a predictor.</text>

    <g transform="translate(24, 96)">
      <text x="0" y="0" class="code-c"># strategy.py</text>
      <text x="0" y="22" class="code-kw">from</text>
      <text x="50" y="22" class="code">strategy </text>
      <text x="130" y="22" class="code-kw">import</text>
      <text x="194" y="22" class="code">register</text>

      <text x="0" y="62" class="code">@</text>
      <text x="12" y="62" class="code-fn">register</text>
      <text x="86" y="62" class="code">(</text>
      <text x="92" y="62" class="code-str">"my_signal"</text>
      <text x="184" y="62" class="code">)</text>
      <text x="0" y="84" class="code-kw">def</text>
      <text x="38" y="84" class="code-fn">predict_block</text>
      <text x="170" y="84" class="code">(features) -&gt; list[</text>
      <text x="316" y="84" class="code-kw">int</text>
      <text x="344" y="84" class="code">]:</text>
      <text x="0" y="108" class="code">    </text>
      <text x="32" y="108" class="code-c"># return 1 for UP, 0 for DOWN</text>
      <text x="0" y="130" class="code">    </text>
      <text x="32" y="130" class="code-kw">return</text>
      <text x="86" y="130" class="code"> [</text>
      <text x="100" y="130" class="code-kw">int</text>
      <text x="128" y="130" class="code">(f.rolling_12 &gt; </text>
      <text x="252" y="130" class="code-kw">0</text>
      <text x="262" y="130" class="code">) </text>
      <text x="276" y="130" class="code-kw">for</text>
      <text x="306" y="130" class="code"> f </text>
      <text x="328" y="130" class="code-kw">in</text>
      <text x="346" y="130" class="code"> features]</text>
    </g>

    <text x="24" y="280" class="row-mut">Eighteen features available in features.py</text>
    <text x="24" y="300" class="row-mut">— price, ema, volatility, distance, …</text>
  </g>

  <g transform="translate(980, 580)">
    <rect x="0" y="0" width="460" height="160" rx="12" fill="#E5EBFF" stroke="#9FB3FF"/>
    <text x="24" y="36" class="side-l" style="fill:#0052FF">THE EDGE</text>
    <text x="24" y="76" class="row-desc">+0.5pp over the sticky baseline.</text>
    <text x="24" y="100" class="row-mut">~20% flip-catch rate on direction changes.</text>
    <text x="24" y="124" class="row-mut">In a parimutuel, every pp counts.</text>
  </g>

  <g transform="translate(980, 760)">
    <rect x="0" y="0" width="460" height="160" rx="12" fill="#FFFFFF" stroke="#E8E8ED"/>
    <text x="24" y="36" class="side-l">THE COST</text>
    <text x="24" y="76" class="row-desc">A theory that cannot beat all_yes</text>
    <text x="24" y="100" class="row-desc">has no edge — only complexity.</text>
    <text x="24" y="130" class="row-mut">Race it. Don't trust it.</text>
  </g>

  <rect x="60" y="970" width="1380" height="64" rx="12" fill="#0A0A0A"/>
  <text x="92" y="1010" class="pill">--strategy &lt;momentum | rolling | contrarian | all_yes | xgb | ensemble | claude&gt;</text>
  <text x="60" y="1066" class="caption">A strategy is a theory expressed in code. The pool doesn't care which one you bring. It only counts.</text>
</svg>
