<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1100" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1500" height="1100" fill="url(#dotgrid)"/>
  <ellipse cx="750" cy="330" rx="640" ry="220" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1500" height="1100" fill="url(#vignette)"/>

  <!-- eyebrow -->
  <text x="750" y="190" text-anchor="middle"
        font-family="'SF Mono', ui-monospace, Menlo, monospace"
        font-size="14" font-weight="700" letter-spacing="2.5" fill="#6E727A">STEP 01 · THE REPO</text>

  <!-- title -->
  <text x="750" y="320" text-anchor="middle"
        font-size="96" font-weight="800" letter-spacing="-4.8" fill="#0A0A0A" class="bloom">Clone the bot.</text>

  <!-- terminal panel -->
  <g transform="translate(750, 660)">
    <rect x="-540" y="-180" width="1080" height="360" rx="10"
          fill="url(#termBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="-510" cy="-150" r="7" fill="#FF5F57"/>
    <circle cx="-488" cy="-150" r="7" fill="#FEBC2E"/>
    <circle cx="-466" cy="-150" r="7" fill="#28C840"/>
    <text x="-430" y="-145"
          font-family="'SF Mono', ui-monospace, monospace"
          font-size="18" font-weight="500" letter-spacing="1.4" fill="#9aa0a6">~/ — vision-bot-examples</text>
    <line x1="-540" y1="-120" x2="540" y2="-120" stroke="rgba(255,255,255,0.08)"/>

    <text x="-500" y="-60" font-family="'SF Mono', monospace" font-size="28" font-weight="500" fill="#9aa0a6">$</text>
    <text x="-470" y="-60" font-family="'SF Mono', monospace" font-size="28" font-weight="500" fill="#f1f3f5">git clone https://github.com/General-Market/vision-bot-examples</text>

    <text x="-500" y="0" font-family="'SF Mono', monospace" font-size="28" font-weight="500" fill="#9aa0a6">$</text>
    <text x="-470" y="0" font-family="'SF Mono', monospace" font-size="28" font-weight="500" fill="#f1f3f5">cd vision-bot-examples</text>

    <text x="-500" y="80" font-family="'SF Mono', monospace" font-size="28" font-weight="700" fill="#5B79FF">→ 3 sources, 1 wallet, zero ceremony.</text>

    <text x="-500" y="140" font-family="'SF Mono', monospace" font-size="22" font-weight="500" fill="#6E727A">twitch/  ·  polymarket/  ·  visualizer/</text>
  </g>

  <!-- caption -->
  <text x="750" y="970" text-anchor="middle"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">The repo is a contract. A wallet that can trade.</text>
</svg>
