<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.6" fill="#0052FF" opacity="0.22"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#F0F2F4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F2F4" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0052FF" stop-opacity="0.45"/>
      <stop offset="40%"  stop-color="#0052FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <style>
      .bloom { filter: drop-shadow(0 0 6px rgba(255,255,255,0.95)) drop-shadow(0 0 24px rgba(255,255,255,0.55)) drop-shadow(0 8px 36px rgba(0,82,255,0.32)); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1100" fill="#F0F2F4"/>
  <rect x="0" y="0" width="1500" height="1100" fill="url(#dotgrid)"/>
  <ellipse cx="750" cy="330" rx="640" ry="220" fill="url(#halo)" filter="url(#haloBlur)"/>
  <rect x="0" y="0" width="1500" height="1100" fill="url(#vignette)"/>

  <text x="750" y="190" text-anchor="middle"
        font-family="'SF Mono', monospace" font-size="14" font-weight="700"
        letter-spacing="2.5" fill="#6E727A">STEP 02 · THE BOOTSTRAP</text>

  <text x="750" y="320" text-anchor="middle"
        font-size="96" font-weight="800" letter-spacing="-4.8" fill="#0A0A0A" class="bloom">It assembles itself.</text>

  <g transform="translate(750, 670)">
    <rect x="-560" y="-200" width="1120" height="400" rx="10"
          fill="url(#termBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="-530" cy="-170" r="7" fill="#FF5F57"/>
    <circle cx="-508" cy="-170" r="7" fill="#FEBC2E"/>
    <circle cx="-486" cy="-170" r="7" fill="#28C840"/>
    <text x="-450" y="-165"
          font-family="'SF Mono', monospace"
          font-size="18" font-weight="500" letter-spacing="1.4" fill="#9aa0a6">~/vision-bot-examples — setup</text>
    <line x1="-560" y1="-140" x2="560" y2="-140" stroke="rgba(255,255,255,0.08)"/>

    <text x="-520" y="-80" font-family="'SF Mono', monospace" font-size="26" font-weight="500" fill="#9aa0a6">$</text>
    <text x="-492" y="-80" font-family="'SF Mono', monospace" font-size="26" font-weight="500" fill="#f1f3f5">./setup.sh --auto-fund</text>

    <text x="-520" y="-20" font-family="'SF Mono', monospace" font-size="24" font-weight="700" fill="#5B79FF">[setup]</text>
    <text x="-420" y="-20" font-family="'SF Mono', monospace" font-size="24" font-weight="500" fill="#f1f3f5">.venv created · requirements installed</text>

    <text x="-520" y="20" font-family="'SF Mono', monospace" font-size="24" font-weight="700" fill="#5B79FF">[setup]</text>
    <text x="-420" y="20" font-family="'SF Mono', monospace" font-size="24" font-weight="500" fill="#f1f3f5">wallet </text>
    <text x="-330" y="20" font-family="'SF Mono', monospace" font-size="24" font-weight="700" fill="#FFD60A">0xB168EF…87cd0a</text>

    <text x="-520" y="60" font-family="'SF Mono', monospace" font-size="24" font-weight="700" fill="#5B79FF">[faucet]</text>
    <text x="-410" y="60" font-family="'SF Mono', monospace" font-size="24" font-weight="500" fill="#f1f3f5">+1.0 WUSDC  ·  +0.01 ETH</text>

    <text x="-520" y="120" font-family="'SF Mono', monospace" font-size="28" font-weight="700" fill="#28C840">✓ ready in 2m 47s</text>
  </g>

  <text x="750" y="970" text-anchor="middle"
        font-size="22" font-weight="500" letter-spacing="-0.48" fill="#6E727A">Wallet, venv, faucet. Three minutes — and one of them was patience.</text>
</svg>
