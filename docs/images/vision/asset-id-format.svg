<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
  </defs>

  <rect width="980" height="460" fill="white"/>
  <circle cx="80" cy="400" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="50" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3" opacity="0.45">ASSET ID FORMAT</text>

  <!-- Big formula bar -->
  <rect x="120" y="80" width="740" height="92" rx="14" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="28" font-weight="600">
    <text x="180" y="138" fill="#10B981">{source_prefix}</text>
    <text x="448" y="138" fill="white" opacity="0.45">_</text>
    <text x="470" y="138" fill="white">{identifier}</text>
  </g>
  <text x="270" y="160" text-anchor="middle" fill="white" font-size="10" letter-spacing="1.6" opacity="0.5">CATEGORY ROUTING</text>
  <text x="600" y="160" text-anchor="middle" fill="white" font-size="10" letter-spacing="1.6" opacity="0.5">UPSTREAM ID</text>

  <!-- Table of examples -->
  <g font-size="12">
    <!-- header -->
    <text x="80" y="220" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.8" opacity="0.45">PREFIX</text>
    <text x="320" y="220" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.8" opacity="0.45">IDENTIFIER</text>
    <text x="620" y="220" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.8" opacity="0.45">FULL ASSET ID</text>
    <line x1="80" y1="232" x2="900" y2="232" stroke="#0A0A0A" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SF Mono, Menlo, monospace">
      <text x="80" y="260" fill="#10B981">github_</text>
      <text x="320" y="260" fill="#0A0A0A" opacity="0.7">facebook_react</text>
      <text x="620" y="260" fill="#0A0A0A">github_facebook_react</text>

      <text x="80" y="290" fill="#10B981">earthquake_</text>
      <text x="320" y="290" fill="#0A0A0A" opacity="0.7">california</text>
      <text x="620" y="290" fill="#0A0A0A">earthquake_california</text>

      <text x="80" y="320" fill="#10B981">db_trains_</text>
      <text x="320" y="320" fill="#0A0A0A" opacity="0.7">berlin_hbf</text>
      <text x="620" y="320" fill="#0A0A0A">db_trains_berlin_hbf</text>

      <text x="80" y="350" fill="#10B981">steam_</text>
      <text x="320" y="350" fill="#0A0A0A" opacity="0.7">counter-strike-2</text>
      <text x="620" y="350" fill="#0A0A0A">steam_counter-strike-2</text>

      <text x="80" y="380" fill="#10B981">mcbroken_</text>
      <text x="320" y="380" fill="#0A0A0A" opacity="0.7">chicago</text>
      <text x="620" y="380" fill="#0A0A0A">mcbroken_chicago</text>
    </g>
  </g>

  <!-- Warning pill -->
  <rect x="80" y="406" width="820" height="38" rx="12" fill="#0A0A0A" fill-opacity="0.04"/>
  <circle cx="100" cy="425" r="3" fill="#10B981"/>
  <text x="114" y="430" fill="#0A0A0A" font-size="11" opacity="0.6">Prefix here must match PREFIX_MAP in market-categories.ts. Mismatch sends the market to "Other" forever.</text>
</svg>
