<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.35"/>
    </marker>
  </defs>

  <rect width="980" height="580" fill="white"/>
  <circle cx="80" cy="520" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">SOURCE TO MARKET</text>
  <text x="490" y="64" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">A number leaves an API. A market resolves on-chain.</text>

  <!-- 3 swim-lane headers across top -->
  <g font-size="10" font-weight="700" letter-spacing="2" opacity="0.45">
    <text x="160" y="102" text-anchor="middle" fill="#0A0A0A">SOURCE API</text>
    <text x="490" y="102" text-anchor="middle" fill="#0A0A0A">DATA NODE</text>
    <text x="820" y="102" text-anchor="middle" fill="#0A0A0A">ON-CHAIN</text>
  </g>

  <!-- Lane dividers -->
  <line x1="320" y1="120" x2="320" y2="540" stroke="#0A0A0A" stroke-opacity="0.05" stroke-dasharray="6,6"/>
  <line x1="660" y1="120" x2="660" y2="540" stroke="#0A0A0A" stroke-opacity="0.05" stroke-dasharray="6,6"/>

  <!-- Box 1: CoinGecko request -->
  <rect x="44" y="140" width="232" height="92" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <text x="60" y="166" fill="#0A0A0A" font-size="13" font-weight="700">CoinGecko</text>
  <text x="60" y="186" fill="#0A0A0A" font-size="11" opacity="0.55" font-family="ui-monospace, SF Mono, Menlo, monospace">GET /price?ids=btc</text>
  <line x1="60" y1="198" x2="260" y2="198" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="60" y="218" fill="#0A0A0A" font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace">BTC = $67,432.10</text>

  <!-- Arrow Box 1 → Box 2 -->
  <line x1="280" y1="186" x2="354" y2="186" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 2: Validate & Store -->
  <rect x="358" y="140" width="264" height="120" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <text x="378" y="166" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.55">VALIDATE &amp; STORE</text>
  <line x1="378" y1="178" x2="606" y2="178" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <g font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="378" y="200" fill="#0A0A0A">asset_id:</text>
    <text x="470" y="200" fill="#0A0A0A">BTC-USD</text>
    <text x="378" y="220" fill="#0A0A0A">price:</text>
    <text x="470" y="220" fill="#0A0A0A">67432.10</text>
    <text x="378" y="240" fill="#0A0A0A">ts:</text>
    <text x="470" y="240" fill="#0A0A0A">1710403200</text>
  </g>

  <!-- Arrow down to Box 3 -->
  <line x1="490" y1="266" x2="490" y2="292" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 3: Tick N resolves -->
  <rect x="358" y="298" width="264" height="120" rx="12" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="378" y="324" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.6">TICK N RESOLVES</text>
  <line x1="378" y1="336" x2="606" y2="336" stroke="white" stroke-opacity="0.1"/>
  <g font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="378" y="358" fill="white" opacity="0.8">start:</text>
    <text x="450" y="358" fill="white">$67,432.10</text>
    <text x="378" y="378" fill="white" opacity="0.8">end:</text>
    <text x="450" y="378" fill="white">$67,891.55</text>
    <text x="378" y="398" fill="white" opacity="0.8">delta:</text>
    <text x="450" y="398" fill="#10B981" font-weight="700">+$459.45</text>
  </g>

  <!-- Arrow right to on-chain -->
  <line x1="624" y1="358" x2="700" y2="358" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 4: BLS-signed on-chain -->
  <rect x="704" y="298" width="232" height="200" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <rect x="704" y="298" width="3" height="200" fill="#10B981"/>
  <text x="724" y="324" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.55">ORACLE SUBMIT</text>
  <line x1="724" y1="336" x2="916" y2="336" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <text x="724" y="362" fill="#0A0A0A" font-size="12" font-weight="600">Result</text>
  <rect x="784" y="350" width="44" height="20" rx="10" fill="#10B981"/>
  <text x="806" y="365" text-anchor="middle" fill="white" font-size="11" font-weight="700">UP</text>

  <text x="724" y="394" fill="#0A0A0A" font-size="12">BLS-signed</text>
  <text x="724" y="412" fill="#0A0A0A" font-size="11" opacity="0.55">3 oracles, 2 must agree</text>

  <text x="724" y="446" fill="#0A0A0A" font-size="12">Consensus</text>
  <text x="724" y="464" fill="#0A0A0A" font-size="11" opacity="0.55">price written, batch resolves</text>

  <!-- Footer pill -->
  <rect x="40" y="528" width="900" height="32" rx="14" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="548" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">The machinery does not know what it measures. It only knows the number went up.</text>
</svg>
