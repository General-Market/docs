<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <linearGradient id="priceFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="980" height="380" fill="white"/>
  <circle cx="80" cy="320" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="40" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">PRICE HISTORY · 24H</text>

  <!-- Chart panel -->
  <rect x="40" y="72" width="900" height="260" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.06" filter="url(#shadow)"/>

  <!-- Title row -->
  <text x="60" y="100" fill="#0A0A0A" font-size="14" font-weight="700">BTC-USD</text>
  <text x="124" y="100" fill="#0A0A0A" font-size="11" opacity="0.45">last 24 hours</text>
  <text x="920" y="100" text-anchor="end" fill="#10B981" font-size="13" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace">$67,891.55</text>

  <!-- Y-axis labels -->
  <g font-size="10" opacity="0.4" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="68" y="138">$68,000</text>
    <text x="68" y="172">$67,500</text>
    <text x="68" y="206">$67,000</text>
    <text x="68" y="240">$66,500</text>
    <text x="68" y="274">$66,000</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#0A0A0A" stroke-opacity="0.05">
    <line x1="140" y1="134" x2="900" y2="134"/>
    <line x1="140" y1="168" x2="900" y2="168"/>
    <line x1="140" y1="202" x2="900" y2="202"/>
    <line x1="140" y1="236" x2="900" y2="236"/>
    <line x1="140" y1="270" x2="900" y2="270"/>
  </g>

  <!-- Curve area fill -->
  <path d="M140,250 C200,232 260,218 320,228 C380,236 440,200 500,196 C560,192 620,216 680,212 C740,208 800,180 860,168 C880,164 894,160 900,158 L900,270 L140,270 Z"
        fill="url(#priceFill)"/>

  <!-- Curve line -->
  <path d="M140,250 C200,232 260,218 320,228 C380,236 440,200 500,196 C560,192 620,216 680,212 C740,208 800,180 860,168 C880,164 894,160 900,158"
        fill="none" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- End dot -->
  <circle cx="900" cy="158" r="4" fill="#10B981"/>

  <!-- X-axis ticks -->
  <line x1="140" y1="278" x2="900" y2="278" stroke="#0A0A0A" stroke-opacity="0.1"/>
  <g font-size="10" opacity="0.4" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="140" y="296">00:00</text>
    <text x="262" y="296">04:00</text>
    <text x="384" y="296">08:00</text>
    <text x="506" y="296">12:00</text>
    <text x="628" y="296">16:00</text>
    <text x="750" y="296">20:00</text>
    <text x="900" y="296" text-anchor="end">now</text>
  </g>

  <!-- Footer pill -->
  <rect x="40" y="346" width="900" height="24" rx="12" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="362" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">Twenty-four hours of evidence. Trend, but no guarantee.</text>
</svg>
