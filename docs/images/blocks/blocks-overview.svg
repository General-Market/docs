  </g>
  <text x="124" y="160" text-anchor="middle" fill="white" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.55">CRYPTO</text>
  <text x="124" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">9,963</text>
  <text x="124" y="202" text-anchor="middle" fill="white" font-size="10" opacity="0.4">blocks</text>

  <text x="308" y="160" text-anchor="middle" fill="white" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.55">WEATHER</text>
  <text x="308" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">161,125</text>
  <text x="308" y="202" text-anchor="middle" fill="white" font-size="10" opacity="0.4">blocks</text>

  <text x="492" y="160" text-anchor="middle" fill="white" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.55">TRAINS</text>
  <text x="492" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">1,200</text>
  <text x="492" y="202" text-anchor="middle" fill="white" font-size="10" opacity="0.4">blocks</text>

  <text x="676" y="160" text-anchor="middle" fill="white" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.55">QUAKES</text>
  <text x="676" y="186" text-anchor="middle" fill="white" font-size="20" font-weight="700">300</text>
  <text x="676" y="202" text-anchor="middle" fill="white" font-size="10" opacity="0.4">blocks</text>

