  <text x="124" y="386" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">3,200</text>
  <text x="124" y="402" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">blocks</text>

  <text x="308" y="360" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.5">REDDIT</text>
  <text x="308" y="386" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">4,800</text>
  <text x="308" y="402" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">blocks</text>

  <text x="492" y="360" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.5">DEFI</text>
  <text x="492" y="386" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">2,100</text>
  <text x="492" y="402" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">blocks</text>

  <text x="676" y="360" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.5">BUOYS</text>
  <text x="676" y="386" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">850</text>
  <text x="676" y="402" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">blocks</text>

  <text x="860" y="360" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.5">NUCLEAR</text>
  <text x="860" y="386" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">63</text>
  <text x="860" y="402" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">blocks</text>

  <!-- Footer pill -->
  <rect x="180" y="464" width="620" height="46" rx="23" fill="#0A0A0A" fill-opacity="0.04"/>
  <text x="490" y="492" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="500" letter-spacing="2" opacity="0.55">90+ SOURCES&#160;&#160;·&#160;&#160;400,000+ BLOCKS&#160;&#160;·&#160;&#160;SEALED COMMITMENTS</text>
