<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="540" fill="white"/>

  <!-- Decorative circles -->
  <circle cx="80" cy="500" r="200" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="180" fill="#0A0A0A" opacity="0.02"/>

  <!-- Title -->
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="28" font-weight="700" letter-spacing="14">BLOCKS</text>
  <text x="490" y="92" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.45" letter-spacing="0.4">Sealed bets. Eight predators excluded by design.</text>

  <!-- Tile grid: 5 cols × 3 rows. Tile 168×84, gap 16. Start x=40, y=128. -->
  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="40"  y="128" width="168" height="84" rx="14" fill="url(#darkGrad)"/>
    <rect x="224" y="128" width="168" height="84" rx="14" fill="url(#darkGrad)"/>
    <rect x="408" y="128" width="168" height="84" rx="14" fill="url(#darkGrad)"/>
    <rect x="592" y="128" width="168" height="84" rx="14" fill="url(#darkGrad)"/>
