  <text x="676" y="286" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">5,000</text>
  <text x="676" y="302" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">blocks</text>

  <text x="860" y="260" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600" letter-spacing="1.6" opacity="0.5">FLIGHTS</text>
  <text x="860" y="286" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">2,400</text>
