<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradWb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowWb">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aWb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="320" fill="white"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">WEIGHTS SHIFTED · NAV PRESERVED</text>

  <!-- BEFORE -->
  <g filter="url(#shadowWb)">
    <rect x="60" y="68" width="380" height="216" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  </g>
  <text x="80" y="96" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">BEFORE · ROUGHLY EQUAL</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12">
    <text x="80" y="142" fill="#0A0A0A" font-weight="600">BTC</text>
    <rect x="120" y="130" width="170" height="14" rx="3" fill="#0A0A0A" fill-opacity="0.6"/>
    <text x="306" y="142" fill="#0A0A0A">33.6%</text>

    <text x="80" y="178" fill="#0A0A0A" font-weight="600">ETH</text>
    <rect x="120" y="166" width="166" height="14" rx="3" fill="#0A0A0A" fill-opacity="0.55"/>
    <text x="306" y="178" fill="#0A0A0A">32.7%</text>

    <text x="80" y="214" fill="#0A0A0A" font-weight="600">SOL</text>
    <rect x="120" y="202" width="170" height="14" rx="3" fill="#0A0A0A" fill-opacity="0.55"/>
    <text x="306" y="214" fill="#0A0A0A">33.7%</text>
  </g>

  <!-- arrow -->
  <line x1="455" y1="172" x2="525" y2="172" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.4" marker-end="url(#aWb)"/>

  <!-- AFTER -->
  <g filter="url(#shadowWb)">
    <rect x="540" y="68" width="380" height="216" rx="14" fill="url(#darkGradWb)"/>
  </g>
  <text x="560" y="96" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">AFTER · NEW THESIS</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12" fill="white">
    <text x="560" y="142" font-weight="600">BTC</text>
    <rect x="600" y="130" width="240" height="14" rx="3" fill="#10B981" fill-opacity="0.85"/>
    <text x="856" y="142">50.0%</text>

    <text x="560" y="178" font-weight="600">ETH</text>
    <rect x="600" y="166" width="144" height="14" rx="3" fill="white" fill-opacity="0.55"/>
    <text x="856" y="178">30.0%</text>

    <text x="560" y="214" font-weight="600">SOL</text>
    <rect x="600" y="202" width="96" height="14" rx="3" fill="white" fill-opacity="0.4"/>
    <text x="856" y="214">20.0%</text>
  </g>
</svg>
