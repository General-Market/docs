<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="760" fill="white"/>
  <circle cx="80" cy="700" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="80" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">SERVICE CONNECTIVITY</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Everything talks through carefully constrained channels.</text>

  <!-- Frontend node (top center) -->
  <g filter="url(#shadow)">
    <rect x="370" y="92" width="240" height="76" rx="14" fill="url(#darkGrad)"/>
  </g>
  <text x="490" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.55">FRONTEND</text>
  <text x="490" y="142" text-anchor="middle" fill="white" font-size="14" font-weight="700">Next.js</text>
  <text x="490" y="160" text-anchor="middle" fill="white" font-size="10" opacity="0.4">user surface</text>

  <!-- Edges from frontend -->
  <line x1="440" y1="170" x2="240" y2="220" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.2" marker-end="url(#arrowEnd)"/>
  <text x="320" y="190" fill="#0A0A0A" font-size="10" opacity="0.55">SSE + REST</text>

  <line x1="540" y1="170" x2="740" y2="220" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.2" marker-end="url(#arrowEnd)"/>
  <text x="652" y="190" fill="#0A0A0A" font-size="10" opacity="0.55">RPC</text>

  <!-- Data Node (left) -->
  <g filter="url(#shadow)">
    <rect x="100" y="226" width="280" height="100" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="120" y="252" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">DATA NODE</text>
  <text x="120" y="278" fill="#0A0A0A" font-size="14" font-weight="700">port 8200</text>
  <text x="120" y="300" fill="#0A0A0A" font-size="11" opacity="0.55">REST + SSE · UFW-gated</text>

  <!-- L3 chain (right) -->
  <g filter="url(#shadow)">
    <rect x="600" y="226" width="280" height="100" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="620" y="252" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">L3 CHAIN</text>
  <text x="620" y="278" fill="#0A0A0A" font-size="14" font-weight="700">rpc.generalmarket.io</text>
  <text x="620" y="300" fill="#0A0A0A" font-size="11" opacity="0.55">JSON-RPC · BLS-verified writes</text>

  <!-- Vision Bot (left of left center) -->
  <g filter="url(#shadow)">
    <rect x="60" y="360" width="180" height="80" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="78" y="384" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">VISION BOT</text>
  <text x="78" y="406" fill="#0A0A0A" font-size="13" font-weight="700">Python</text>
  <text x="78" y="424" fill="#0A0A0A" font-size="10" opacity="0.5">strategy signals</text>

  <line x1="150" y1="360" x2="170" y2="326" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrowEnd)"/>
  <text x="115" y="350" fill="#0A0A0A" font-size="9" opacity="0.45">REST</text>

  <!-- Oracle Nodes (center) -->
  <g filter="url(#shadow)">
    <rect x="280" y="360" width="220" height="80" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="298" y="384" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">ORACLE NODES</text>
  <text x="298" y="406" fill="#0A0A0A" font-size="13" font-weight="700">3× Rust</text>
  <g>
    <circle cx="430" cy="408" r="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5"/>
    <circle cx="455" cy="408" r="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5"/>
    <circle cx="480" cy="408" r="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5"/>
  </g>
  <text x="298" y="426" fill="#0A0A0A" font-size="10" opacity="0.5">BLS aggregate</text>

  <!-- arrows oracles ↔ data node + L3 -->
  <line x1="290" y1="360" x2="240" y2="326" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrowEnd)"/>
  <text x="246" y="348" fill="#0A0A0A" font-size="9" opacity="0.45">prices</text>
  <line x1="490" y1="360" x2="660" y2="326" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrowEnd)"/>
  <text x="572" y="350" fill="#0A0A0A" font-size="9" opacity="0.45">BLS txs</text>

  <!-- Curator (right) -->
  <g filter="url(#shadow)">
    <rect x="540" y="360" width="180" height="80" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="558" y="384" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">CURATOR</text>
  <text x="558" y="406" fill="#0A0A0A" font-size="13" font-weight="700">Rust</text>
  <text x="558" y="424" fill="#0A0A0A" font-size="10" opacity="0.5">NAV publish · Morpho</text>

  <line x1="630" y1="360" x2="740" y2="326" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrowEnd)"/>

  <!-- AP / Keeper (far right) -->
  <g filter="url(#shadow)">
    <rect x="760" y="360" width="180" height="80" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="778" y="384" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">AP / KEEPER</text>
  <text x="778" y="406" fill="#0A0A0A" font-size="13" font-weight="700">Rust</text>
  <text x="778" y="424" fill="#0A0A0A" font-size="10" opacity="0.5">event listener</text>

  <line x1="850" y1="360" x2="810" y2="326" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrowEnd)"/>
  <text x="816" y="348" fill="#0A0A0A" font-size="9" opacity="0.45">events</text>

  <!-- Bitget node -->
  <g filter="url(#shadow)">
    <rect x="760" y="476" width="180" height="76" rx="12" fill="url(#darkGrad)"/>
  </g>
  <text x="778" y="500" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.55">EXCHANGE</text>
  <text x="778" y="522" fill="white" font-size="13" font-weight="700">Bitget</text>
  <text x="778" y="540" fill="white" font-size="10" opacity="0.4">market orders</text>

  <line x1="850" y1="440" x2="850" y2="476" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrowEnd)"/>
  <text x="858" y="464" fill="#0A0A0A" font-size="9" opacity="0.5">REST API</text>

  <!-- Social Bot panel -->
  <g filter="url(#shadow)">
    <rect x="60" y="490" width="640" height="120" rx="14" fill="#0A0A0A" fill-opacity="0.03"/>
  </g>
  <text x="80" y="518" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">SOCIAL BOT · PYTHON</text>

  <!-- Pipeline: Data Node → Anomaly Engine → Twitter -->
  <rect x="80" y="538" width="170" height="48" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  <text x="165" y="558" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600">Data Node</text>
  <text x="165" y="574" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">REST</text>

  <line x1="250" y1="562" x2="290" y2="562" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrowEnd)"/>

  <rect x="290" y="538" width="170" height="48" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  <text x="375" y="558" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600">Anomaly engine</text>
  <text x="375" y="574" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">98 sources</text>

  <line x1="460" y1="562" x2="500" y2="562" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrowEnd)"/>

  <rect x="500" y="538" width="180" height="48" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="590" y="558" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">Twitter / X</text>
  <text x="590" y="574" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">API post</text>

  <!-- Footer pill -->
  <rect x="60" y="650" width="860" height="44" rx="14" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="677" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">Every arrow is a protocol. Every boundary, the memory of a violation.</text>
</svg>
