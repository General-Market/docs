  <line x1="524" y1="252" x2="916" y2="252" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="524" y="278" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">WHAT LIVES HERE</text>
  <g font-size="11" fill="#0A0A0A" opacity="0.7">
    <text x="524" y="302">· BridgedITP · ERC-20 replicas</text>
    <text x="524" y="322">· Bridge custody contracts</text>
    <text x="524" y="342">· Morpho lending markets</text>
