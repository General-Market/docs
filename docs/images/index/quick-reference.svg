  </defs>

  <rect width="980" height="420" fill="white"/>
  <circle cx="50" cy="50" r="140" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="380" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">QUICK REFERENCE</text>

  <!-- L3 column (dark) -->
  <g filter="url(#shadowQr)">
    <rect x="40" y="68" width="440" height="320" rx="14" fill="url(#darkGradQr)"/>
  </g>
  <text x="64" y="96" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">INDEX L3</text>
  <line x1="64" y1="108" x2="456" y2="108" stroke="white" stroke-opacity="0.1"/>

  <g font-size="12">
