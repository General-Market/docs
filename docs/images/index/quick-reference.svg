  <g filter="url(#shadowQr)">
    <rect x="500" y="68" width="440" height="320" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  </g>
  <rect x="500" y="68" width="3" height="40" rx="1.5" fill="#10B981"/>
  <text x="524" y="96" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">SETTLEMENT</text>
  <line x1="524" y1="108" x2="916" y2="108" stroke="#0A0A0A" stroke-opacity="0.08"/>

  <g font-size="12">
    <text x="524" y="136" fill="#0A0A0A" opacity="0.5">Chain ID</text>
    <text x="700" y="136" fill="#0A0A0A" font-weight="700" font-family="ui-monospace, SF Mono, Menlo, monospace">14601</text>

