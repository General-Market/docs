    <text x="64" y="160" fill="white" opacity="0.5">RPC</text>
    <text x="240" y="160" fill="white" font-weight="500" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">rpc.generalmarket.io</text>

    <text x="64" y="184" fill="white" opacity="0.5">Native</text>
    <text x="240" y="184" fill="white" font-weight="700">GM</text>

    <text x="64" y="208" fill="white" opacity="0.5">USDC</text>
