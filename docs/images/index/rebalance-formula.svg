<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowF">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="980" height="340" fill="white"/>
  <circle cx="50" cy="50" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="300" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">THE REBALANCE FORMULA</text>

  <g filter="url(#shadowF)">
    <rect x="80" y="80" width="820" height="220" rx="14" fill="url(#darkGradF)"/>
  </g>

  <!-- Formula -->
  <text x="490" y="148" text-anchor="middle" fill="white" font-size="24" font-weight="500" font-family="ui-monospace, SF Mono, Menlo, monospace">
    qty_new[i] = (w_new[i] × currentNAV) / price[i]
  </text>

  <line x1="220" y1="178" x2="760" y2="178" stroke="white" stroke-opacity="0.1"/>

  <!-- Where clause -->
  <text x="220" y="208" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">WHERE</text>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13" fill="white">
    <text x="220" y="238">w_new[i]</text>
    <text x="380" y="238" opacity="0.6">new target weight (sums to 1)</text>

    <text x="220" y="262">currentNAV</text>
    <text x="380" y="262" opacity="0.6">NAV at moment of rebalance</text>

    <text x="220" y="286">price[i]</text>
    <text x="380" y="286" opacity="0.6">current price of asset i</text>
  </g>
</svg>
