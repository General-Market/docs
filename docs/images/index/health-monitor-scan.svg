<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arrDn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="white"/>
  <circle cx="80" cy="660" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Outer container -->
  <rect x="40" y="40" width="900" height="416" rx="16" fill="#0A0A0A" fill-opacity="0.02"/>
  <text x="64" y="76" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">HEALTH MONITOR SCAN CYCLE</text>
  <text x="64" y="98" fill="#0A0A0A" font-size="13" opacity="0.4">Vigilance against entropy — six probes, one report.</text>

  <!-- Row 1: three probe cards -->
  <g filter="url(#shadow)">
    <rect x="64" y="124" width="272" height="116" rx="12" fill="white"/>
    <rect x="354" y="124" width="272" height="116" rx="12" fill="white"/>
    <rect x="644" y="124" width="272" height="116" rx="12" fill="white"/>
  </g>
  <text x="84" y="152" fill="#0A0A0A" font-size="13" font-weight="700">Position Health</text>
  <line x1="84" y1="160" x2="316" y2="160" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="84" y="184" fill="#0A0A0A" font-size="11" opacity="0.55">Per borrower:</text>
  <text x="84" y="204" fill="#0A0A0A" font-size="11" opacity="0.55">collateral / debt = HF</text>
  <text x="84" y="224" fill="#0A0A0A" font-size="11" opacity="0.55">HF &lt; threshold → alert</text>

  <text x="374" y="152" fill="#0A0A0A" font-size="13" font-weight="700">Oracle Freshness</text>
  <line x1="374" y1="160" x2="606" y2="160" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="374" y="184" fill="#0A0A0A" font-size="11" opacity="0.55">Per oracle:</text>
  <text x="374" y="204" fill="#0A0A0A" font-size="11" opacity="0.55">now - lastUpdated</text>
  <text x="374" y="224" fill="#0A0A0A" font-size="11" opacity="0.55">cadence per risk tier</text>

  <text x="664" y="152" fill="#0A0A0A" font-size="13" font-weight="700">Mirror Registry</text>
  <line x1="664" y1="160" x2="896" y2="160" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="664" y="184" fill="#0A0A0A" font-size="11" opacity="0.55">L3 nonce vs</text>
  <text x="664" y="204" fill="#0A0A0A" font-size="11" opacity="0.55">Settlement activeCount</text>
  <text x="664" y="224" fill="#0A0A0A" font-size="11" opacity="0.55">synced or not</text>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="64" y="260" width="272" height="116" rx="12" fill="white"/>
    <rect x="354" y="260" width="272" height="116" rx="12" fill="white"/>
    <rect x="644" y="260" width="272" height="116" rx="12" fill="white"/>
  </g>
  <text x="84" y="288" fill="#0A0A0A" font-size="13" font-weight="700">Vault Metrics</text>
  <line x1="84" y1="296" x2="316" y2="296" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="84" y="320" fill="#0A0A0A" font-size="11" opacity="0.55">totalAssets · totalSupply</text>
  <text x="84" y="340" fill="#0A0A0A" font-size="11" opacity="0.55">idle · utilization</text>

  <text x="374" y="288" fill="#0A0A0A" font-size="13" font-weight="700">Crisis Levels</text>
  <line x1="374" y1="296" x2="606" y2="296" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="374" y="320" fill="#0A0A0A" font-size="11" opacity="0.55">per market:</text>
  <text x="374" y="340" fill="#0A0A0A" font-size="11" opacity="0.55">Normal · Elevated</text>
  <text x="374" y="360" fill="#0A0A0A" font-size="11" opacity="0.55">Stress · Emergency</text>

  <text x="664" y="288" fill="#0A0A0A" font-size="13" font-weight="700">SERM Stress</text>
  <line x1="664" y1="296" x2="896" y2="296" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="664" y="320" fill="#0A0A0A" font-size="11" opacity="0.55">per asset:</text>
  <text x="664" y="340" fill="#0A0A0A" font-size="11" opacity="0.55">volatility score</text>
  <text x="664" y="360" fill="#0A0A0A" font-size="11" opacity="0.55">feeds rate model</text>

  <!-- Funnel into HealthReport -->
  <line x1="200" y1="376" x2="400" y2="402" stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="490" y1="376" x2="490" y2="402" stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="780" y1="376" x2="580" y2="402" stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1"/>

  <rect x="340" y="404" width="300" height="40" rx="12" fill="url(#darkGrad)"/>
  <text x="490" y="429" text-anchor="middle" fill="white" font-size="13" font-weight="700">HealthReport</text>

  <!-- Outflow arrow -->
  <line x1="490" y1="464" x2="490" y2="496" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Three outputs -->
  <g filter="url(#shadow)">
    <rect x="60" y="504" width="270" height="180" rx="12" fill="white"/>
    <rect x="355" y="504" width="270" height="180" rx="12" fill="white"/>
    <rect x="650" y="504" width="270" height="180" rx="12" fill="white"/>
  </g>
  <text x="84" y="534" fill="#0A0A0A" font-size="13" font-weight="700">Telegram Alerts</text>
  <line x1="84" y1="544" x2="306" y2="544" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="84" y="566" fill="#0A0A0A" font-size="11" opacity="0.55">crisis transitions</text>
  <text x="84" y="586" fill="#0A0A0A" font-size="11" opacity="0.55">critical warnings</text>
  <text x="84" y="606" fill="#0A0A0A" font-size="11" opacity="0.55">no repeat noise</text>
  <circle cx="296" cy="660" r="3.5" fill="#10B981"/>
  <text x="84" y="664" fill="#0A0A0A" font-size="11" opacity="0.4">fires on transition only</text>

  <text x="379" y="534" fill="#0A0A0A" font-size="13" font-weight="700">Log File (JSON)</text>
  <line x1="379" y1="544" x2="601" y2="544" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="379" y="566" fill="#0A0A0A" font-size="11" opacity="0.55">full report dump</text>
  <text x="379" y="586" fill="#0A0A0A" font-size="11" opacity="0.55">structured for grep</text>

  <text x="674" y="534" fill="#0A0A0A" font-size="13" font-weight="700">SharedState</text>
  <line x1="674" y1="544" x2="896" y2="544" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="674" y="566" fill="#0A0A0A" font-size="11" opacity="0.55">crisis_levels</text>
  <text x="674" y="586" fill="#0A0A0A" font-size="11" opacity="0.55">asset_stress</text>
  <text x="674" y="608" fill="#0A0A0A" font-size="11" opacity="0.5">→ Quote API</text>
  <text x="674" y="628" fill="#0A0A0A" font-size="11" opacity="0.5">→ Allocation Bot</text>
</svg>
