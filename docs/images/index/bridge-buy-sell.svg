<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradBb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowBb">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aBb" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="680" fill="white"/>
  <circle cx="50" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="620" r="180" fill="#0A0A0A" opacity="0.02"/>

  <!-- BRIDGE BUY -->
  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">BRIDGE BUY</text>

  <rect x="380" y="68" width="220" height="56" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowBb)"/>
  <text x="490" y="96" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700">User deposits USDC</text>
  <text x="490" y="114" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.55">on Settlement</text>

  <line x1="490" y1="128" x2="490" y2="158" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aBb)"/>

  <!-- Two-column outputs -->
  <line x1="280" y1="164" x2="280" y2="200" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#aBb)"/>
  <line x1="700" y1="164" x2="700" y2="200" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#aBb)"/>
  <path d="M490 162 L490 178 L280 178 L280 158" fill="none" stroke="#0A0A0A" stroke-opacity="0.25"/>
  <path d="M490 162 L490 178 L700 178 L700 158" fill="none" stroke="#0A0A0A" stroke-opacity="0.25"/>

  <!-- Settlement output -->
  <rect x="60" y="208" width="440" height="140" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowBb)"/>
  <text x="80" y="236" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.45">SETTLEMENT</text>
  <text x="80" y="262" fill="#0A0A0A" font-size="16" font-weight="700">BridgedITP (ERC-20)</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="80" y="290">· replica of L3 shares</text>
    <text x="80" y="310">· mint / burn by BridgeProxy</text>
    <text x="80" y="330">· usable as Morpho collateral</text>
  </g>

  <!-- L3 output -->
  <rect x="520" y="208" width="400" height="140" rx="14" fill="url(#darkGradBb)" filter="url(#shadowBb)"/>
  <text x="540" y="236" fill="white" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.5">INDEX L3</text>
  <text x="540" y="262" fill="white" font-size="16" font-weight="700">ITP Shares</text>
  <g font-size="12" fill="white" opacity="0.6">
    <text x="540" y="290">· the "real" shares</text>
    <text x="540" y="310">· minted by Index.sol</text>
    <text x="540" y="330">· tracked by NAV</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="380" x2="940" y2="380" stroke="#0A0A0A" stroke-opacity="0.06" stroke-dasharray="4,4"/>

  <!-- BRIDGE SELL -->
  <text x="490" y="412" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">BRIDGE SELL</text>

  <rect x="380" y="436" width="220" height="56" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowBb)"/>
  <text x="490" y="464" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700">User sends BridgedITP</text>
  <text x="490" y="482" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.55">on Settlement</text>

  <line x1="490" y1="496" x2="490" y2="526" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aBb)"/>

  <line x1="280" y1="532" x2="280" y2="568" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#aBb)"/>
  <line x1="700" y1="532" x2="700" y2="568" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#aBb)"/>
  <path d="M490 530 L490 546 L280 546 L280 526" fill="none" stroke="#0A0A0A" stroke-opacity="0.25"/>
  <path d="M490 530 L490 546 L700 546 L700 526" fill="none" stroke="#0A0A0A" stroke-opacity="0.25"/>

  <rect x="60" y="576" width="440" height="84" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowBb)"/>
  <text x="80" y="604" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.45">SETTLEMENT</text>
  <text x="80" y="628" fill="#0A0A0A" font-size="14" font-weight="700">BridgedITP burned</text>
  <text x="80" y="648" fill="#10B981" font-size="12" font-weight="600">USDC returned to user</text>

  <rect x="520" y="576" width="400" height="84" rx="14" fill="url(#darkGradBb)" filter="url(#shadowBb)"/>
  <text x="540" y="604" fill="white" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.5">INDEX L3</text>
  <text x="540" y="628" fill="white" font-size="14" font-weight="700">ITP shares burned</text>
  <text x="540" y="648" fill="white" font-size="12" opacity="0.6">underlying assets sold by AP</text>
</svg>
