<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="white"/>
  <circle cx="80" cy="560" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="40" y="44" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">QUOTE FLOW</text>
  <text x="40" y="68" fill="#0A0A0A" font-size="13" opacity="0.4">A promise with conditions. The curator computes the conditions.</text>

  <!-- 3 swimlane headers -->
  <rect x="40" y="96" width="900" height="40" rx="10" fill="url(#darkGrad)"/>
  <text x="160" y="121" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2.4">FRONTEND</text>
  <line x1="320" y1="104" x2="320" y2="128" stroke="white" stroke-opacity="0.1"/>
  <text x="490" y="121" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2.4">CURATOR QUOTE API</text>
  <line x1="660" y1="104" x2="660" y2="128" stroke="white" stroke-opacity="0.1"/>
  <text x="800" y="121" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2.4">SETTLEMENT</text>

  <!-- Lane separators (dashed) -->
  <line x1="320" y1="136" x2="320" y2="592" stroke="#0A0A0A" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="660" y1="136" x2="660" y2="592" stroke="#0A0A0A" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Frontend card -->
  <rect x="60" y="156" width="240" height="80" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
  <text x="80" y="184" fill="#0A0A0A" font-size="13" font-weight="700">Borrow form</text>
  <text x="80" y="206" fill="#0A0A0A" font-size="11" opacity="0.55">user fills collateral, debt</text>
  <text x="80" y="222" fill="#0A0A0A" font-size="11" opacity="0.55">submits</text>

  <!-- Arrow: form → API -->
  <line x1="300" y1="196" x2="338" y2="196" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="319" y="188" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="600" letter-spacing="1.2" opacity="0.45">POST /quote</text>

  <!-- 6 curator steps -->
  <g>
    <rect x="340" y="156" width="300" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
    <text x="358" y="176" fill="#0A0A0A" font-size="11" font-weight="700">1. Authenticate</text>
    <text x="358" y="192" fill="#0A0A0A" font-size="10" opacity="0.55">X-API-Key</text>

    <rect x="340" y="212" width="300" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
    <text x="358" y="232" fill="#0A0A0A" font-size="11" font-weight="700">2. Look up market config</text>
    <text x="358" y="248" fill="#0A0A0A" font-size="10" opacity="0.55">for the requested ITP</text>

    <rect x="340" y="268" width="300" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
    <text x="358" y="288" fill="#0A0A0A" font-size="11" font-weight="700">3. Read cached BLS data</text>
    <text x="358" y="304" fill="#0A0A0A" font-size="10" opacity="0.55">from shared state</text>

    <rect x="340" y="324" width="300" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
    <text x="358" y="344" fill="#0A0A0A" font-size="11" font-weight="700">4. Read on-chain state</text>
    <text x="358" y="360" fill="#0A0A0A" font-size="10" opacity="0.55">oracle price · market state</text>

    <rect x="340" y="380" width="300" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
    <text x="358" y="400" fill="#0A0A0A" font-size="11" font-weight="700">5. SERM compute rate</text>
    <text x="358" y="416" fill="#0A0A0A" font-size="10" opacity="0.55">stress · concentration · tier</text>

    <rect x="340" y="436" width="300" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
    <text x="358" y="456" fill="#0A0A0A" font-size="11" font-weight="700">6. Enforce min HF</text>
    <text x="358" y="472" fill="#0A0A0A" font-size="10" opacity="0.55">per crisis level</text>

    <rect x="340" y="492" width="300" height="46" rx="10" fill="url(#darkGrad)"/>
    <text x="358" y="512" fill="white" font-size="11" font-weight="700">7. Build Bundler calldata</text>
    <text x="358" y="528" fill="white" font-size="10" opacity="0.55">QuoteResponse</text>
  </g>

  <!-- Settlement side -->
  <rect x="700" y="324" width="240" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.04"/>
  <text x="720" y="350" fill="#0A0A0A" font-size="12" font-weight="700">Oracle price · market state</text>
  <text x="720" y="370" fill="#0A0A0A" font-size="11" opacity="0.55">read</text>

  <rect x="700" y="394" width="240" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.04"/>
  <text x="720" y="420" fill="#0A0A0A" font-size="12" font-weight="700">CuratorRateIRM.setRate()</text>
  <text x="720" y="440" fill="#0A0A0A" font-size="11" opacity="0.55">push</text>

  <!-- Arrows to settlement -->
  <line x1="640" y1="350" x2="698" y2="350" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="698" y1="360" x2="640" y2="360" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arrL)"/>
  <line x1="640" y1="420" x2="698" y2="420" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- Return path to frontend -->
  <line x1="338" y1="514" x2="300" y2="514" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arrL)"/>
  <rect x="60" y="492" width="240" height="60" rx="12" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="80" y="518" fill="#059669" font-size="12" font-weight="700">QuoteResponse</text>
  <text x="80" y="538" fill="#059669" font-size="11" opacity="0.8">terms · rate · calldata</text>
</svg>
