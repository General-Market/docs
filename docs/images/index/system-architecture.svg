<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" width="980" height="880" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.35"/>
    </marker>
  </defs>

  <rect width="980" height="880" fill="white"/>

  <circle cx="80" cy="800" r="200" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="100" r="180" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">SYSTEM ARCHITECTURE</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Eight services. Two chains. The constraints are the architecture.</text>

  <!-- Oracle ring (top) -->
  <g filter="url(#shadow)">
    <rect x="220" y="92" width="540" height="92" rx="14" fill="url(#darkGrad)"/>
  </g>
  <text x="246" y="120" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.55">BLS CONSENSUS RING</text>
  <text x="246" y="142" fill="white" font-size="13" opacity="0.5">Three Rust nodes. One-second cycles. Round-robin leaders.</text>
  <g>
    <circle cx="600" cy="138" r="18" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="600" y="142" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">O₁</text>
    <circle cx="650" cy="138" r="18" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="650" y="142" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">O₂</text>
    <circle cx="700" cy="138" r="18" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="700" y="142" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">O₃</text>
    <line x1="618" y1="138" x2="632" y2="138" stroke="#10B981" stroke-opacity="0.5"/>
    <line x1="668" y1="138" x2="682" y2="138" stroke="#10B981" stroke-opacity="0.5"/>
  </g>

  <!-- Data Node (left) and L3 (right) -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="280" height="180" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="60" y="248" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">DATA NODE · RUST</text>
  <text x="60" y="278" fill="#0A0A0A" font-size="16" font-weight="700">90+ sources, one binary</text>
  <text x="60" y="310" fill="#0A0A0A" font-size="11" opacity="0.55">CoinGecko, Binance, trains, weather.</text>
  <text x="60" y="328" fill="#0A0A0A" font-size="11" opacity="0.55">PostgreSQL · Backtesting</text>
  <text x="60" y="346" fill="#0A0A0A" font-size="11" opacity="0.55">REST + SSE · port 8200</text>
  <text x="60" y="378" fill="#10B981" font-size="11" font-weight="600">Every price the protocol touches.</text>

  <g filter="url(#shadow)">
    <rect x="380" y="220" width="560" height="280" rx="14" fill="url(#darkGrad)"/>
  </g>
  <text x="404" y="248" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.55">INDEX L3 · ORBIT</text>
  <text x="404" y="278" fill="white" font-size="18" font-weight="700">Chain 111222333 · USDC 18 dec</text>

  <!-- contract grid inside L3 panel -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <rect x="404" y="300" width="160" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="484" y="326" text-anchor="middle" fill="white" font-size="11" font-weight="600">Index.sol</text>

    <rect x="574" y="300" width="160" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="654" y="326" text-anchor="middle" fill="white" font-size="11" font-weight="600">Vision.sol</text>

    <rect x="744" y="300" width="170" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="829" y="326" text-anchor="middle" fill="white" font-size="11" font-weight="600">BotRegistry.sol</text>

    <rect x="404" y="350" width="160" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="484" y="376" text-anchor="middle" fill="white" font-size="11" font-weight="600">ITP.sol</text>

    <rect x="574" y="350" width="160" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="654" y="376" text-anchor="middle" fill="white" font-size="11" font-weight="600">OracleRegistry</text>

    <rect x="744" y="350" width="170" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="829" y="376" text-anchor="middle" fill="white" font-size="11" font-weight="600">FeeRegistry</text>

    <rect x="404" y="400" width="160" height="40" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="484" y="426" text-anchor="middle" fill="white" font-size="11" font-weight="600">BLSLib.sol</text>

    <rect x="574" y="400" width="340" height="40" rx="8" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08"/>
    <text x="744" y="426" text-anchor="middle" fill="white" font-size="11" opacity="0.5" font-family="Inter, sans-serif">+ 22 more contracts</text>
  </g>

  <text x="404" y="478" fill="white" font-size="11" opacity="0.4">Bridge ↔ Settlement (Arbitrum, USDC 6 dec)</text>

  <!-- arrows: Oracles → DataNode + L3 -->
  <line x1="320" y1="184" x2="180" y2="220" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="660" y1="184" x2="660" y2="216" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="240" y="208" fill="#0A0A0A" font-size="10" opacity="0.4">prices</text>
  <text x="672" y="208" fill="#0A0A0A" font-size="10" opacity="0.4">BLS-signed txs</text>

  <!-- Frontend (bottom-left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="520" width="280" height="160" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="60" y="548" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">FRONTEND · NEXT.JS</text>
  <text x="60" y="578" fill="#0A0A0A" font-size="16" font-weight="700">The surface users touch</text>
  <text x="60" y="608" fill="#0A0A0A" font-size="11" opacity="0.55">Trading · Explorer · Points</text>
  <text x="60" y="626" fill="#0A0A0A" font-size="11" opacity="0.55">Vision betting · Learning</text>
  <text x="60" y="660" fill="#0A0A0A" font-size="11" opacity="0.35">Deployed on Vercel</text>

  <!-- AP / Keeper -->
  <g filter="url(#shadow)">
    <rect x="380" y="520" width="260" height="160" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="400" y="548" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">AP / KEEPER · RUST</text>
  <text x="400" y="578" fill="#0A0A0A" font-size="16" font-weight="700">Trade executor</text>
  <text x="400" y="608" fill="#0A0A0A" font-size="11" opacity="0.55">Bitget order execution</text>
  <text x="400" y="626" fill="#0A0A0A" font-size="11" opacity="0.55">Event monitoring · Fill BLS</text>
  <text x="400" y="660" fill="#0A0A0A" font-size="11" opacity="0.35">Bridge relay</text>

  <!-- Curator -->
  <g filter="url(#shadow)">
    <rect x="680" y="520" width="260" height="160" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="700" y="548" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">CURATOR · RUST</text>
  <text x="700" y="578" fill="#0A0A0A" font-size="16" font-weight="700">The quiet one</text>
  <text x="700" y="608" fill="#0A0A0A" font-size="11" opacity="0.55">Oracle NAV collection</text>
  <text x="700" y="626" fill="#0A0A0A" font-size="11" opacity="0.55">Morpho allocations</text>
  <text x="700" y="660" fill="#0A0A0A" font-size="11" opacity="0.35">Health monitoring</text>

  <!-- Vision Bot -->
  <g filter="url(#shadow)">
    <rect x="40" y="700" width="440" height="140" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="60" y="728" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">VISION BOT · PYTHON</text>
  <text x="60" y="758" fill="#0A0A0A" font-size="16" font-weight="700">Automated Vision trading</text>
  <text x="60" y="788" fill="#0A0A0A" font-size="11" opacity="0.55">Strategy framework · BotRegistry</text>
  <text x="60" y="820" fill="#0A0A0A" font-size="11" opacity="0.35">The machine does not hesitate.</text>

  <!-- Social Bot -->
  <g filter="url(#shadow)">
    <rect x="500" y="700" width="440" height="140" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="520" y="728" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">SOCIAL BOT · PYTHON</text>
  <text x="520" y="758" fill="#0A0A0A" font-size="16" font-weight="700">Anomaly detection · 98 sources</text>
  <text x="520" y="788" fill="#0A0A0A" font-size="11" opacity="0.55">Transport · power · weather → Twitter/X</text>
  <text x="520" y="820" fill="#0A0A0A" font-size="11" opacity="0.35">The world is always breaking somewhere.</text>

  <!-- Frontend → DataNode + L3 arrows -->
  <line x1="180" y1="520" x2="180" y2="400" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="280" y1="520" x2="400" y2="500" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="510" y1="520" x2="600" y2="500" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="810" y1="520" x2="760" y2="500" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
