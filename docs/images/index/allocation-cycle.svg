<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arrDn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect width="980" height="580" fill="white"/>
  <circle cx="80" cy="520" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="40" y="44" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">ALLOCATION CYCLE</text>
  <text x="40" y="68" fill="#0A0A0A" font-size="13" opacity="0.4">Detect. Read. Decide. Move — or do nothing, which is also a decision.</text>

  <!-- Step 1 -->
  <rect x="260" y="96" width="460" height="76" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
  <text x="284" y="124" fill="#0A0A0A" font-size="13" font-weight="700">Detect new markets</text>
  <text x="284" y="146" fill="#0A0A0A" font-size="11" opacity="0.55">vault.supplyQueue() · diff against known set</text>
  <text x="284" y="162" fill="#0A0A0A" font-size="11" opacity="0.55">add any new market IDs</text>
  <line x1="490" y1="174" x2="490" y2="194" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 2 -->
  <rect x="260" y="200" width="460" height="76" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
  <text x="284" y="228" fill="#0A0A0A" font-size="13" font-weight="700">Read market state</text>
  <text x="284" y="250" fill="#0A0A0A" font-size="11" opacity="0.55">morpho.market(id) → totals · morpho.position(id, vault) → supply</text>
  <text x="284" y="266" fill="#0A0A0A" font-size="11" opacity="0.55">compute utilization %</text>
  <line x1="490" y1="278" x2="490" y2="298" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 3 -->
  <rect x="260" y="304" width="460" height="76" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
  <text x="284" y="332" fill="#0A0A0A" font-size="13" font-weight="700">Compute reallocation</text>
  <text x="284" y="354" fill="#0A0A0A" font-size="11" opacity="0.55">over- vs under-utilized · respect tier caps</text>
  <text x="284" y="370" fill="#0A0A0A" font-size="11" opacity="0.55">min allocation 1 USDC — no dust</text>
  <line x1="490" y1="382" x2="490" y2="402" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Diamond -->
  <g transform="translate(490 430)">
    <polygon points="0,-30 80,0 0,30 -80,0" fill="white" stroke="#0A0A0A" stroke-opacity="0.25"/>
    <text x="0" y="4" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="1.2">NEEDED?</text>
  </g>

  <!-- No branch -->
  <line x1="410" y1="430" x2="200" y2="430" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="380" y="422" text-anchor="end" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.5">NO</text>
  <rect x="100" y="412" width="100" height="36" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="150" y="436" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.55">skip</text>

  <!-- Yes branch -->
  <line x1="570" y1="430" x2="780" y2="430" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrDn)" transform="rotate(-90 780 430) translate(0)"/>
  <text x="600" y="422" fill="#059669" font-size="10" font-weight="700" letter-spacing="1.6">YES</text>
  <rect x="600" y="490" width="280" height="60" rx="12" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="620" y="516" fill="white" font-size="13" font-weight="700">vault.reallocate(...)</text>
  <text x="620" y="536" fill="white" font-size="11" opacity="0.55">submit MarketAllocation[] to MetaMorpho</text>
  <line x1="570" y1="450" x2="740" y2="488" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#arrDn)"/>
</svg>
