      context: [comparison]

faa_delays:
  account: GeneralGridDown
  dedup: "source+asset+day"
  rules:
    - condition: "value >= 500"
      outcome: WATCH
      context: [comparison]
    - condition: "value >= 100"
      outcome: WATCH
      context: [frequency]

transit:
  account: GeneralGridDown
  dedup: "source+asset+day"
  sources: ["mta_subway", "tfl_tube", "paris_metro", "db_trains", "ryanair", "sbb", "sncf"]
  rules:
    - condition: "value >= 4"
      outcome: RAGE
      context: [frequency]
    - condition: "value >= 2"
      outcome: WATCH
      context: [frequency]

cbp_border:
  account: GeneralGridDown
  dedup: "source+asset+day"
  rules:
    - condition: "wait_hours >= 3"
      outcome: RAGE
      context: [frequency, human_scale]
    - condition: "wait_hours >= 2"
      outcome: WATCH
      context: [comparison]

nrc_nuclear:
  account: GeneralGridDown
  dedup: "source+asset+week"
  rules:
