name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'data-node/**'
      - 'issuer/**'
      - 'ap/**'
      - 'common/**'
      - 'curator/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets.json'
      - 'deployments/**'

  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - be
          - chain

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy-be:
    name: Deploy to VPS 1 (Backend)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'be'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_BE_IP }}
          username: max
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_IP }}
          proxy_port: 3189
          proxy_username: max
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd ~/index

            echo "=== Pulling latest ==="
            git pull origin main

            echo "=== Building ==="
            source ~/.cargo/env 2>/dev/null
            cargo build --release -p data-node -p issuer 2>&1 | tail -10

            echo "=== Restarting services ==="
            pkill -f 'target/release/issuer' 2>/dev/null || true
            pkill -x data-node 2>/dev/null || true
            sleep 2

            # Start data-node
            mkdir -p logs
            nohup ./target/release/data-node serve \
              --database-url postgres:///index_prices \
              --rpc-url http://142.132.164.24/ \
              --settlement-rpc-url http://142.132.164.24/ \
              --ecb-enabled \
              --openmeteo-sync-interval 300 \
              > logs/data-node.log 2>&1 &
            sleep 2

            # Start issuers
            ISSUER_KEYS=(
              "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
              "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
              "0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6"
            )

            VISION_ADDR=$(python3 -c "import json; print(json.load(open('deployments/active-deployment.json'))['contracts'].get('Vision',''))" 2>/dev/null || echo "")
            BRIDGE_PROXY=$(python3 -c "import json; print(json.load(open('deployments/active-deployment.json'))['contracts'].get('BridgeProxy',''))" 2>/dev/null || echo "")

            for i in 1 2 3; do
              PORT=$((9000 + i))
              BLS_IDX=$((i - 1))
              KEY="${ISSUER_KEYS[$BLS_IDX]}"

              PEERS=""
              for j in 1 2 3; do
                if [ $j -ne $i ]; then
                  [ -n "$PEERS" ] && PEERS="$PEERS,"
                  PEERS="${PEERS}127.0.0.1:$((9000 + j))"
                fi
              done

              VISION_ARGS=""
              if [ -n "$VISION_ADDR" ]; then
                VISION_ARGS="--vision-enabled --vision-address $VISION_ADDR --vision-database-url postgres:///index_prices --vision-data-node-url http://localhost:8200 --vision-rpc-ws-url http://142.132.164.24/ --vision-reveal-window-secs 60 --vision-tick-poll-interval-ms 500"
              fi

              echo "$KEY" > /tmp/issuer-key-$i.txt
              ISSUER_PRIVATE_KEY_PATH=/tmp/issuer-key-$i.txt \
              ISSUER_PEERS=$PEERS \
              ISSUER_RPC_URL=http://142.132.164.24/ \
              ISSUER_SETTLEMENT_RPC_URL=http://142.132.164.24/ \
              ISSUER_SETTLEMENT_CHAIN_ID=111222333 \
              nohup ./target/release/issuer \
                --node-id $i --port $PORT --rpc http://142.132.164.24/ \
                --cycle-duration-ms 1000 --min-cycle-gap-ms 50 --consensus-timeout-ms 800 \
                --no-tls --test-key-seeds --bls-key-seed-index $BLS_IDX \
                --num-issuers 3 --registry-sync --ntp-server "" \
                --deployment-file deployments/active-deployment.json \
                --wal-path logs/consensus-$i.wal --log-level info \
                $([ -n "$BRIDGE_PROXY" ] && echo "--bridge-proxy $BRIDGE_PROXY") \
                $VISION_ARGS \
                > logs/issuer-$i.log 2>&1 &
              echo "Started issuer $i on port $PORT"
            done

            echo "=== Done ==="
            pgrep -a data-node || true
            pgrep -a issuer || true

  deploy-chain:
    name: Deploy to VPS 2 (AP)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'chain'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_CHAIN_IP }}
          username: max
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_IP }}
          proxy_port: 3189
          proxy_username: max
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd ~/index

            echo "=== Pulling latest ==="
            git pull origin main

            echo "=== Building ==="
            source ~/.cargo/env 2>/dev/null
            cargo build --release -p ap 2>&1 | tail -10

            echo "=== Restarting AP ==="
            pkill -f 'target/release/ap' 2>/dev/null || true
            sleep 2

            INDEX_ADDR=$(python3 -c "import json; print(json.load(open('deployments/active-deployment.json'))['contracts'].get('Index',''))" 2>/dev/null || echo "")
            MOCK_VAULT=$(python3 -c "import json; print(json.load(open('deployments/active-deployment.json'))['contracts'].get('MockBitgetVault',''))" 2>/dev/null || echo "")

            mkdir -p logs
            AP_PRIVATE_KEY=0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a \
            nohup ./target/release/ap \
              --port 9100 --rpc http://localhost/ \
              --exchange-mode mock \
              --settlement-rpc http://localhost/ --settlement-chain-id 111222333 \
              --deployment-file deployments/active-deployment.json \
              --data-node-url http://116.203.156.98:8200 \
              --log-level info \
              $([ -n "$INDEX_ADDR" ] && echo "--index-contract $INDEX_ADDR") \
              $([ -n "$MOCK_VAULT" ] && echo "--bitget-vault $MOCK_VAULT") \
              > logs/ap.log 2>&1 &

            echo "=== Done ==="
            pgrep -a ap || true
