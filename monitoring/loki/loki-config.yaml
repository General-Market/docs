# Loki Configuration for Index L3
# Centralized log aggregation with level-based retention (NFR18)
#
# Retention policy:
#   ERROR/WARN: 90 days
#   INFO: 30 days
#   DEBUG: 7 days

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Enable per-stream retention
  retention_period: 0s  # Disabled globally; per-stream rules apply
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Stream-based retention rules per NFR18
overrides:
  defaults:
    retention_period: 720h  # 30 days default (INFO)
    retention_stream:
      - selector: '{level=~"error|ERROR|warn|WARN"}'
        priority: 1
        period: 2160h  # 90 days for ERROR/WARN
      - selector: '{level=~"debug|DEBUG|trace|TRACE"}'
        priority: 2
        period: 168h   # 7 days for DEBUG/TRACE

analytics:
  reporting_enabled: false
