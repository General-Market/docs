# Index L3 Log Rotation Configuration
# Size-based rotation and retention enforcement for all components.
# Time-based rotation is handled by tracing-appender (daily).
# Retention per NFR18: ERROR/WARN 90 days, INFO 30 days, DEBUG 7 days.
#
# Usage:
#   logrotate -f /path/to/logrotate.conf       # Force rotation
#   logrotate -d /path/to/logrotate.conf       # Dry run
#
# In production, add a cron entry:
#   0 0 * * * /usr/sbin/logrotate /app/monitoring/logrotate/logrotate.conf

# All log files (single-file approach with Loki handling level-based retention)
/app/logs/*.log {
    # Size-based rotation: rotate when file exceeds 100MB
    size 100M

    # Keep up to 90 days of rotated logs (maximum retention)
    rotate 90

    # Don't error if log file is missing
    missingok

    # Don't rotate empty files
    notifempty

    # Compress rotated files
    compress
    delaycompress

    # Add date to rotated filename
    dateext
    dateformat -%Y%m%d

    # Copy and truncate instead of moving (allows writing to continue)
    copytruncate

    # Create new log files with same permissions
    create 0644 root root
}
