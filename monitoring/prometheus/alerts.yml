# Prometheus alerting rules for Index Protocol
# Based on NFR15-17 monitoring thresholds from Architecture Section 21

groups:
  - name: index_order_processing
    rules:
      # Orders per second
      - alert: HighOrderRate
        expr: rate(ap_orders_processed_total[1m]) > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Order rate above WARNING threshold (>100/s)"
          description: "Current order rate: {{ $value }}/s. Consider scaling."

      - alert: CriticalOrderRate
        expr: rate(ap_orders_processed_total[1m]) > 500
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Order rate CRITICAL (>500/s) - Scale alert"
          description: "Current order rate: {{ $value }}/s. Immediate scaling required."

      # Queue depth
      - alert: HighQueueDepth
        expr: ap_queue_depth > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AP queue depth above WARNING threshold (>100)"
          description: "Current queue depth: {{ $value }}."

      - alert: CriticalQueueDepth
        expr: ap_queue_depth > 500
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "AP queue depth CRITICAL (>500) - Pause new orders"
          description: "Current queue depth: {{ $value }}. Pause new order intake."

      # Average fill time
      - alert: HighFillTime
        expr: ap_avg_fill_time_seconds > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Average fill time above WARNING threshold (>30s)"
          description: "Current avg fill time: {{ $value }}s. Investigate AP."

      - alert: CriticalFillTime
        expr: ap_avg_fill_time_seconds > 300
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Average fill time CRITICAL (>5min) - Investigate AP"
          description: "Current avg fill time: {{ $value }}s. AP may be stalled."

  - name: index_ap_health
    rules:
      # AP health status
      - alert: APDegraded
        expr: ap_health_status < 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AP health degraded"
          description: "AP health status: {{ $value }} (0=unhealthy, 1=degraded, 2=healthy)."

      - alert: APUnhealthy
        expr: ap_health_status == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "AP is UNHEALTHY"
          description: "AP health status is 0 (unhealthy). Immediate investigation required."

      # Buffer balance
      - alert: LowBufferBalance
        expr: ap_buffer_balance_usd < 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Buffer balance below WARNING threshold (<$500)"
          description: "Current buffer balance: ${{ $value }}. Refill buffer."

      - alert: CriticalBufferBalance
        expr: ap_buffer_balance_usd < 100
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Buffer balance CRITICAL (<$100) - Refill immediately"
          description: "Current buffer balance: ${{ $value }}. Operations at risk."

  - name: index_oracle_health
    rules:
      # Oracle consensus time (from JSON exporter metrics)
      - alert: HighConsensusTime
        expr: oracle_last_consensus_time_ms > 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Oracle consensus time above WARNING threshold (>500ms)"
          description: "Current consensus time: {{ $value }}ms. Possible network issue."

      - alert: CriticalConsensusTime
        expr: oracle_last_consensus_time_ms > 2000
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Oracle consensus time CRITICAL (>2s) - Network issue"
          description: "Current consensus time: {{ $value }}ms. Network investigation required."

      # Oracles online — percentage-based thresholds that work for any cluster size
      # (3-node local dev, 20-node production, etc.)
      - alert: LowOraclesOnline
        expr: count(up{job="oracle-nodes"} == 1) / count(up{job="oracle-nodes"}) < 0.9
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Oracles online below 90% - quorum at risk"
          description: "{{ $value | humanizePercentage }} of oracles online. Check node health."

      - alert: CriticalOraclesOnline
        expr: count(up{job="oracle-nodes"} == 1) / count(up{job="oracle-nodes"}) < 0.7
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Oracles online below 70% - QUORUM RISK"
          description: "{{ $value | humanizePercentage }} of oracles online. Quorum may be lost."
