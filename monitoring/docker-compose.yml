version: '3.8'

# Index Protocol Monitoring Stack
# Prometheus + Grafana + AlertManager + JSON Exporter for issuer health
#
# WARNING: This standalone compose exposes ports 9090, 9093, and 3000.
# Do NOT run simultaneously with the root docker-compose.yml which also
# exposes these ports. Use one or the other, not both.
#
# Usage:
#   docker-compose -f monitoring/docker-compose.yml up -d
#
# Access:
#   Prometheus:    http://localhost:9090
#   AlertManager:  http://localhost:9093
#   Grafana:       http://localhost:3000 (admin/admin)

services:
  # ============ Prometheus ============
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: index-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - index-local
    restart: unless-stopped

  # ============ AlertManager ============
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: index-alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - prometheus
    networks:
      - index-local
    restart: unless-stopped

  # ============ Grafana ============
  grafana:
    image: grafana/grafana:11.4.0
    container_name: index-grafana
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/index-overview.json
    depends_on:
      - prometheus
    networks:
      - index-local
    restart: unless-stopped

  # ============ JSON Exporter (multi-target) ============
  # Single instance handles all issuer nodes via Prometheus relabel_configs
  json-exporter:
    image: prometheuscommunity/json-exporter:v0.6.0
    container_name: index-json-exporter
    volumes:
      - ./prometheus/json-exporter-config.yml:/config.yml:ro
    command:
      - "--config.file=/config.yml"
    networks:
      - index-local
    restart: unless-stopped

  # ============ Loki (Log Aggregation) ============
  loki:
    image: grafana/loki:2.9.4
    container_name: index-loki
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    networks:
      - index-local
    restart: unless-stopped

  # ============ Promtail (Log Shipper) ============
  promtail:
    image: grafana/promtail:2.9.4
    container_name: index-promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ../logs:/app/logs:ro
    command:
      - "-config.file=/etc/promtail/config.yaml"
    depends_on:
      - loki
    networks:
      - index-local
    restart: unless-stopped

networks:
  index-local:
    external: true
    name: index-local

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
