[package]
name = "prediction-market"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "prediction_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"
bytemuck = { version = "1.14", features = ["derive"] }
solana-instructions-sysvar = "3.0"
solana-sdk-ids = "3.1"
solana-instruction = "3.4"

[dev-dependencies]
litesvm = { version = "0.11.0", features = ["precompiles"] }
litesvm-token = "0.11.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-clock = "3.0"
solana-ed25519-program = "3.0"
ed25519-dalek = "2.1"
rand = "0.8"
hex = "0.4"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
