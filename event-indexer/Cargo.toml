[package]
name = "prediction-market-indexer"
version = "0.1.0"
edition = "2021"
description = "Event indexer for the Solana prediction-market program. Reads logs, writes Postgres."

# Standalone workspace — same justification as oracle-daemon/. The root
# workspace pins ethers/web3 deps incompatible with Solana 3.x.
[workspace]

[dependencies]
# Async runtime + channels + signal handling.
tokio = { version = "1", features = ["full", "signal"] }
futures-util = "0.3"

# Solana client surface. Pinned to the program's 3.x line. Anchor emits
# events as base64 log lines — we only need the RPC client and basic
# types to subscribe and decode signatures.
solana-client = "3.0"
solana-sdk = "3.0"
solana-program = "3.0"
solana-pubkey = "3.0"
solana-commitment-config = "3.0"
solana-rpc-client-api = "3.0"

# Postgres. tokio-postgres is the async client; deadpool-postgres wraps
# it in a pool so writers and the SSE path can share a handle without
# fighting over a single connection.
tokio-postgres = "0.7"
deadpool-postgres = "0.14"

# Serde for intermediate JSON + event payloads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors + diagnostics.
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI + encoding.
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
hex = "0.4"
bs58 = "0.5"

# Backoff for reconnect.
backoff = { version = "0.4", features = ["tokio"] }

[dev-dependencies]
# Hand-constructed borsh payloads for parser tests.
borsh = "1"

[[bin]]
name = "prediction-market-indexer"
path = "src/main.rs"
