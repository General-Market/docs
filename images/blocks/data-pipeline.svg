<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="panelShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.35"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="white"/>

  <!-- Decorative -->
  <circle cx="60" cy="660" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="930" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Title -->
  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3.6" opacity="0.45">DATA PIPELINE</text>
  <text x="490" y="68" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Ninety-eight APIs into a Rust process into a database into smart contracts.</text>

  <!-- External APIs row -->
  <text x="40" y="100" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">EXTERNAL APIs · 90+ SOURCES</text>

  <!-- Source chips: 6 chips. Width 132, gap 14, total 6*132 + 5*14 = 862. Start x=59. -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <rect x="59"  y="114" width="132" height="46" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="125" y="138" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">CoinGecko</text>
    <text x="125" y="153" text-anchor="middle" fill="#0A0A0A" font-size="9" opacity="0.4">crypto prices</text>

    <rect x="205" y="114" width="132" height="46" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="271" y="138" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">USGS</text>
    <text x="271" y="153" text-anchor="middle" fill="#0A0A0A" font-size="9" opacity="0.4">earthquakes</text>

    <rect x="351" y="114" width="132" height="46" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="417" y="138" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">TfL / IRIS</text>
    <text x="417" y="153" text-anchor="middle" fill="#0A0A0A" font-size="9" opacity="0.4">trains</text>

    <rect x="497" y="114" width="132" height="46" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="563" y="138" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">GitHub</text>
    <text x="563" y="153" text-anchor="middle" fill="#0A0A0A" font-size="9" opacity="0.4">repo stats</text>

    <rect x="643" y="114" width="132" height="46" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="709" y="138" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">NDBC</text>
    <text x="709" y="153" text-anchor="middle" fill="#0A0A0A" font-size="9" opacity="0.4">ocean buoys</text>

    <rect x="789" y="114" width="132" height="46" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="855" y="138" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">+ 85 others</text>
    <text x="855" y="153" text-anchor="middle" fill="#0A0A0A" font-size="9" opacity="0.4">npm, NRC, Steam…</text>
  </g>

  <!-- Funnel lines: many small lines from API row to data node -->
  <g stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1">
    <line x1="125" y1="162" x2="490" y2="190"/>
    <line x1="271" y1="162" x2="490" y2="190"/>
    <line x1="417" y1="162" x2="490" y2="190"/>
    <line x1="563" y1="162" x2="490" y2="190"/>
    <line x1="709" y1="162" x2="490" y2="190"/>
    <line x1="855" y1="162" x2="490" y2="190"/>
  </g>
  <circle cx="490" cy="192" r="3" fill="#0A0A0A" fill-opacity="0.6"/>

  <!-- =========== PANEL 1: DATA NODE =========== -->
  <g filter="url(#panelShadow)">
    <rect x="40" y="206" width="900" height="148" rx="16" fill="url(#darkGradP)"/>
  </g>
  <text x="64" y="238" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">LAYER 01</text>
  <text x="64" y="270" fill="white" font-size="22" font-weight="700">Data Node</text>
  <text x="64" y="290" fill="white" font-size="12" opacity="0.5">Rust · single binary · UFW-gated · authoritative store</text>

  <!-- Three pipeline pills inside the panel -->
  <g>
    <rect x="380" y="248" width="160" height="76" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="460" y="276" text-anchor="middle" fill="white" font-size="13" font-weight="700" letter-spacing="0.8">COLLECT</text>
    <text x="460" y="296" text-anchor="middle" fill="white" font-size="10" opacity="0.5">HTTP polling</text>
    <text x="460" y="311" text-anchor="middle" fill="white" font-size="10" opacity="0.5">retry &amp; backoff</text>

    <rect x="560" y="248" width="160" height="76" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="640" y="276" text-anchor="middle" fill="white" font-size="13" font-weight="700" letter-spacing="0.8">VALIDATE</text>
    <text x="640" y="296" text-anchor="middle" fill="white" font-size="10" opacity="0.5">bounds checks</text>
    <text x="640" y="311" text-anchor="middle" fill="white" font-size="10" opacity="0.5">staleness guard</text>

    <rect x="740" y="248" width="160" height="76" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="820" y="276" text-anchor="middle" fill="white" font-size="13" font-weight="700" letter-spacing="0.8">STORE</text>
    <text x="820" y="296" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Postgres</text>
    <text x="820" y="311" text-anchor="middle" fill="white" font-size="10" opacity="0.5">time-series rows</text>

    <!-- mini arrows between -->
    <path d="M548 286 L555 286" stroke="white" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrowDown)" transform="rotate(-90 552 286) translate(0)"/>
  </g>
  <!-- Replaced two horizontal arrows simply -->
  <g stroke="white" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M540 286 L554 286"/>
    <path d="M551 282 L555 286 L551 290"/>
    <path d="M720 286 L734 286"/>
    <path d="M731 282 L735 286 L731 290"/>
  </g>

  <!-- Inter-panel arrow 1 → 2 -->
  <line x1="490" y1="362" x2="490" y2="386" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- =========== PANEL 2: ORACLES =========== -->
  <g filter="url(#panelShadow)">
    <rect x="40" y="396" width="900" height="148" rx="16" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="64" y="428" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">LAYER 02</text>
  <text x="64" y="460" fill="#0A0A0A" font-size="22" font-weight="700">Oracles · 3×</text>
  <text x="64" y="480" fill="#0A0A0A" font-size="12" opacity="0.5">Independent reads · BLS aggregate signature · 2 / 3 + consensus</text>

  <!-- Three oracle nodes -->
  <g>
    <circle cx="416" cy="464" r="22" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="416" y="468" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">O₁</text>

    <circle cx="476" cy="464" r="22" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="476" y="468" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">O₂</text>

    <circle cx="536" cy="464" r="22" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="536" y="468" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">O₃</text>
  </g>

  <!-- Oracle steps -->
  <g>
    <text x="588" y="438" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="1.6" opacity="0.45">PER NODE</text>
    <text x="588" y="460" fill="#0A0A0A" font-size="12">· Read price snapshots</text>
    <text x="588" y="478" fill="#0A0A0A" font-size="12">· Resolve tick outcomes</text>
    <text x="588" y="496" fill="#0A0A0A" font-size="12">· BLS sign result</text>
  </g>

  <!-- Consensus pill -->
  <rect x="780" y="448" width="140" height="34" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="850" y="470" text-anchor="middle" fill="#059669" font-size="12" font-weight="700" letter-spacing="1.2">2 / 3 + CONSENSUS</text>

  <!-- Inter-panel arrow 2 → 3 -->
  <line x1="490" y1="552" x2="490" y2="576" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- =========== PANEL 3: SMART CONTRACTS =========== -->
  <g filter="url(#panelShadow)">
    <rect x="40" y="586" width="900" height="120" rx="16" fill="url(#darkGradP)"/>
  </g>
  <text x="64" y="618" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">LAYER 03</text>
  <text x="64" y="650" fill="white" font-size="22" font-weight="700">Smart Contracts</text>
  <text x="64" y="670" fill="white" font-size="11" opacity="0.4">Names from the protocol's earlier identity. The product is Blocks; the bytecode remembers.</text>

  <!-- Contract pills -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <rect x="380" y="608" width="170" height="80" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="465" y="630" text-anchor="middle" fill="white" font-size="12" font-weight="700">VisionPool.sol</text>
    <text x="465" y="654" text-anchor="middle" fill="white" font-size="10" opacity="0.55" font-family="Inter, sans-serif">sealed bitmaps</text>
    <text x="465" y="670" text-anchor="middle" fill="white" font-size="10" opacity="0.4" font-family="Inter, sans-serif">commit + reveal</text>

    <rect x="565" y="608" width="170" height="80" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="650" y="630" text-anchor="middle" fill="white" font-size="12" font-weight="700">VisionClaim.sol</text>
    <text x="650" y="654" text-anchor="middle" fill="white" font-size="10" opacity="0.55" font-family="Inter, sans-serif">BLS claims</text>
    <text x="650" y="670" text-anchor="middle" fill="white" font-size="10" opacity="0.4" font-family="Inter, sans-serif">winnings withdrawal</text>

    <rect x="750" y="608" width="170" height="80" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="835" y="630" text-anchor="middle" fill="white" font-size="12" font-weight="700">VisionReserve.sol</text>
    <text x="835" y="654" text-anchor="middle" fill="white" font-size="10" opacity="0.55" font-family="Inter, sans-serif">USDC custody</text>
    <text x="835" y="670" text-anchor="middle" fill="white" font-size="10" opacity="0.4" font-family="Inter, sans-serif">parimutuel pool</text>
  </g>
</svg>
