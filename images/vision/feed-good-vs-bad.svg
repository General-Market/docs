<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
  </defs>

  <rect width="980" height="480" fill="white"/>
  <circle cx="80" cy="420" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Header row -->
  <rect x="40" y="32" width="900" height="48" rx="12" fill="url(#darkGrad)"/>
  <line x1="280" y1="40" x2="280" y2="72" stroke="white" stroke-opacity="0.1"/>
  <line x1="610" y1="40" x2="610" y2="72" stroke="white" stroke-opacity="0.1"/>
  <text x="160" y="61" text-anchor="middle" fill="white" font-size="11" font-weight="600" letter-spacing="2">SOURCE TYPE</text>
  <text x="445" y="61" text-anchor="middle" fill="white" font-size="11" font-weight="600" letter-spacing="2">GOOD FEED</text>
  <text x="775" y="61" text-anchor="middle" fill="white" font-size="11" font-weight="600" letter-spacing="2">BAD FEED</text>

  <!-- Rows -->
  <g font-size="12">
    <!-- row 1 -->
    <text x="60" y="118" fill="#0A0A0A" font-weight="600">Live events</text>
    <circle cx="300" cy="113" r="3" fill="#10B981"/>
    <text x="312" y="118" fill="#0A0A0A">Score per team</text>
    <circle cx="630" cy="113" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="118" fill="#0A0A0A" opacity="0.55">Is the match over (bool)</text>
    <line x1="40" y1="138" x2="940" y2="138" stroke="#0A0A0A" stroke-opacity="0.06"/>

    <!-- row 2 -->
    <text x="60" y="172" fill="#0A0A0A" font-weight="600">Streaming</text>
    <circle cx="300" cy="167" r="3" fill="#10B981"/>
    <text x="312" y="172" fill="#0A0A0A">Viewer count right now</text>
    <circle cx="630" cy="167" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="172" fill="#0A0A0A" opacity="0.55">Total lifetime views</text>
    <line x1="40" y1="192" x2="940" y2="192" stroke="#0A0A0A" stroke-opacity="0.06"/>

    <!-- row 3 -->
    <text x="60" y="226" fill="#0A0A0A" font-weight="600">Social</text>
    <circle cx="300" cy="221" r="3" fill="#10B981"/>
    <text x="312" y="226" fill="#0A0A0A">Upvotes, comment count</text>
    <circle cx="630" cy="221" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="226" fill="#0A0A0A" opacity="0.55">Post text · not numeric</text>
    <line x1="40" y1="246" x2="940" y2="246" stroke="#0A0A0A" stroke-opacity="0.06"/>

    <!-- row 4 -->
    <text x="60" y="280" fill="#0A0A0A" font-weight="600">Packages</text>
    <circle cx="300" cy="275" r="3" fill="#10B981"/>
    <text x="312" y="280" fill="#0A0A0A">Daily downloads</text>
    <circle cx="630" cy="275" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="280" fill="#0A0A0A" opacity="0.55">Total downloads · monotonic</text>
    <line x1="40" y1="300" x2="940" y2="300" stroke="#0A0A0A" stroke-opacity="0.06"/>

    <!-- row 5 -->
    <text x="60" y="334" fill="#0A0A0A" font-weight="600">Prices</text>
    <circle cx="300" cy="329" r="3" fill="#10B981"/>
    <text x="312" y="334" fill="#0A0A0A">Spot price · live</text>
    <circle cx="630" cy="329" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="334" fill="#0A0A0A" opacity="0.55">Historical price · stale</text>
    <line x1="40" y1="354" x2="940" y2="354" stroke="#0A0A0A" stroke-opacity="0.06"/>

    <!-- row 6 -->
    <text x="60" y="388" fill="#0A0A0A" font-weight="600">Transport</text>
    <circle cx="300" cy="383" r="3" fill="#10B981"/>
    <text x="312" y="388" fill="#0A0A0A">Aircraft count overhead</text>
    <circle cx="630" cy="383" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="388" fill="#0A0A0A" opacity="0.55">Tail number · never changes</text>
    <line x1="40" y1="408" x2="940" y2="408" stroke="#0A0A0A" stroke-opacity="0.06"/>

    <!-- row 7 -->
    <text x="60" y="442" fill="#0A0A0A" font-weight="600">Geophysical</text>
    <circle cx="300" cy="437" r="3" fill="#10B981"/>
    <text x="312" y="442" fill="#0A0A0A">Alert level, magnitude</text>
    <circle cx="630" cy="437" r="3" fill="#0A0A0A" opacity="0.25"/>
    <text x="642" y="442" fill="#0A0A0A" opacity="0.55">Event location · static</text>
  </g>
</svg>
