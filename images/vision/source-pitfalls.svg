<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
  </defs>

  <rect width="980" height="760" fill="white"/>
  <circle cx="60" cy="700" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="930" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Header -->
  <rect x="40" y="32" width="900" height="48" rx="12" fill="url(#darkGrad)"/>
  <text x="490" y="61" text-anchor="middle" fill="white" font-size="12" font-weight="600" letter-spacing="3">THINGS THAT WILL BITE YOU</text>

  <!-- 2 columns × 4 rows of pitfall cards -->
  <g font-size="12">
    <!-- 1 -->
    <rect x="40" y="100" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="40" y="100" width="6" height="148" rx="3" fill="#0A0A0A" opacity="0.45"/>
    <text x="64" y="128" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">01</text>
    <text x="64" y="152" fill="#0A0A0A" font-size="14" font-weight="700">Rate limits collapse</text>
    <text x="64" y="180" fill="#0A0A0A" font-size="11" opacity="0.55">Community APIs vanish without warning.</text>
    <text x="64" y="196" fill="#0A0A0A" font-size="11" opacity="0.55">v6.db.transport.rest taught us this.</text>
    <text x="64" y="220" fill="#0A0A0A" font-size="11" opacity="0.45">Test under sustained load.</text>
    <text x="64" y="236" fill="#0A0A0A" font-size="11" opacity="0.45">Leave 10 – 20% headroom.</text>

    <!-- 2 -->
    <rect x="500" y="100" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="500" y="100" width="6" height="148" rx="3" fill="#0A0A0A" opacity="0.45"/>
    <text x="524" y="128" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">02</text>
    <text x="524" y="152" fill="#0A0A0A" font-size="14" font-weight="700">Partial data beats no data</text>
    <text x="524" y="180" fill="#0A0A0A" font-size="11" opacity="0.55">One asset fails. Emit the rest.</text>
    <text x="524" y="196" fill="#0A0A0A" font-size="11" opacity="0.55">Never fabricate zeros.</text>
    <text x="524" y="220" fill="#0A0A0A" font-size="11" opacity="0.45">SyncEngine handles holes gracefully.</text>
    <text x="524" y="236" fill="#0A0A0A" font-size="11" opacity="0.45">A skipped asset is honest.</text>

    <!-- 3 -->
    <rect x="40" y="264" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="40" y="264" width="6" height="148" rx="3" fill="#10B981"/>
    <text x="64" y="292" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">03</text>
    <text x="64" y="316" fill="#0A0A0A" font-size="14" font-weight="700">Asset ID prefix mismatch</text>
    <text x="64" y="344" fill="#0A0A0A" font-size="11" opacity="0.55">Rust emits</text>
    <text x="124" y="344" fill="#0A0A0A" font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.85">gh_</text>
    <text x="148" y="344" fill="#0A0A0A" font-size="11" opacity="0.55">. Frontend expects</text>
    <text x="262" y="344" fill="#0A0A0A" font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.85">github_</text>
    <text x="304" y="344" fill="#0A0A0A" font-size="11" opacity="0.55">.</text>
    <text x="64" y="364" fill="#0A0A0A" font-size="11" opacity="0.55">Market drifts into "Other" forever.</text>
    <text x="64" y="388" fill="#0A0A0A" font-size="11" opacity="0.45">Prefix is contract.</text>

    <!-- 4 -->
    <rect x="500" y="264" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="500" y="264" width="6" height="148" rx="3" fill="#10B981"/>
    <text x="524" y="292" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">04</text>
    <text x="524" y="316" fill="#0A0A0A" font-size="14" font-weight="700">Forgot to bump array sizes</text>
    <text x="524" y="344" fill="#0A0A0A" font-size="11" opacity="0.55">Two array size constants in</text>
    <text x="524" y="360" fill="#0A0A0A" font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.7">DeployAllVisionBatches.s.sol</text>
    <text x="524" y="384" fill="#0A0A0A" font-size="11" opacity="0.55">Miss one, deploy script fails.</text>

    <!-- 5 -->
    <rect x="40" y="428" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="40" y="428" width="6" height="148" rx="3" fill="#0A0A0A" opacity="0.45"/>
    <text x="64" y="456" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">05</text>
    <text x="64" y="480" fill="#0A0A0A" font-size="14" font-weight="700">Logo contrast</text>
    <text x="64" y="508" fill="#0A0A0A" font-size="11" opacity="0.55">White on #f5f5f5. Black on black.</text>
    <text x="64" y="524" fill="#0A0A0A" font-size="11" opacity="0.55">Squint at the card.</text>
    <text x="64" y="548" fill="#0A0A0A" font-size="11" opacity="0.45">If it disappears, change brandBg</text>
    <text x="64" y="564" fill="#0A0A0A" font-size="11" opacity="0.45">or pick another logo variant.</text>

    <!-- 6 -->
    <rect x="500" y="428" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="500" y="428" width="6" height="148" rx="3" fill="#0A0A0A" opacity="0.45"/>
    <text x="524" y="456" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">06</text>
    <text x="524" y="480" fill="#0A0A0A" font-size="14" font-weight="700">Group calls by key</text>
    <text x="524" y="508" fill="#0A0A0A" font-size="11" opacity="0.55">Parse the league or category from</text>
    <text x="524" y="524" fill="#0A0A0A" font-size="11" opacity="0.55">the asset ID. One call per group.</text>
    <text x="524" y="548" fill="#0A0A0A" font-size="11" opacity="0.45">300 games · 12 leagues · 12 fetches.</text>
    <text x="524" y="564" fill="#0A0A0A" font-size="11" opacity="0.45">Per-asset polling is a tax on yourself.</text>

    <!-- 7 -->
    <rect x="40" y="592" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="40" y="592" width="6" height="148" rx="3" fill="#0A0A0A" opacity="0.45"/>
    <text x="64" y="620" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">07</text>
    <text x="64" y="644" fill="#0A0A0A" font-size="14" font-weight="700">The database is generic</text>
    <text x="64" y="672" fill="#0A0A0A" font-size="11" opacity="0.55">No migrations. Every source writes to</text>
    <text x="64" y="688" fill="#0A0A0A" font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.7">market_assets, market_prices</text>
    <text x="64" y="712" fill="#0A0A0A" font-size="11" opacity="0.45">If it compiles and runs, rows arrive.</text>
    <text x="64" y="728" fill="#0A0A0A" font-size="11" opacity="0.45">Schema is one of the easy parts.</text>

    <!-- 8 -->
    <rect x="500" y="592" width="440" height="148" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
    <rect x="500" y="592" width="6" height="148" rx="3" fill="#0A0A0A" opacity="0.45"/>
    <text x="524" y="620" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.4">08</text>
    <text x="524" y="644" fill="#0A0A0A" font-size="14" font-weight="700">Frontend degrades gracefully</text>
    <text x="524" y="672" fill="#0A0A0A" font-size="11" opacity="0.55">Skip the registry entry and assets</text>
    <text x="524" y="688" fill="#0A0A0A" font-size="11" opacity="0.55">show up under "Other".</text>
    <text x="524" y="712" fill="#0A0A0A" font-size="11" opacity="0.45">Backend-only is fine while testing.</text>
    <text x="524" y="728" fill="#0A0A0A" font-size="11" opacity="0.45">Polish the UI once data flows.</text>
  </g>
</svg>
