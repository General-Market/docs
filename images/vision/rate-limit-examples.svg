<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="440" fill="white"/>
  <circle cx="60" cy="380" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="60" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">RATE LIMITS</text>
  <text x="490" y="66" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Every greed has a clock.</text>

  <!-- Header -->
  <rect x="40" y="94" width="900" height="40" rx="10" fill="url(#darkGrad)"/>
  <g font-size="11" letter-spacing="2" font-weight="600" fill="white">
    <text x="68"  y="118">SOURCE</text>
    <text x="380" y="118">LIMIT</text>
    <text x="620" y="118">STRATEGY</text>
  </g>

  <!-- Rows -->
  <g font-size="12">
    <text x="68"  y="164" fill="#0A0A0A" font-weight="500">GitHub (authenticated)</text>
    <text x="380" y="164" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace">5,000 / hr</text>
    <text x="620" y="164" fill="#0A0A0A" opacity="0.65">850 ms between requests</text>

    <rect x="40" y="176" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="68"  y="200" fill="#0A0A0A" font-weight="500">GitHub (no auth)</text>
    <text x="380" y="200" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace">60 / hr</text>
    <text x="620" y="200" fill="#0A0A0A" opacity="0.65">6.5 s between requests</text>

    <text x="68"  y="236" fill="#0A0A0A" font-weight="500">CoinGecko (free tier)</text>
    <text x="380" y="236" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace">30 / min</text>
    <text x="620" y="236" fill="#0A0A0A" opacity="0.65">2 s between requests</text>

    <rect x="40" y="248" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="68"  y="272" fill="#0A0A0A" font-weight="500">USGS Earthquake</text>
    <text x="380" y="272" fill="#10B981" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="600">no limit</text>
    <text x="620" y="272" fill="#0A0A0A" opacity="0.65">poll every 60 s</text>

    <text x="68"  y="308" fill="#0A0A0A" font-weight="500">TfL</text>
    <text x="380" y="308" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace">500 / min</text>
    <text x="620" y="308" fill="#0A0A0A" opacity="0.65">burst permitted</text>

    <rect x="40" y="320" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="68"  y="344" fill="#0A0A0A" font-weight="500">IODA</text>
    <text x="380" y="344" fill="#10B981" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="600">no limit</text>
    <text x="620" y="344" fill="#0A0A0A" opacity="0.65">poll every 5 min</text>

    <text x="68"  y="380" fill="#0A0A0A" font-weight="500">NOAA Weather</text>
    <text x="380" y="380" fill="#10B981" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="600">no limit</text>
    <text x="620" y="380" fill="#0A0A0A" opacity="0.65">poll every 15 min</text>
  </g>

  <line x1="40" y1="404" x2="940" y2="404" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="490" y="426" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">Sliding-window limiter. Backs off automatically when limits approach.</text>
</svg>
