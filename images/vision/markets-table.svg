<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="380" fill="white"/>
  <circle cx="80" cy="320" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="40" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">MARKETS TABLE</text>

  <rect x="40" y="72" width="900" height="260" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.06" filter="url(#shadow)"/>

  <!-- Headers -->
  <g font-size="10" letter-spacing="1.5" opacity="0.4">
    <text x="68"  y="98" fill="#0A0A0A">ASSET</text>
    <text x="380" y="98" fill="#0A0A0A">VALUE</text>
    <text x="560" y="98" fill="#0A0A0A">24H CHANGE</text>
    <text x="800" y="98" fill="#0A0A0A">YOUR BET</text>
  </g>
  <line x1="60" y1="110" x2="920" y2="110" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- Row 1: BTC, expanded -->
  <g>
    <text x="68"  y="138" fill="#0A0A0A" font-size="13" font-family="ui-monospace, SF Mono, Menlo, monospace">BTC-USD</text>
    <text x="380" y="138" fill="#0A0A0A" font-size="13" font-family="ui-monospace, SF Mono, Menlo, monospace">$67,432.10</text>
    <text x="560" y="138" fill="#10B981" font-size="13" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="600">+2.14%</text>
    <rect x="796" y="124" width="48" height="22" rx="11" fill="#10B981"/>
    <text x="820" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="700">UP</text>

    <!-- Expanded chart -->
    <rect x="68" y="152" width="852" height="88" rx="8" fill="#0A0A0A" fill-opacity="0.015"/>
    <text x="84" y="170" fill="#0A0A0A" font-size="9" letter-spacing="1.5" opacity="0.4">24H PRICE HISTORY</text>
    <polyline points="84,225 140,212 196,216 252,202 308,194 364,206 420,190 480,202 540,184 600,190 660,178 720,184 780,170 840,176 904,166"
              fill="none" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <line x1="60" y1="254" x2="920" y2="254" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- Row 2: ETH -->
  <g>
    <text x="68"  y="280" fill="#0A0A0A" font-size="13" font-family="ui-monospace, SF Mono, Menlo, monospace">ETH-USD</text>
    <text x="380" y="280" fill="#0A0A0A" font-size="13" font-family="ui-monospace, SF Mono, Menlo, monospace">$3,891.55</text>
    <text x="560" y="280" fill="#DC2626" font-size="13" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="600">−0.52%</text>
    <rect x="796" y="266" width="48" height="22" rx="11" fill="#DC2626"/>
    <text x="820" y="281" text-anchor="middle" fill="white" font-size="10" font-weight="700">DOWN</text>
  </g>

  <line x1="60" y1="298" x2="920" y2="298" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <text x="68" y="318" fill="#0A0A0A" font-size="11" opacity="0.35">…</text>

  <!-- Footer pill -->
  <rect x="40" y="346" width="900" height="24" rx="12" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="362" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">Click a row to expand the 24-hour history. Then commit, or do not.</text>
</svg>
