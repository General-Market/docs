<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect width="980" height="360" fill="white"/>
  <circle cx="80" cy="300" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="50" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3" opacity="0.45">TEST FLOW</text>

  <!-- 4 step cards across -->
  <g>
    <!-- Step 1 -->
    <rect x="40" y="100" width="200" height="120" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1" filter="url(#shadow)"/>
    <text x="60" y="128" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">STEP 01</text>
    <text x="60" y="156" fill="#0A0A0A" font-size="14" font-weight="700">curl the real API</text>
    <text x="60" y="178" fill="#0A0A0A" font-size="11" opacity="0.5">Confirm the upstream is</text>
    <text x="60" y="194" fill="#0A0A0A" font-size="11" opacity="0.5">awake and shape is sane.</text>

    <!-- arrow -->
    <line x1="244" y1="160" x2="296" y2="160" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="300" y="100" width="200" height="120" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.1" filter="url(#shadow)"/>
    <text x="320" y="128" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">STEP 02</text>
    <text x="320" y="156" fill="#0A0A0A" font-size="14" font-weight="700">cargo check</text>
    <text x="320" y="178" fill="#0A0A0A" font-size="11" opacity="0.5">It compiles or it does</text>
    <text x="320" y="194" fill="#0A0A0A" font-size="11" opacity="0.5">not. There is no middle.</text>

    <line x1="504" y1="160" x2="556" y2="160" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="560" y="100" width="200" height="120" rx="14" fill="url(#darkGrad)" filter="url(#shadow)"/>
    <text x="580" y="128" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">STEP 03</text>
    <text x="580" y="156" fill="white" font-size="14" font-weight="700">cargo test {source}</text>
    <text x="580" y="178" fill="white" font-size="11" opacity="0.55">Fixtures over fantasies.</text>
    <text x="580" y="194" fill="white" font-size="11" opacity="0.55">Pin the parser now.</text>

    <line x1="764" y1="160" x2="816" y2="160" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <rect x="820" y="100" width="120" height="120" rx="14" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.4" filter="url(#shadow)"/>
    <text x="840" y="128" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">STEP 04</text>
    <text x="840" y="156" fill="#0A0A0A" font-size="13" font-weight="700">tsc --noEmit</text>
    <text x="840" y="178" fill="#0A0A0A" font-size="11" opacity="0.5">Then run the</text>
    <text x="840" y="194" fill="#0A0A0A" font-size="11" opacity="0.5">UI locally.</text>
  </g>

  <!-- Bottom -->
  <rect x="40" y="248" width="900" height="60" rx="14" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="276" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="600">Four checks. Each removes one class of regret.</text>
  <text x="490" y="294" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">Visit /sources in the local UI. If the row is missing, your prefix is wrong.</text>
</svg>
