<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="700" fill="white"/>
  <circle cx="60" cy="640" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="46" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">VALUE TYPES BY SOURCE</text>
  <text x="490" y="68" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Same protocol. Fourteen units of measure. The chart adapts.</text>

  <!-- Header strip -->
  <rect x="40" y="96" width="900" height="44" rx="10" fill="url(#darkGrad)"/>
  <g font-size="11" letter-spacing="2" font-weight="600" fill="white">
    <text x="64"  y="122">SOURCE</text>
    <text x="324" y="122">VALUE LABEL</text>
    <text x="540" y="122">UNIT</text>
    <text x="720" y="122">EXAMPLE</text>
  </g>

  <!-- Rows: 14 rows. Each 38 tall. Start y=146. Alternate fill. -->
  <g font-size="12">
    <!-- Row 1: CoinGecko -->
    <rect x="40" y="146" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="170" fill="#0A0A0A" font-weight="500">CoinGecko</text>
    <text x="324" y="170" fill="#0A0A0A" opacity="0.7">Price</text>
    <text x="540" y="170" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">USD</text>
    <text x="720" y="170" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">$67,432.10</text>

    <!-- Row 2 -->
    <text x="64"  y="208" fill="#0A0A0A" font-weight="500">Finnhub Stocks</text>
    <text x="324" y="208" fill="#0A0A0A" opacity="0.7">Price</text>
    <text x="540" y="208" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">USD</text>
    <text x="720" y="208" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">$189.52</text>

    <!-- Row 3 -->
    <rect x="40" y="220" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="244" fill="#0A0A0A" font-weight="500">Polymarket</text>
    <text x="324" y="244" fill="#0A0A0A" opacity="0.7">Probability</text>
    <text x="540" y="244" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">%</text>
    <text x="720" y="244" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">73.2%</text>

    <!-- Row 4 -->
    <text x="64"  y="282" fill="#0A0A0A" font-weight="500">USGS Earthquakes</text>
    <text x="324" y="282" fill="#0A0A0A" opacity="0.7">Magnitude</text>
    <text x="540" y="282" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">M</text>
    <text x="720" y="282" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">4.2 M</text>

    <!-- Row 5 -->
    <rect x="40" y="294" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="318" fill="#0A0A0A" font-weight="500">Deutsche Bahn</text>
    <text x="324" y="318" fill="#0A0A0A" opacity="0.7">Avg Delay</text>
    <text x="540" y="318" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">min</text>
    <text x="720" y="318" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">8.3 min</text>

    <!-- Row 6 -->
    <text x="64"  y="356" fill="#0A0A0A" font-weight="500">Steam Gaming</text>
    <text x="324" y="356" fill="#0A0A0A" opacity="0.7">Players</text>
    <text x="540" y="356" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">online</text>
    <text x="720" y="356" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">1.2M online</text>

    <!-- Row 7 -->
    <rect x="40" y="368" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="392" fill="#0A0A0A" font-weight="500">McBroken</text>
    <text x="324" y="392" fill="#0A0A0A" opacity="0.7">% Broken</text>
    <text x="540" y="392" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">%</text>
    <text x="720" y="392" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">12.5%</text>

    <!-- Row 8 -->
    <text x="64"  y="430" fill="#0A0A0A" font-weight="500">GitHub</text>
    <text x="324" y="430" fill="#0A0A0A" opacity="0.7">Stars</text>
    <text x="540" y="430" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">—</text>
    <text x="720" y="430" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">45.2K</text>

    <!-- Row 9 -->
    <rect x="40" y="442" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="466" fill="#0A0A0A" font-weight="500">NOAA Tides</text>
    <text x="324" y="466" fill="#0A0A0A" opacity="0.7">Water Level</text>
    <text x="540" y="466" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">ft</text>
    <text x="720" y="466" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">2.34 ft</text>

    <!-- Row 10 -->
    <text x="64"  y="504" fill="#0A0A0A" font-weight="500">London Underground</text>
    <text x="324" y="504" fill="#0A0A0A" opacity="0.7">Disruption</text>
    <text x="540" y="504" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">0–8</text>
    <text x="720" y="504" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">3</text>

    <!-- Row 11 -->
    <rect x="40" y="516" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="540" fill="#0A0A0A" font-weight="500">Air Quality</text>
    <text x="324" y="540" fill="#0A0A0A" opacity="0.7">AQI</text>
    <text x="540" y="540" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">0–500</text>
    <text x="720" y="540" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">42</text>

    <!-- Row 12 -->
    <text x="64"  y="578" fill="#0A0A0A" font-weight="500">NRC Nuclear</text>
    <text x="324" y="578" fill="#0A0A0A" opacity="0.7">Power</text>
    <text x="540" y="578" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">%</text>
    <text x="720" y="578" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">98.5%</text>

    <!-- Row 13 -->
    <rect x="40" y="590" width="900" height="36" rx="6" fill="#0A0A0A" fill-opacity="0.02"/>
    <text x="64"  y="614" fill="#0A0A0A" font-weight="500">Theme Park Waits</text>
    <text x="324" y="614" fill="#0A0A0A" opacity="0.7">Avg Wait</text>
    <text x="540" y="614" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">min</text>
    <text x="720" y="614" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">45 min</text>

    <!-- Row 14 -->
    <text x="64"  y="652" fill="#0A0A0A" font-weight="500">Border Wait Times</text>
    <text x="324" y="652" fill="#0A0A0A" opacity="0.7">Wait Time</text>
    <text x="540" y="652" fill="#0A0A0A" opacity="0.7" font-family="ui-monospace, SF Mono, Menlo, monospace">min</text>
    <text x="720" y="652" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" font-weight="500">32 min</text>
  </g>

  <!-- Bottom rule -->
  <line x1="40" y1="676" x2="940" y2="676" stroke="#0A0A0A" stroke-opacity="0.06"/>
</svg>
