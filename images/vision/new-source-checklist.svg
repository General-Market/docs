      <rect x="500" y="650" width="14" height="14" rx="3" fill="white" fill-opacity="0.06" stroke="#10B981" stroke-opacity="0.7"/>
      <text x="524" y="662" fill="white" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.9">visit /sources locally</text>
