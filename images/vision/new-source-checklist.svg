  <text x="490" y="61" text-anchor="middle" fill="white" font-size="12" font-weight="600" letter-spacing="3">NEW SOURCE CHECKLIST</text>

  <!-- Two columns of sections -->
  <!-- Helper rendering box-circle for checkbox -->

