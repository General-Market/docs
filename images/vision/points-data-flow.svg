<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
  </defs>

  <rect width="980" height="520" fill="white"/>
  <circle cx="120" cy="440" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="860" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Title -->
  <text x="490" y="48" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="600" letter-spacing="3" opacity="0.4">POINTS DATA FLOW</text>

  <!-- Step 1: Oracle API -->
  <rect x="220" y="72" width="540" height="64" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="244" y="100" fill="#0A0A0A" font-size="13" font-weight="700">Oracle API</text>
  <text x="244" y="120" fill="#0A0A0A" font-size="11" opacity="0.55">settled rounds · player deposits</text>

  <line x1="490" y1="138" x2="490" y2="172" stroke="#0A0A0A" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M486,168 l4,6 l4,-6" fill="#0A0A0A" fill-opacity="0.4"/>

  <!-- Step 2: data-node points.rs (dark) -->
  <rect x="160" y="176" width="660" height="120" rx="12" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="184" y="206" fill="white" font-size="10" font-weight="600" letter-spacing="2" opacity="0.5">DATA NODE · points.rs</text>
  <line x1="184" y1="218" x2="796" y2="218" stroke="white" stroke-opacity="0.1"/>
  <circle cx="196" cy="242" r="3" fill="#10B981"/>
  <text x="212" y="246" fill="white" font-size="12" opacity="0.8">poll every 30s — settled Vision rounds</text>
  <circle cx="196" cy="266" r="3" fill="#10B981"/>
  <text x="212" y="270" fill="white" font-size="12" opacity="0.8">hourly cron — Creator + Holder pools</text>
  <circle cx="196" cy="290" r="3" fill="#10B981"/>
  <text x="212" y="290" fill="white" font-size="12" opacity="0.8">CSV backup every 4 hours · keeps last 10</text>

  <line x1="490" y1="298" x2="490" y2="332" stroke="#0A0A0A" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M486,328 l4,6 l4,-6" fill="#0A0A0A" fill-opacity="0.4"/>

  <!-- Step 3: Postgres -->
  <rect x="220" y="336" width="540" height="64" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="244" y="364" fill="#0A0A0A" font-size="13" font-weight="700">Postgres</text>
  <text x="244" y="384" fill="#0A0A0A" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" opacity="0.55">points_ledger · points_totals</text>

  <line x1="490" y1="402" x2="490" y2="432" stroke="#0A0A0A" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M486,428 l4,6 l4,-6" fill="#0A0A0A" fill-opacity="0.4"/>

  <!-- Step 4: HTTP endpoints + frontend -->
  <rect x="80" y="438" width="820" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="104" y="464" fill="#0A0A0A" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" opacity="0.55">GET /points?user=</text>
  <text x="104" y="482" fill="#0A0A0A" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace" opacity="0.55">GET /points/leaderboard</text>
  <line x1="500" y1="450" x2="500" y2="486" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="520" y="464" fill="#0A0A0A" font-size="12" font-weight="600">Frontend</text>
  <text x="520" y="482" fill="#0A0A0A" font-size="11" opacity="0.5">usePoints hook · /points page</text>
</svg>
