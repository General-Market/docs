<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="720" fill="white"/>
  <circle cx="60" cy="660" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="930" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">SOURCE DETAIL PAGE</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">One page, one source, everything you need to commit.</text>

  <!-- Category nav strip -->
  <rect x="40" y="84" width="900" height="36" rx="12" fill="#0A0A0A" fill-opacity="0.04"/>
  <g font-size="11" opacity="0.55">
    <rect x="58" y="94" width="48" height="20" rx="10" fill="#0A0A0A"/>
    <text x="82" y="108" text-anchor="middle" fill="white" font-weight="600">All 98</text>
    <text x="138" y="108" fill="#0A0A0A">Finance 14</text>
    <text x="220" y="108" fill="#0A0A0A">Economic 11</text>
    <text x="318" y="108" fill="#0A0A0A">Regulatory 4</text>
    <text x="406" y="108" fill="#0A0A0A">Tech 8</text>
    <text x="466" y="108" fill="#0A0A0A">Entertainment 15</text>
    <text x="584" y="108" fill="#0A0A0A">Geophysical 15</text>
    <text x="688" y="108" fill="#0A0A0A">Transport 16</text>
    <text x="772" y="108" fill="#0A0A0A">Nature 4</text>
    <text x="828" y="108" fill="#0A0A0A">Space 3</text>
  </g>

  <!-- Source hero -->
  <rect x="40" y="140" width="900" height="120" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.06" filter="url(#shadow)"/>
  <!-- Left side text -->
  <text x="60" y="170" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.45">FINANCE</text>
  <circle cx="172" cy="166" r="4" fill="#10B981"/>
  <text x="184" y="170" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.6">LIVE</text>

  <text x="60" y="200" fill="#0A0A0A" font-size="20" font-weight="700">CoinGecko Crypto</text>
  <text x="60" y="222" fill="#0A0A0A" font-size="12" opacity="0.55">Cryptocurrency market data — prices, volumes, market caps</text>
  <text x="60" y="240" fill="#0A0A0A" font-size="12" opacity="0.55">for thousands of tokens.</text>

  <!-- Right side logo -->
  <rect x="760" y="156" width="160" height="88" rx="12" fill="url(#logoGrad)"/>
  <circle cx="840" cy="200" r="22" fill="white" fill-opacity="0.08"/>
  <text x="840" y="206" text-anchor="middle" fill="white" font-size="11" opacity="0.6">logo</text>

  <!-- Batch tick bar -->
  <rect x="40" y="280" width="900" height="56" rx="12" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <g font-size="10" letter-spacing="1.5">
    <text x="76" y="300" text-anchor="middle" fill="white" opacity="0.5" font-weight="600">TICK</text>
    <text x="76" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">#1,247</text>

    <line x1="130" y1="290" x2="130" y2="326" stroke="white" stroke-opacity="0.1"/>

    <text x="184" y="300" text-anchor="middle" fill="white" opacity="0.5" font-weight="600">PLAYERS</text>
    <text x="184" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">42</text>

    <line x1="240" y1="290" x2="240" y2="326" stroke="white" stroke-opacity="0.1"/>

    <text x="294" y="300" text-anchor="middle" fill="white" opacity="0.5" font-weight="600">POOL</text>
    <text x="294" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">$12.5K</text>

    <line x1="348" y1="290" x2="348" y2="326" stroke="white" stroke-opacity="0.1"/>

    <!-- Progress bar -->
    <rect x="368" y="302" width="240" height="14" rx="7" fill="white" fill-opacity="0.08"/>
    <rect x="368" y="302" width="156" height="14" rx="7" fill="#10B981"/>

    <line x1="628" y1="290" x2="628" y2="326" stroke="white" stroke-opacity="0.1"/>

    <text x="680" y="300" text-anchor="middle" fill="white" opacity="0.5" font-weight="600">MULT</text>
    <text x="680" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">1.2×</text>

    <line x1="732" y1="290" x2="732" y2="326" stroke="white" stroke-opacity="0.1"/>

    <text x="788" y="300" text-anchor="middle" fill="white" opacity="0.5" font-weight="600">SET</text>
    <text x="788" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">18 / 24</text>

    <line x1="846" y1="290" x2="846" y2="326" stroke="white" stroke-opacity="0.1"/>

    <text x="894" y="300" text-anchor="middle" fill="white" opacity="0.5" font-weight="600">TIMER</text>
    <text x="894" y="322" text-anchor="middle" fill="white" font-size="14" font-weight="700">4:32</text>
  </g>

  <!-- Markets table (left) -->
  <rect x="40" y="356" width="580" height="320" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.06" filter="url(#shadow)"/>
  <text x="60" y="386" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">MARKETS</text>

  <!-- Table header -->
  <g font-size="10" opacity="0.4" letter-spacing="1.5">
    <text x="60"  y="412" fill="#0A0A0A">ASSET</text>
    <text x="260" y="412" fill="#0A0A0A">VALUE</text>
    <text x="380" y="412" fill="#0A0A0A">24H</text>
    <text x="500" y="412" fill="#0A0A0A">BET</text>
  </g>
  <line x1="60" y1="422" x2="600" y2="422" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- Rows -->
  <g font-size="12" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="60"  y="446" fill="#0A0A0A">BTC-USD</text>
    <text x="260" y="446" fill="#0A0A0A">$67,432</text>
    <text x="380" y="446" fill="#10B981">+2.14%</text>
    <rect x="496" y="432" width="42" height="20" rx="10" fill="#10B981"/>
    <text x="517" y="446" text-anchor="middle" fill="white" font-weight="600" font-size="10">UP</text>
  </g>

  <!-- Expanded chart -->
  <rect x="60" y="460" width="540" height="92" rx="8" fill="#0A0A0A" fill-opacity="0.015"/>
  <text x="76" y="480" fill="#0A0A0A" font-size="10" letter-spacing="1.5" opacity="0.4">24H PRICE HISTORY</text>
  <polyline points="76,538 130,520 184,524 238,510 290,500 348,514 400,496 460,508 520,488 580,494" fill="none" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5"/>

  <line x1="60" y1="566" x2="600" y2="566" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <g font-size="12" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="60"  y="588" fill="#0A0A0A">ETH-USD</text>
    <text x="260" y="588" fill="#0A0A0A">$3,892</text>
    <text x="380" y="588" fill="#DC2626">−0.52%</text>
    <rect x="496" y="574" width="42" height="20" rx="10" fill="#DC2626"/>
    <text x="517" y="588" text-anchor="middle" fill="white" font-weight="600" font-size="10">DN</text>
  </g>

  <line x1="60" y1="608" x2="600" y2="608" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <g font-size="12" font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="60"  y="630" fill="#0A0A0A">SOL-USD</text>
    <text x="260" y="630" fill="#0A0A0A">$142.33</text>
    <text x="380" y="630" fill="#10B981">+4.18%</text>
    <rect x="496" y="616" width="42" height="20" rx="10" fill="#10B981"/>
    <text x="517" y="630" text-anchor="middle" fill="white" font-weight="600" font-size="10">UP</text>
  </g>

  <text x="60" y="660" fill="#0A0A0A" font-size="11" opacity="0.35">…</text>

  <!-- Right: Batch entry + leaderboard -->
  <!-- Batch entry panel -->
  <rect x="640" y="356" width="300" height="220" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.06" filter="url(#shadow)"/>
  <text x="660" y="386" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">BATCH ENTRY</text>

  <text x="660" y="412" fill="#0A0A0A" font-size="13">Set predictions. Join the batch.</text>

  <text x="660" y="448" fill="#0A0A0A" font-size="10" letter-spacing="1.5" opacity="0.4">DEPOSIT</text>
  <rect x="660" y="456" width="260" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="676" y="476" fill="#0A0A0A" font-size="12" font-family="ui-monospace, SF Mono, Menlo, monospace">100.00 USDC</text>

  <text x="660" y="508" fill="#0A0A0A" font-size="10" letter-spacing="1.5" opacity="0.4">STAKE / TICK</text>
  <rect x="660" y="516" width="260" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="676" y="536" fill="#0A0A0A" font-size="12" font-family="ui-monospace, SF Mono, Menlo, monospace">1.00 USDC</text>

  <!-- Leaderboard panel -->
  <rect x="640" y="596" width="300" height="80" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.06" filter="url(#shadow)"/>
  <text x="660" y="618" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">TOP PLAYERS</text>

  <g font-size="11">
    <text x="660" y="640" fill="#0A0A0A" font-weight="600">#1</text>
    <text x="684" y="640" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.7">0xAb…12</text>
    <text x="920" y="640" text-anchor="end" fill="#10B981" font-weight="600">+$1,240</text>

    <text x="660" y="660" fill="#0A0A0A" font-weight="600" opacity="0.7">#2</text>
    <text x="684" y="660" fill="#0A0A0A" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.55">0x7F…89</text>
    <text x="920" y="660" text-anchor="end" fill="#10B981" opacity="0.85" font-weight="600">+$890</text>
  </g>

  <!-- Footer pill -->
  <rect x="40" y="692" width="900" height="24" rx="12" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="708" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">Hero. Tick bar. Markets. Predictions. The room where you commit.</text>
</svg>
