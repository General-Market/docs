<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.35"/>
    </marker>
  </defs>

  <rect width="980" height="760" fill="white"/>
  <circle cx="80" cy="700" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" letter-spacing="3" opacity="0.45">DATA PIPELINE</text>
  <text x="490" y="64" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">From APIs to contracts. Ninety-eight feeds into one schema.</text>

  <!-- ROW 1: External APIs (4 chips) -->
  <text x="40" y="100" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.45">EXTERNAL APIs</text>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <rect x="60"  y="116" width="180" height="56" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="150" y="142" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">USGS</text>
    <text x="150" y="160" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">earthquakes</text>

    <rect x="260" y="116" width="180" height="56" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="350" y="142" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">CoinGecko</text>
    <text x="350" y="160" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">crypto prices</text>

    <rect x="460" y="116" width="180" height="56" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="550" y="142" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">TfL</text>
    <text x="550" y="160" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">UK trains</text>

    <rect x="660" y="116" width="180" height="56" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="750" y="142" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">McBroken</text>
    <text x="750" y="160" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">ice cream</text>

    <rect x="860" y="116" width="80"  height="56" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
    <text x="900" y="142" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600" opacity="0.55">+94</text>
    <text x="900" y="160" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">others</text>
  </g>

  <!-- Funnel lines to data node -->
  <g stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1">
    <line x1="150" y1="174" x2="490" y2="208"/>
    <line x1="350" y1="174" x2="490" y2="208"/>
    <line x1="550" y1="174" x2="490" y2="208"/>
    <line x1="750" y1="174" x2="490" y2="208"/>
    <line x1="900" y1="174" x2="490" y2="208"/>
  </g>

  <!-- ROW 2: DATA NODE -->
  <rect x="180" y="208" width="620" height="216" rx="14" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="200" y="234" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.6">DATA NODE</text>
  <text x="200" y="252" fill="white" font-size="10" opacity="0.45" font-family="ui-monospace, SF Mono, Menlo, monospace">Rust process</text>

  <!-- Inner stages: collect / validate / store / serve -->
  <g>
    <!-- Collect -->
    <rect x="208" y="268" width="142" height="60" rx="10" fill="white" fill-opacity="0.06"/>
    <text x="279" y="294" text-anchor="middle" fill="white" font-size="13" font-weight="600">Collect</text>
    <text x="279" y="312" text-anchor="middle" fill="white" font-size="10" opacity="0.5">HTTP</text>

    <line x1="354" y1="298" x2="386" y2="298" stroke="white" stroke-opacity="0.3" marker-end="url(#arrow)" stroke-width="1"/>

    <!-- Validate -->
    <rect x="390" y="268" width="142" height="60" rx="10" fill="white" fill-opacity="0.06"/>
    <text x="461" y="294" text-anchor="middle" fill="white" font-size="13" font-weight="600">Validate</text>
    <text x="461" y="312" text-anchor="middle" fill="white" font-size="10" opacity="0.5">bounds, staleness</text>

    <line x1="536" y1="298" x2="568" y2="298" stroke="white" stroke-opacity="0.3" marker-end="url(#arrow)" stroke-width="1"/>

    <!-- Store -->
    <rect x="572" y="268" width="142" height="60" rx="10" fill="white" fill-opacity="0.06"/>
    <text x="643" y="294" text-anchor="middle" fill="white" font-size="13" font-weight="600">Store</text>
    <text x="643" y="312" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Postgres</text>

    <!-- Serve below validate -->
    <rect x="390" y="344" width="142" height="60" rx="10" fill="white" fill-opacity="0.06"/>
    <text x="461" y="370" text-anchor="middle" fill="white" font-size="13" font-weight="600">Serve</text>
    <text x="461" y="388" text-anchor="middle" fill="white" font-size="10" opacity="0.5">REST API</text>

    <!-- Arrow from store to serve -->
    <path d="M643,328 C643,344 461,344 461,344" stroke="white" stroke-opacity="0.3" stroke-width="1" fill="none"/>
  </g>

  <!-- Arrow down to Postgres -->
  <line x1="461" y1="404" x2="461" y2="448" stroke="#0A0A0A" stroke-opacity="0.25" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ROW 3: Postgres -->
  <rect x="280" y="452" width="420" height="80" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <text x="300" y="478" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">POSTGRESQL</text>

  <g font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.65">
    <text x="300" y="500" fill="#0A0A0A">market_prices</text>
    <text x="460" y="500" fill="#0A0A0A">market_prices_latest</text>
    <text x="300" y="518" fill="#0A0A0A">source_meta</text>
  </g>

  <!-- Arrow down to Vision API -->
  <line x1="490" y1="538" x2="490" y2="580" stroke="#0A0A0A" stroke-opacity="0.25" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ROW 4: Vision API -->
  <rect x="220" y="588" width="540" height="76" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <text x="240" y="612" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">VISION API</text>

  <g font-size="11" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.65">
    <text x="240" y="636" fill="#0A0A0A">/api/vision/batches</text>
    <text x="400" y="636" fill="#0A0A0A">/api/vision/ticks</text>
    <text x="540" y="636" fill="#0A0A0A">/api/vision/state</text>
    <text x="240" y="652" fill="#0A0A0A">/api/vision/history</text>
  </g>

  <!-- Arrow down to Frontend -->
  <line x1="490" y1="670" x2="490" y2="704" stroke="#0A0A0A" stroke-opacity="0.25" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ROW 5: Frontend -->
  <rect x="280" y="708" width="420" height="36" rx="14" fill="#10B981"/>
  <text x="490" y="731" text-anchor="middle" fill="white" font-size="13" font-weight="700" letter-spacing="1">FRONTEND · LIVE PRICES, CHARTS, MARKETS</text>
</svg>
