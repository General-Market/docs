<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
  </defs>

  <rect width="980" height="460" fill="white"/>
  <circle cx="80" cy="400" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="48" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3" opacity="0.45">DISCOVERY MODES</text>

  <!-- STATIC -->
  <rect x="40" y="76" width="293" height="340" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <text x="186" y="108" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700" letter-spacing="2">STATIC</text>
  <line x1="60" y1="124" x2="313" y2="124" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- static visual -->
  <rect x="76" y="142" width="220" height="92" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
  <text x="92" y="164" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.7">config.json</text>
  <text x="92" y="186" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.5">[</text>
  <text x="104" y="202" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.5">"volcano1",</text>
  <text x="104" y="218" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.5">"volcano2", ...</text>
  <text x="92" y="232" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.5">]</text>

  <text x="60" y="266" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.4">BEST FOR</text>
  <text x="60" y="286" fill="#0A0A0A" font-size="11" opacity="0.6">Stable lists, editorial control,</text>
  <text x="60" y="302" fill="#0A0A0A" font-size="11" opacity="0.6">no list-all endpoint upstream.</text>

  <text x="60" y="338" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.4">EXAMPLES</text>
  <text x="60" y="358" fill="#0A0A0A" font-size="11" opacity="0.6">Volcanoes</text>
  <text x="60" y="376" fill="#0A0A0A" font-size="11" opacity="0.6">Flight routes</text>
  <text x="60" y="394" fill="#0A0A0A" font-size="11" opacity="0.6">Nuclear plants</text>

  <!-- DYNAMIC -->
  <rect x="343" y="76" width="293" height="340" rx="14" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="490" y="108" text-anchor="middle" fill="white" font-size="13" font-weight="700" letter-spacing="2">DYNAMIC</text>
  <line x1="363" y1="124" x2="616" y2="124" stroke="white" stroke-opacity="0.12"/>

  <rect x="379" y="142" width="220" height="92" rx="10" fill="white" fill-opacity="0.06"/>
  <text x="395" y="164" fill="white" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.6">config.json</text>
  <text x="395" y="186" fill="white" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.5">[]</text>
  <text x="395" y="216" fill="white" font-size="11" opacity="0.55">fetch_assets()</text>
  <text x="395" y="230" fill="white" font-size="10" opacity="0.4">discovers at runtime</text>

  <text x="363" y="266" fill="white" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.5">BEST FOR</text>
  <text x="363" y="286" fill="white" font-size="11" opacity="0.7">Organic supply, hourly churn,</text>
  <text x="363" y="302" fill="white" font-size="11" opacity="0.7">too many to curate by hand.</text>

  <text x="363" y="338" fill="white" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.5">EXAMPLES</text>
  <text x="363" y="358" fill="white" font-size="11" opacity="0.7">Sports games</text>
  <text x="363" y="376" fill="white" font-size="11" opacity="0.7">Hacker News, Twitch</text>
  <text x="363" y="394" fill="white" font-size="11" opacity="0.7">Esports, Polymarket</text>

  <!-- HYBRID -->
  <rect x="646" y="76" width="293" height="340" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadow)"/>
  <text x="792" y="108" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700" letter-spacing="2">HYBRID</text>
  <line x1="666" y1="124" x2="919" y2="124" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <rect x="682" y="142" width="220" height="92" rx="10" fill="#0A0A0A" fill-opacity="0.04"/>
  <text x="698" y="164" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.7">config.json</text>
  <text x="698" y="186" fill="#0A0A0A" font-size="10" font-family="ui-monospace, SF Mono, Menlo, monospace" opacity="0.5">[ fixed seed ]</text>
  <text x="698" y="216" fill="#0A0A0A" font-size="11" opacity="0.55">+ discover_upstream()</text>
  <text x="698" y="230" fill="#0A0A0A" font-size="10" opacity="0.4">pulls in the rest</text>

  <text x="666" y="266" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.4">BEST FOR</text>
  <text x="666" y="286" fill="#0A0A0A" font-size="11" opacity="0.6">Curated base, API extras,</text>
  <text x="666" y="302" fill="#0A0A0A" font-size="11" opacity="0.6">long tail kept honest.</text>

  <text x="666" y="338" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.4">EXAMPLES</text>
  <text x="666" y="358" fill="#0A0A0A" font-size="11" opacity="0.6">CoinGecko</text>
  <text x="666" y="376" fill="#0A0A0A" font-size="11" opacity="0.6">GitHub repos</text>
  <text x="666" y="394" fill="#0A0A0A" font-size="11" opacity="0.6">npm packages</text>
</svg>
