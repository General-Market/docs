<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="720" fill="white"/>
  <circle cx="80" cy="660" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="80" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">INFRASTRUCTURE</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">One VPS runs what matters. Vercel serves the face. Mintlify, the explanation.</text>

  <!-- VPS 1 dark panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="88" width="900" height="380" rx="16" fill="url(#darkGrad)"/>
  </g>
  <text x="64" y="118" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.55">VPS 1 · BACKEND · 159.195.78.238</text>
  <text x="64" y="142" fill="white" font-size="18" font-weight="700">Eight services in one machine</text>

  <!-- Row 1: oracles -->
  <g>
    <rect x="64" y="166" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="80" y="186" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">ORACLE #1</text>
    <text x="80" y="208" fill="white" font-size="12" font-weight="600">Docker</text>
    <text x="80" y="224" fill="white" font-size="10" opacity="0.45">Rust · BLS signer</text>

    <rect x="354" y="166" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="370" y="186" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">ORACLE #2</text>
    <text x="370" y="208" fill="white" font-size="12" font-weight="600">Docker</text>
    <text x="370" y="224" fill="white" font-size="10" opacity="0.45">Rust · BLS signer</text>

    <rect x="644" y="166" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="660" y="186" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">ORACLE #3</text>
    <text x="660" y="208" fill="white" font-size="12" font-weight="600">Docker</text>
    <text x="660" y="224" fill="white" font-size="10" opacity="0.45">Rust · BLS signer</text>
  </g>

  <!-- Row 2: AP / Curator / Data Node -->
  <g>
    <rect x="64" y="240" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="80" y="260" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">AP / KEEPER</text>
    <text x="80" y="282" fill="white" font-size="12" font-weight="600">Binary</text>
    <text x="80" y="298" fill="white" font-size="10" opacity="0.45">Rust · Bitget executor</text>

    <rect x="354" y="240" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="370" y="260" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">CURATOR</text>
    <text x="370" y="282" fill="white" font-size="12" font-weight="600">Binary</text>
    <text x="370" y="298" fill="white" font-size="10" opacity="0.45">Rust · NAV + Morpho</text>

    <rect x="644" y="240" width="280" height="64" rx="10" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="660" y="260" fill="#10B981" font-size="10" font-weight="700" letter-spacing="2">DATA NODE</text>
    <text x="660" y="282" fill="white" font-size="12" font-weight="600">Binary · port 8200</text>
    <text x="660" y="298" fill="white" font-size="10" opacity="0.55">authoritative price store</text>
  </g>

  <!-- Row 3: bots + postgres -->
  <g>
    <rect x="64" y="314" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="80" y="334" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">VISION BOT</text>
    <text x="80" y="356" fill="white" font-size="12" font-weight="600">Python</text>
    <text x="80" y="372" fill="white" font-size="10" opacity="0.45">strategy framework</text>

    <rect x="354" y="314" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="370" y="334" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">SOCIAL BOT</text>
    <text x="370" y="356" fill="white" font-size="12" font-weight="600">Python</text>
    <text x="370" y="372" fill="white" font-size="10" opacity="0.45">98-source anomaly engine</text>

    <rect x="644" y="314" width="280" height="64" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
    <text x="660" y="334" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.5">POSTGRESQL</text>
    <text x="660" y="356" fill="white" font-size="12" font-weight="600">Docker</text>
    <text x="660" y="372" fill="white" font-size="10" opacity="0.45">prices, snapshots, backtest</text>
  </g>

  <!-- Nginx bar -->
  <rect x="64" y="392" width="860" height="56" rx="10" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.1"/>
  <text x="80" y="414" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.55">NGINX</text>
  <text x="80" y="434" fill="white" font-size="11" opacity="0.55">Reverse proxy · TLS termination · upstream pooling</text>

  <!-- Vercel panel -->
  <g filter="url(#shadow)">
    <rect x="40" y="486" width="440" height="200" rx="16" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="64" y="514" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">VERCEL</text>
  <text x="64" y="544" fill="#0A0A0A" font-size="18" font-weight="700">Next.js Frontend</text>
  <rect x="64" y="566" width="392" height="78" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="80" y="592" fill="#0A0A0A" font-size="12" font-weight="600">www.generalmarket.io</text>
  <text x="80" y="612" fill="#0A0A0A" font-size="11" opacity="0.55">trading UI · explorer · vision · points</text>
  <text x="80" y="630" fill="#0A0A0A" font-size="11" opacity="0.45">edge runtime, SSE upstream to data node</text>

  <!-- Mintlify panel -->
  <g filter="url(#shadow)">
    <rect x="500" y="486" width="440" height="200" rx="16" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
  </g>
  <text x="524" y="514" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">MINTLIFY</text>
  <text x="524" y="544" fill="#0A0A0A" font-size="18" font-weight="700">Documentation</text>
  <rect x="524" y="566" width="392" height="78" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="540" y="592" fill="#0A0A0A" font-size="12" font-weight="600">docs.generalmarket.io</text>
  <text x="540" y="612" fill="#0A0A0A" font-size="11" opacity="0.55">MDX, hosted</text>
  <text x="540" y="630" fill="#0A0A0A" font-size="11" opacity="0.45">the explanation, separated from the system</text>
</svg>
