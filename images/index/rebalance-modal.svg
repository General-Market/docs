<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadowMd">
      <feDropShadow dx="0" dy="2" stdDeviation="14" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="380" fill="white"/>
  <circle cx="50" cy="40" r="140" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="340" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">UI · REBALANCE MODAL</text>

  <!-- Modal -->
  <g filter="url(#shadowMd)">
    <rect x="220" y="72" width="540" height="280" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  </g>
  <!-- Header -->
  <text x="248" y="108" fill="#0A0A0A" font-size="15" font-weight="700">Rebalance · DeFi Blue Chips</text>
  <line x1="240" y1="124" x2="740" y2="124" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- Column headers -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" letter-spacing="1.6">
    <text x="248" y="152" fill="#0A0A0A" opacity="0.45">ASSET</text>
    <text x="420" y="152" fill="#0A0A0A" opacity="0.45">CURRENT</text>
    <text x="600" y="152" fill="#0A0A0A" opacity="0.45">NEW</text>
  </g>

  <!-- Rows -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13">
    <text x="248" y="186" fill="#0A0A0A" font-weight="600">BTC</text>
    <text x="420" y="186" fill="#0A0A0A" opacity="0.55">33.3%</text>
    <rect x="588" y="170" width="100" height="26" rx="6" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.12"/>
    <text x="638" y="188" text-anchor="middle" fill="#0A0A0A">50.0%</text>

    <text x="248" y="222" fill="#0A0A0A" font-weight="600">ETH</text>
    <text x="420" y="222" fill="#0A0A0A" opacity="0.55">33.3%</text>
    <rect x="588" y="206" width="100" height="26" rx="6" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.12"/>
    <text x="638" y="224" text-anchor="middle" fill="#0A0A0A">30.0%</text>

    <text x="248" y="258" fill="#0A0A0A" font-weight="600">SOL</text>
    <text x="420" y="258" fill="#0A0A0A" opacity="0.55">33.4%</text>
    <rect x="588" y="242" width="100" height="26" rx="6" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.12"/>
    <text x="638" y="260" text-anchor="middle" fill="#0A0A0A">20.0%</text>
  </g>

  <line x1="240" y1="288" x2="740" y2="288" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- Footer -->
  <text x="248" y="320" fill="#0A0A0A" font-size="12" font-weight="600">Total · 100.0%</text>
  <rect x="608" y="304" width="120" height="32" rx="980" fill="#0A0A0A"/>
  <text x="668" y="324" text-anchor="middle" fill="white" font-size="12" font-weight="600">Rebalance</text>
