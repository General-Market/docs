<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" width="980" height="880" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.5"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#0A0A0A" fill-opacity="0.5"/>
    </marker>
  </defs>

  <rect width="980" height="880" fill="white"/>
  <circle cx="80" cy="800" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="100" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">ORDER LIFECYCLE</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">A buy order passes through five hands. Each verifies the one before.</text>

  <!-- Swimlane headers -->
  <g>
    <rect x="40" y="88" width="170" height="40" rx="10" fill="url(#darkGrad)"/>
    <text x="125" y="113" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">USER</text>

    <rect x="225" y="88" width="170" height="40" rx="10" fill="url(#darkGrad)"/>
    <text x="310" y="113" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">L3 CHAIN</text>

    <rect x="410" y="88" width="170" height="40" rx="10" fill="url(#darkGrad)"/>
    <text x="495" y="113" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">ORACLES</text>

    <rect x="595" y="88" width="170" height="40" rx="10" fill="url(#darkGrad)"/>
    <text x="680" y="113" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">AP / KEEPER</text>

    <rect x="780" y="88" width="160" height="40" rx="10" fill="url(#darkGrad)"/>
    <text x="860" y="113" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">BITGET</text>
  </g>

  <!-- Vertical swimlane lines -->
  <g stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4,4">
    <line x1="125" y1="138" x2="125" y2="830"/>
    <line x1="310" y1="138" x2="310" y2="830"/>
    <line x1="495" y1="138" x2="495" y2="830"/>
    <line x1="680" y1="138" x2="680" y2="830"/>
    <line x1="860" y1="138" x2="860" y2="830"/>
  </g>

  <!-- Step 1: submitOrder -->
  <line x1="125" y1="170" x2="310" y2="170" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <text x="218" y="162" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace">submitOrder(buy)</text>

  <!-- Step 2: OrderSubmitted event -->
  <line x1="310" y1="206" x2="495" y2="206" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <text x="402" y="198" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.7">OrderSubmitted event</text>

  <!-- Consensus cycle panel inside oracles lane -->
  <g filter="url(#shadow)">
    <rect x="410" y="226" width="170" height="178" rx="12" fill="url(#darkGrad)"/>
  </g>
  <text x="495" y="252" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.6">CONSENSUS CYCLE</text>
  <text x="495" y="270" text-anchor="middle" fill="white" font-size="10" opacity="0.4">1 second</text>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <text x="426" y="296" fill="white" font-size="10" opacity="0.4">0ms</text>
    <text x="495" y="296" text-anchor="middle" fill="white" font-size="11" font-weight="600">COLLECT</text>

    <text x="426" y="316" fill="white" font-size="10" opacity="0.4">200ms</text>
    <text x="495" y="316" text-anchor="middle" fill="white" font-size="11" font-weight="600">PROPOSE</text>

    <text x="426" y="336" fill="white" font-size="10" opacity="0.4">400ms</text>
    <text x="495" y="336" text-anchor="middle" fill="white" font-size="11" font-weight="600">SIGN</text>

    <text x="426" y="356" fill="white" font-size="10" opacity="0.4">600ms</text>
    <text x="495" y="356" text-anchor="middle" fill="white" font-size="11" font-weight="600">CONFIRM</text>

    <text x="426" y="376" fill="white" font-size="10" opacity="0.4">800ms</text>
    <text x="495" y="376" text-anchor="middle" fill="white" font-size="11" font-weight="600">REBALANCE</text>
  </g>

  <!-- Step 3: confirmBatch -->
  <line x1="495" y1="430" x2="310" y2="430" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="402" y="422" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace">confirmBatch()</text>
  <text x="402" y="444" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">orders + blsSignature</text>

  <!-- BLS verify chip on L3 lane -->
  <rect x="248" y="464" width="124" height="26" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="310" y="481" text-anchor="middle" fill="#10B981" font-size="10" font-weight="700">BLSLib.verify ✓</text>

  <!-- Step 4: TradeRequest event → AP -->
  <line x1="310" y1="518" x2="680" y2="518" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <text x="495" y="510" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.7">TradeRequest event (on-chain only)</text>

  <!-- FR13 isolation note -->
  <rect x="410" y="534" width="170" height="46" rx="10" fill="#0A0A0A" fill-opacity="0.04" stroke="#0A0A0A" stroke-opacity="0.08" stroke-dasharray="4,4"/>
  <text x="495" y="552" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.55">FR13 · ISOLATION</text>
  <text x="495" y="570" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">no oracle → AP channel</text>

  <!-- Step 5: market buy -->
  <line x1="680" y1="612" x2="860" y2="612" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <text x="770" y="604" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.7">market buy</text>

  <!-- Step 6: fill confirmed -->
  <line x1="860" y1="642" x2="680" y2="642" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="770" y="634" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.7">fill confirmed</text>

  <!-- Step 7: confirmFills → L3 -->
  <line x1="680" y1="678" x2="310" y2="678" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="495" y="670" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace">confirmFills()</text>
  <text x="495" y="694" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">fills + blsSignature</text>

  <!-- BLS verify ✓ + mint -->
  <rect x="248" y="712" width="124" height="26" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="310" y="729" text-anchor="middle" fill="#10B981" font-size="10" font-weight="700">BLSLib.verify ✓</text>

  <text x="310" y="754" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600">ITP shares minted</text>
  <text x="310" y="770" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">USDC settled</text>

  <!-- Final: shares in wallet -->
  <line x1="310" y1="800" x2="125" y2="800" stroke="#10B981" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#arrowL)"/>
  <text x="218" y="792" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">shares in wallet</text>

  <!-- Footer pill -->
  <rect x="40" y="836" width="900" height="36" rx="12" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="860" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">Trust no one. Verify everything. The chain is the witness.</text>
</svg>
