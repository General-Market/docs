<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowA">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="760" fill="white"/>
  <circle cx="60" cy="700" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="930" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Title -->
  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">SYSTEM ARCHITECTURE</text>

  <!-- Users -->
  <rect x="380" y="68" width="220" height="48" rx="12" fill="#0A0A0A" fill-opacity="0.03" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="490" y="98" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Users / Bots</text>

  <line x1="490" y1="120" x2="490" y2="140" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aDown)"/>

  <!-- Frontend -->
  <g filter="url(#shadowA)">
    <rect x="120" y="146" width="740" height="76" rx="14" fill="url(#darkGradA)"/>
  </g>
  <text x="146" y="178" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">LAYER 01</text>
  <text x="146" y="202" fill="white" font-size="18" font-weight="700">Frontend · Next.js</text>
  <text x="490" y="202" fill="white" font-size="11" opacity="0.55">Trading · Vision · Lending · Explorer · Points · Backtesting</text>

  <!-- Two channels down -->
  <line x1="320" y1="226" x2="320" y2="256" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aDown)"/>
  <text x="310" y="248" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.5">SSE / REST</text>
  <line x1="660" y1="226" x2="660" y2="256" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aDown)"/>
  <text x="672" y="248" fill="#0A0A0A" font-size="10" opacity="0.5">RPC</text>

  <!-- Row 2: Data Node + Index L3 -->
  <rect x="40" y="264" width="440" height="120" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowA)"/>
  <rect x="40" y="264" width="3" height="60" rx="1.5" fill="#10B981"/>
  <text x="60" y="296" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">LAYER 02 · DATA</text>
  <text x="60" y="324" fill="#0A0A0A" font-size="18" font-weight="700">Data Node</text>
  <text x="60" y="348" fill="#0A0A0A" font-size="11" opacity="0.55">Rust · 90+ sources · PostgreSQL</text>
  <text x="60" y="368" fill="#0A0A0A" font-size="11" opacity="0.55">NAV engine · backtesting</text>

  <rect x="500" y="264" width="440" height="120" rx="14" fill="url(#darkGradA)" filter="url(#shadowA)"/>
  <text x="520" y="296" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">LAYER 02 · CHAIN</text>
  <text x="520" y="324" fill="white" font-size="18" font-weight="700">Index L3 (Orbit)</text>
  <text x="520" y="348" fill="white" font-size="11" opacity="0.55">Chain 111222333 · sub-second finality</text>
  <text x="520" y="368" fill="white" font-size="11" opacity="0.55">Index.sol · Vision.sol · BotRegistry · 29 contracts</text>

  <!-- Arrows down from row 2 -->
  <line x1="260" y1="388" x2="260" y2="418" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aDown)"/>
  <line x1="620" y1="388" x2="620" y2="418" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aDown)"/>
  <text x="612" y="410" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.5">BLS-signed</text>
  <line x1="820" y1="388" x2="820" y2="418" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aDown)"/>
  <text x="828" y="410" fill="#0A0A0A" font-size="10" opacity="0.5">bridge</text>

  <!-- Row 3: Oracles + AP + Settlement -->
  <rect x="40" y="426" width="280" height="104" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <rect x="40" y="426" width="3" height="52" rx="1.5" fill="#10B981"/>
  <text x="60" y="454" fill="#0A0A0A" font-size="14" font-weight="700">Oracle Nodes · 3×</text>
  <text x="60" y="476" fill="#0A0A0A" font-size="11" opacity="0.55">Rust · BLS consensus</text>
  <text x="60" y="496" fill="#0A0A0A" font-size="11" opacity="0.55">1s cycles · round-robin</text>
  <text x="60" y="516" fill="#0A0A0A" font-size="11" opacity="0.4">Watching everything</text>

  <rect x="340" y="426" width="280" height="104" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="360" y="454" fill="#0A0A0A" font-size="14" font-weight="700">AP / Keeper</text>
  <text x="360" y="476" fill="#0A0A0A" font-size="11" opacity="0.55">Rust · Bitget execution</text>
  <text x="360" y="496" fill="#0A0A0A" font-size="11" opacity="0.55">Bridge relay</text>
  <text x="360" y="516" fill="#0A0A0A" font-size="11" opacity="0.4">The hands that buy</text>

  <rect x="640" y="426" width="300" height="104" rx="12" fill="url(#darkGradA)"/>
  <text x="660" y="454" fill="white" font-size="14" font-weight="700">Settlement (Sonic)</text>
  <text x="660" y="476" fill="white" font-size="11" opacity="0.55">Morpho lending</text>
  <text x="660" y="496" fill="white" font-size="11" opacity="0.55">BridgedITP shares · NAV oracle</text>
  <text x="660" y="516" fill="white" font-size="11" opacity="0.4">Chain 14601</text>

  <!-- Divider before satellite services -->
  <line x1="40" y1="558" x2="940" y2="558" stroke="#0A0A0A" stroke-opacity="0.06" stroke-dasharray="4,4"/>
  <text x="490" y="586" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.4">SATELLITE SERVICES</text>

  <!-- Row 4: Vision Bot / Social Bot / Curator -->
  <rect x="40" y="604" width="280" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="60" y="630" fill="#0A0A0A" font-size="14" font-weight="700">Vision Bot</text>
  <text x="60" y="652" fill="#0A0A0A" font-size="11" opacity="0.55">Python · automated betting</text>
  <text x="60" y="672" fill="#0A0A0A" font-size="11" opacity="0.55">Strategies on prediction markets</text>

  <rect x="340" y="604" width="280" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="360" y="630" fill="#0A0A0A" font-size="14" font-weight="700">Social Bot</text>
  <text x="360" y="652" fill="#0A0A0A" font-size="11" opacity="0.55">Python · anomaly detection</text>
  <text x="360" y="672" fill="#0A0A0A" font-size="11" opacity="0.55">Attention follows catastrophe</text>

  <rect x="640" y="604" width="300" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="660" y="630" fill="#0A0A0A" font-size="14" font-weight="700">Curator</text>
  <text x="660" y="652" fill="#0A0A0A" font-size="11" opacity="0.55">Rust · NAV oracle updates</text>
  <text x="660" y="672" fill="#0A0A0A" font-size="11" opacity="0.55">Morpho allocation · health monitoring</text>

  <text x="490" y="734" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.35">Eight services. Twenty-nine contracts. Two chains. One frontend.</text>
</svg>
