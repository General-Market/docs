<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradRl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowRl">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="720" fill="white"/>
  <circle cx="50" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="660" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Header dark -->
  <g filter="url(#shadowRl)">
    <rect x="40" y="40" width="900" height="58" rx="14" fill="url(#darkGradRl)"/>
  </g>
  <text x="64" y="68" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">REBALANCELIB.REBALANCE()</text>
  <text x="64" y="88" fill="white" font-size="12" opacity="0.55">delegatecall from Investment.sol · eight steps · no negotiation</text>

  <!-- Eight steps as 2-column grid -->
  <g font-size="13">
    <!-- 1 -->
    <rect x="40" y="118" width="440" height="120" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowRl)"/>
    <circle cx="68" cy="146" r="14" fill="#0A0A0A" fill-opacity="0.06"/>
    <text x="68" y="151" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700">1</text>
    <text x="94" y="151" fill="#0A0A0A" font-weight="700">Read current NAV</text>
    <text x="94" y="180" fill="#0A0A0A" font-size="11" opacity="0.55">from _itpNavs[itpId]</text>
    <text x="94" y="200" fill="#0A0A0A" font-size="11" opacity="0.55">the anchor everything will</text>
    <text x="94" y="216" fill="#0A0A0A" font-size="11" opacity="0.55">have to preserve</text>

    <!-- 2 -->
    <rect x="500" y="118" width="440" height="120" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowRl)"/>
    <circle cx="528" cy="146" r="14" fill="#0A0A0A" fill-opacity="0.06"/>
    <text x="528" y="151" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700">2</text>
    <text x="554" y="151" fill="#0A0A0A" font-weight="700">Snapshot old state</text>
    <text x="554" y="180" fill="#0A0A0A" font-size="11" opacity="0.55">assets + inventory cached</text>
    <text x="554" y="200" fill="#0A0A0A" font-size="11" opacity="0.55">to compute deltas at the end</text>

    <!-- 3 — swap and pop -->
    <rect x="40" y="252" width="900" height="140" rx="12" fill="url(#darkGradRl)" filter="url(#shadowRl)"/>
    <circle cx="68" cy="280" r="14" fill="#10B981" fill-opacity="0.2"/>
    <text x="68" y="285" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700">3</text>
    <text x="94" y="285" fill="white" font-weight="700">Swap-and-pop removed assets</text>
    <text x="94" y="306" fill="white" font-size="11" opacity="0.6">descending order required · contract uses constant-time removal</text>

    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="white">
      <text x="94" y="338" opacity="0.55">assets:  [A, B, C, D, E]</text>
      <text x="94" y="356" opacity="0.55">remove:  [3, 1]  →  drop D, then B</text>
      <text x="94" y="376" opacity="0.85">result:  [A, E, C]</text>
    </g>

    <!-- 4 -->
    <rect x="40" y="406" width="440" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowRl)"/>
    <circle cx="68" cy="434" r="14" fill="#0A0A0A" fill-opacity="0.06"/>
    <text x="68" y="439" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700">4</text>
    <text x="94" y="439" fill="#0A0A0A" font-weight="700">Push new assets</text>
    <text x="94" y="468" fill="#0A0A0A" font-size="11" opacity="0.55">appended to end of arrays</text>
    <text x="94" y="486" fill="#0A0A0A" font-size="11" opacity="0.55">no duplicates permitted</text>

    <!-- 5 -->
    <rect x="500" y="406" width="440" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowRl)"/>
    <circle cx="528" cy="434" r="14" fill="#0A0A0A" fill-opacity="0.06"/>
    <text x="528" y="439" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700">5</text>
    <text x="554" y="439" fill="#0A0A0A" font-weight="700">Validate weights</text>
    <text x="554" y="468" fill="#0A0A0A" font-size="11" opacity="0.55">sum exactly 1e18</text>
    <text x="554" y="486" fill="#0A0A0A" font-size="11" opacity="0.55">each weight ≥ 0.25%</text>

    <!-- 6 — formula -->
    <rect x="40" y="520" width="900" height="100" rx="12" fill="url(#darkGradRl)" filter="url(#shadowRl)"/>
    <circle cx="68" cy="548" r="14" fill="#10B981" fill-opacity="0.2"/>
    <text x="68" y="553" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700">6</text>
    <text x="94" y="553" fill="white" font-weight="700">Compute new inventory</text>
    <text x="94" y="588" fill="white" font-size="14" font-family="ui-monospace, SF Mono, Menlo, monospace">inventory[i] = (newWeights[i] × nav) / price[i]</text>
    <text x="94" y="608" fill="white" font-size="11" opacity="0.5">for every asset · old and new</text>

    <!-- 7 -->
    <rect x="40" y="634" width="440" height="68" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <circle cx="68" cy="668" r="14" fill="#0A0A0A" fill-opacity="0.06"/>
    <text x="68" y="673" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700">7</text>
    <text x="94" y="664" fill="#0A0A0A" font-weight="700">Write NAV (preserved)</text>
    <text x="94" y="684" fill="#0A0A0A" font-size="11" opacity="0.55">metadata updated · invariant held</text>

    <!-- 8 -->
    <rect x="500" y="634" width="440" height="68" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <rect x="500" y="634" width="3" height="68" rx="1.5" fill="#10B981"/>
    <circle cx="528" cy="668" r="14" fill="#10B981" fill-opacity="0.18"/>
    <text x="528" y="673" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700">8</text>
    <text x="554" y="664" fill="#0A0A0A" font-weight="700">Emit events</text>
    <text x="554" y="684" fill="#0A0A0A" font-size="11" opacity="0.55">Rebalanced + AssetTradeRequest per delta</text>
  </g>
</svg>
