<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradDN" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowDN">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aDN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="680" fill="white"/>
  <circle cx="60" cy="620" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="930" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Header band -->
  <g filter="url(#shadowDN)">
    <rect x="40" y="32" width="900" height="64" rx="14" fill="url(#darkGradDN)"/>
  </g>
  <text x="64" y="62" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">DATA NODE</text>
  <text x="64" y="84" fill="white" font-size="13" opacity="0.6">91 sources · REST · WebSocket · SSE · one database</text>
  <text x="916" y="78" text-anchor="end" fill="white" font-size="11" opacity="0.45">Rust · 76K LOC · Tokio</text>

  <!-- Column headers -->
  <text x="180" y="128" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.45">EXTERNAL DATA</text>
  <text x="490" y="128" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.45">COLLECTORS</text>
  <text x="800" y="128" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.45">STORAGE</text>

  <!-- External data column -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">
    <rect x="60" y="146" width="240" height="380" rx="12" fill="#0A0A0A" fill-opacity="0.03" stroke="#0A0A0A" stroke-opacity="0.05"/>
    <text x="80" y="174" fill="#0A0A0A" font-weight="600">Earthquakes</text>
    <text x="80" y="196" fill="#0A0A0A" font-weight="600">Weather · NOAA</text>
    <text x="80" y="218" fill="#0A0A0A" font-weight="600">Trains · IRIS-TTS</text>
    <text x="80" y="240" fill="#0A0A0A" font-weight="600">Flights</text>
    <text x="80" y="262" fill="#0A0A0A" font-weight="600">Crypto · CoinGecko</text>
    <text x="80" y="284" fill="#0A0A0A" font-weight="600">Stocks · Finnhub</text>
    <text x="80" y="306" fill="#0A0A0A" font-weight="600">DeFi · Llama</text>
    <text x="80" y="328" fill="#0A0A0A" font-weight="600">Esports</text>
    <text x="80" y="350" fill="#0A0A0A" font-weight="600">Reddit · 4chan</text>
    <text x="80" y="372" fill="#0A0A0A" font-weight="600">Steam · Twitch</text>
    <text x="80" y="394" fill="#0A0A0A" font-weight="600">Nuclear · NRC</text>
    <text x="80" y="416" fill="#0A0A0A" font-weight="600">Volcanoes</text>
    <text x="80" y="438" fill="#0A0A0A" font-weight="600">Space · ISS</text>
    <text x="80" y="460" fill="#0A0A0A" font-weight="600">Animals · eBird</text>
    <text x="80" y="490" fill="#0A0A0A" opacity="0.5">+ 77 more</text>
  </g>

  <!-- Funnel from external → collectors -->
  <g stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1">
    <line x1="300" y1="200" x2="370" y2="320"/>
    <line x1="300" y1="280" x2="370" y2="320"/>
    <line x1="300" y1="360" x2="370" y2="320"/>
    <line x1="300" y1="440" x2="370" y2="320"/>
  </g>

  <!-- Collectors column -->
  <g>
    <rect x="376" y="146" width="232" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="392" y="174" fill="#0A0A0A" font-size="12" font-weight="600">Market Data · 91 sources</text>

    <rect x="376" y="200" width="232" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="392" y="220" fill="#0A0A0A" font-size="12" font-weight="600">CoinGecko</text>
    <text x="392" y="236" fill="#0A0A0A" font-size="10" opacity="0.45">mcap · categories</text>

    <rect x="376" y="254" width="232" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="392" y="274" fill="#0A0A0A" font-size="12" font-weight="600">DeFi Llama</text>
    <text x="392" y="290" fill="#0A0A0A" font-size="10" opacity="0.45">TVL · fees</text>

    <rect x="376" y="308" width="232" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="392" y="328" fill="#0A0A0A" font-size="12" font-weight="600">Kline · Trade · Liquidity</text>
    <text x="392" y="344" fill="#0A0A0A" font-size="10" opacity="0.45">OHLCV · fills · depth</text>

    <rect x="376" y="362" width="232" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="392" y="382" fill="#0A0A0A" font-size="12" font-weight="600">Chain Pollers</text>
    <text x="392" y="398" fill="#0A0A0A" font-size="10" opacity="0.45">L3 + Settlement</text>

    <rect x="376" y="416" width="232" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="392" y="436" fill="#0A0A0A" font-size="12" font-weight="600">FNG · Oracle Health · GitHub</text>
  </g>

  <!-- Arrows collectors → storage -->
  <g stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="612" y1="168" x2="672" y2="186" marker-end="url(#aDN)"/>
    <line x1="612" y1="222" x2="672" y2="240" marker-end="url(#aDN)"/>
    <line x1="612" y1="276" x2="672" y2="294" marker-end="url(#aDN)"/>
    <line x1="612" y1="330" x2="672" y2="348" marker-end="url(#aDN)"/>
    <line x1="612" y1="384" x2="672" y2="402" marker-end="url(#aDN)"/>
    <line x1="612" y1="438" x2="672" y2="456" marker-end="url(#aDN)"/>
  </g>

  <!-- Storage column — postgres -->
  <rect x="680" y="146" width="240" height="380" rx="12" fill="url(#darkGradDN)"/>
  <text x="700" y="174" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">POSTGRESQL</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="white">
    <text x="700" y="200">market_prices</text>
    <text x="700" y="220" opacity="0.55">market_prices_latest</text>
    <text x="700" y="244">coingecko_mcaps</text>
    <text x="700" y="264" opacity="0.55">coingecko_cats</text>
    <text x="700" y="288">dl_protocols</text>
    <text x="700" y="308" opacity="0.55">dl_metrics</text>
    <text x="700" y="332">klines · trades</text>
    <text x="700" y="352" opacity="0.55">liquidity</text>
    <text x="700" y="376">itp_snapshots</text>
    <text x="700" y="396" opacity="0.55">oracle_health</text>
    <text x="700" y="420">fng_index</text>
    <text x="700" y="440" opacity="0.55">github_metrics</text>
  </g>
  <line x1="700" y1="468" x2="900" y2="468" stroke="white" stroke-opacity="0.12"/>
  <text x="700" y="490" fill="white" font-size="10" opacity="0.5">15 tables · 25 migrations</text>
  <text x="700" y="510" fill="white" font-size="10" opacity="0.45">authoritative store</text>

  <!-- Bottom row: consumers -->
  <line x1="40" y1="552" x2="940" y2="552" stroke="#0A0A0A" stroke-opacity="0.06" stroke-dasharray="4,4"/>
  <text x="490" y="578" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.4">CONSUMERS · 50+ ENDPOINTS · AXUM</text>

  <rect x="60" y="598" width="200" height="60" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="160" y="624" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Frontend</text>
  <text x="160" y="644" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.45">/price · /itp-price · /portfolio</text>

  <rect x="280" y="598" width="200" height="60" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <rect x="280" y="598" width="3" height="60" rx="1.5" fill="#10B981"/>
  <text x="380" y="624" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Oracles</text>
  <text x="380" y="644" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.45">/market/prices · /vision/ws</text>

  <rect x="500" y="598" width="200" height="60" rx="10" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="600" y="624" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Explorer</text>
  <text x="600" y="644" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.45">/explorer/* · /batches/*</text>

  <rect x="720" y="598" width="200" height="60" rx="10" fill="url(#darkGradDN)"/>
  <text x="820" y="624" text-anchor="middle" fill="white" font-size="13" font-weight="600">WebSocket · SSE</text>
  <text x="820" y="644" text-anchor="middle" fill="white" font-size="10" opacity="0.5">real-time streams</text>
</svg>
