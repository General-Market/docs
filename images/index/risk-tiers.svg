<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
  </defs>

  <rect width="980" height="360" fill="white"/>
  <circle cx="60" cy="320" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="40" r="140" fill="#0A0A0A" opacity="0.02"/>

  <rect x="40" y="40" width="900" height="56" rx="14" fill="url(#darkGrad)"/>
  <text x="64" y="68" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">RISK TIERS</text>
  <text x="64" y="88" fill="white" font-size="15" font-weight="600">Concentration cap per market — the protocol's tolerance for being wrong</text>

  <!-- 4 rows. x scale: bar starts at 220, max width = 600 (for 30% = 600, so 1% = 20) -->
  <!-- Row layout: y per tier. Height 40. Gap 16 -->
  <!-- Tier A 30% -->
  <text x="64" y="146" fill="#0A0A0A" font-size="13" font-weight="700">Tier A</text>
  <text x="64" y="164" fill="#0A0A0A" font-size="11" opacity="0.5">blue-chip, diversified</text>
  <rect x="220" y="138" width="600" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <rect x="220" y="138" width="600" height="32" rx="8" fill="url(#darkGrad)"/>
  <text x="836" y="158" fill="#0A0A0A" font-size="13" font-weight="700">30% cap</text>

  <!-- Tier B 20% : width=400 -->
  <text x="64" y="206" fill="#0A0A0A" font-size="13" font-weight="700">Tier B</text>
  <text x="64" y="224" fill="#0A0A0A" font-size="11" opacity="0.5">medium risk</text>
  <rect x="220" y="198" width="600" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <rect x="220" y="198" width="400" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.55"/>
  <text x="836" y="218" fill="#0A0A0A" font-size="13" font-weight="700">20% cap</text>

  <!-- Tier C 10% : width=200 -->
  <text x="64" y="266" fill="#0A0A0A" font-size="13" font-weight="700">Tier C</text>
  <text x="64" y="284" fill="#0A0A0A" font-size="11" opacity="0.5">higher risk</text>
  <rect x="220" y="258" width="600" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <rect x="220" y="258" width="200" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.35"/>
  <text x="836" y="278" fill="#0A0A0A" font-size="13" font-weight="700">10% cap</text>

  <!-- Tier D 5% : width=100 -->
  <text x="64" y="326" fill="#0A0A0A" font-size="13" font-weight="700">Tier D</text>
  <text x="64" y="344" fill="#0A0A0A" font-size="11" opacity="0.5">watch list · default for new</text>
  <rect x="220" y="318" width="600" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <rect x="220" y="318" width="100" height="32" rx="8" fill="#0A0A0A" fill-opacity="0.2"/>
  <text x="836" y="338" fill="#0A0A0A" font-size="13" font-weight="700">5% cap</text>
</svg>
