<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="360" fill="white"/>
  <circle cx="60" cy="320" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="40" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="40" y="44" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">CRISIS LEVELS</text>
  <text x="40" y="68" fill="#0A0A0A" font-size="13" opacity="0.4">Four states. Each worse than the last. Emergency receives no new capital.</text>

  <!-- Layout: 4 cards, each 200w, gap 20. start x=60, total 920 -->
  <g filter="url(#shadow)">
    <rect x="60" y="104" width="200" height="200" rx="14" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3"/>
    <rect x="295" y="104" width="200" height="200" rx="14" fill="#0A0A0A" fill-opacity="0.05"/>
    <rect x="530" y="104" width="200" height="200" rx="14" fill="#0A0A0A" fill-opacity="0.1"/>
    <rect x="765" y="104" width="200" height="200" rx="14" fill="#0A0A0A" fill-opacity="0.18"/>
  </g>

  <!-- Normal -->
  <text x="160" y="138" text-anchor="middle" fill="#059669" font-size="13" font-weight="700" letter-spacing="1.6">NORMAL</text>
  <line x1="80" y1="150" x2="240" y2="150" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="160" y="178" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">utilization in range</text>
  <text x="160" y="198" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">oracles fresh</text>
  <text x="80" y="244" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.45">QUOTE API</text>
  <text x="80" y="266" fill="#0A0A0A" font-size="11" opacity="0.55">standard min HF</text>

  <!-- Elevated -->
  <text x="395" y="138" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700" letter-spacing="1.6">ELEVATED</text>
  <line x1="315" y1="150" x2="475" y2="150" stroke="#0A0A0A" stroke-opacity="0.15"/>
  <text x="395" y="178" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">HF warnings</text>
  <text x="395" y="198" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">oracle approaching stale</text>
  <text x="315" y="244" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.45">QUOTE API</text>
  <text x="315" y="266" fill="#0A0A0A" font-size="11" opacity="0.55">higher min HF</text>

  <!-- Stress -->
  <text x="630" y="138" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700" letter-spacing="1.6">STRESS</text>
  <line x1="550" y1="150" x2="710" y2="150" stroke="#0A0A0A" stroke-opacity="0.15"/>
  <text x="630" y="178" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">critical HF</text>
  <text x="630" y="198" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">oracle past max cadence</text>
  <text x="550" y="244" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.45">QUOTE API</text>
  <text x="550" y="266" fill="#0A0A0A" font-size="11" opacity="0.55">much higher min HF</text>

  <!-- Emergency -->
  <text x="865" y="138" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="700" letter-spacing="1.6">EMERGENCY</text>
  <line x1="785" y1="150" x2="945" y2="150" stroke="#0A0A0A" stroke-opacity="0.18"/>
  <text x="865" y="178" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">market is hostile</text>
  <text x="865" y="198" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.65">capital flees</text>
  <text x="785" y="244" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="1.6" opacity="0.6">QUOTE API</text>
  <text x="785" y="266" fill="#0A0A0A" font-size="11" opacity="0.7">reject quote</text>

  <!-- Arrows between cards -->
  <line x1="265" y1="200" x2="290" y2="200" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="200" x2="525" y2="200" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="735" y1="200" x2="760" y2="200" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="490" y="338" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.4">Transitions trigger alerts. Steady state is silent.</text>
</svg>
