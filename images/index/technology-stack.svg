<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="560" fill="white"/>
  <circle cx="80" cy="500" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="80" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">TECHNOLOGY STACK</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Four languages. Each chosen for what it cannot avoid being.</text>

  <!-- Column headers -->
  <rect x="40" y="92" width="900" height="40" rx="12" fill="url(#darkGrad)"/>
  <text x="160" y="117" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2">LANGUAGE</text>
  <text x="490" y="117" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2">SERVICE</text>
  <text x="820" y="117" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2">DEPLOYMENT</text>

  <!-- Row: Rust (spans 4 services) -->
  <rect x="40" y="146" width="900" height="180" rx="12" fill="#0A0A0A" fill-opacity="0.025"/>
  <rect x="40" y="146" width="3" height="180" rx="1.5" fill="#10B981"/>
  <text x="160" y="178" text-anchor="middle" fill="#0A0A0A" font-size="20" font-weight="700">Rust</text>
  <text x="160" y="198" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">must not fail</text>

  <g>
    <text x="490" y="178" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Oracle Nodes · 3×</text>
    <text x="820" y="178" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">Docker (VPS 1)</text>

    <line x1="240" y1="194" x2="740" y2="194" stroke="#0A0A0A" stroke-opacity="0.05"/>

    <text x="490" y="216" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">AP / Keeper</text>
    <text x="820" y="216" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">Binary (VPS 1)</text>

    <line x1="240" y1="232" x2="740" y2="232" stroke="#0A0A0A" stroke-opacity="0.05"/>

    <text x="490" y="254" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Data Node</text>
    <text x="820" y="254" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">Binary (VPS 1)</text>

    <line x1="240" y1="270" x2="740" y2="270" stroke="#0A0A0A" stroke-opacity="0.05"/>

    <text x="490" y="292" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Curator</text>
    <text x="820" y="292" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">Binary (VPS 1)</text>
  </g>

  <!-- Row: Python -->
  <rect x="40" y="338" width="900" height="64" rx="12" fill="#0A0A0A" fill-opacity="0.025"/>
  <text x="160" y="368" text-anchor="middle" fill="#0A0A0A" font-size="18" font-weight="700">Python</text>
  <text x="160" y="388" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">must adapt</text>

  <text x="490" y="362" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Vision Bot</text>
  <text x="490" y="384" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Social Bot</text>
  <text x="820" y="374" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">VPS 1</text>

  <!-- Row: TypeScript -->
  <rect x="40" y="414" width="900" height="40" rx="12" fill="#0A0A0A" fill-opacity="0.025"/>
  <text x="160" y="440" text-anchor="middle" fill="#0A0A0A" font-size="18" font-weight="700">TypeScript</text>
  <text x="490" y="440" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Frontend</text>
  <text x="820" y="440" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">Vercel</text>

  <!-- Row: Solidity -->
  <rect x="40" y="466" width="900" height="40" rx="12" fill="#0A0A0A" fill-opacity="0.025"/>
  <text x="160" y="492" text-anchor="middle" fill="#0A0A0A" font-size="18" font-weight="700">Solidity</text>
  <text x="490" y="492" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Contracts</text>
  <text x="820" y="492" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">L3 + Settlement</text>

  <!-- Row: PostgreSQL -->
  <rect x="40" y="518" width="900" height="36" rx="12" fill="#0A0A0A" fill-opacity="0.025"/>
  <text x="160" y="542" text-anchor="middle" fill="#0A0A0A" font-size="16" font-weight="700">PostgreSQL</text>
  <text x="490" y="542" text-anchor="middle" fill="#0A0A0A" font-size="13" font-weight="600">Price DB</text>
  <text x="820" y="542" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.6">Docker (VPS 1)</text>
</svg>
