<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradWh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowWh">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aWh" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="440" fill="white"/>
  <circle cx="50" cy="50" r="140" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="400" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">WHO CAN REBALANCE</text>

  <!-- Step 1 -->
  <rect x="240" y="76" width="500" height="80" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowWh)"/>
  <text x="270" y="108" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.45" font-family="ui-monospace, SF Mono, Menlo, monospace">requestRebalance()</text>
  <text x="270" y="134" fill="#0A0A0A" font-size="14" font-weight="700">Anyone can call</text>
  <rect x="610" y="98" width="110" height="32" rx="980" fill="#0A0A0A" fill-opacity="0.05" stroke="#0A0A0A" stroke-opacity="0.12"/>
  <text x="665" y="118" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600">permissionless</text>

  <line x1="490" y1="162" x2="490" y2="186" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aWh)"/>

  <!-- Step 2 -->
  <rect x="240" y="194" width="500" height="80" rx="14" fill="url(#darkGradWh)" filter="url(#shadowWh)"/>
  <text x="270" y="226" fill="white" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">ORACLE VERIFICATION</text>
  <text x="270" y="252" fill="white" font-size="14" font-weight="700">Oracles check the caller is the deployer</text>
  <text x="270" y="268" fill="white" font-size="11" opacity="0.55">before signing the rebalance</text>

  <line x1="490" y1="280" x2="490" y2="304" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#aWh)"/>

  <!-- Step 3 -->
  <rect x="240" y="312" width="500" height="80" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowWh)"/>
  <rect x="240" y="312" width="3" height="80" rx="1.5" fill="#10B981"/>
  <text x="270" y="344" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.45" font-family="ui-monospace, SF Mono, Menlo, monospace">rebalance()</text>
  <text x="270" y="370" fill="#0A0A0A" font-size="14" font-weight="700">Requires BLS consensus</text>
  <rect x="610" y="334" width="110" height="32" rx="980" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="665" y="354" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">oracles only</text>

  <text x="490" y="416" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">The door is open. The bouncer is not.</text>
</svg>
