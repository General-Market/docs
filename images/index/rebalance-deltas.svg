  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">ASSET TRADE DELTAS</text>
  <text x="490" y="66" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">The distance between what you had and what you wanted.</text>

  <g filter="url(#shadowDl)">
