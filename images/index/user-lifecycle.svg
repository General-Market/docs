<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowL">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
    <marker id="arrowGreenR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="white"/>

  <!-- Decorative -->
  <circle cx="40" cy="540" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <!-- Three lane headers -->
  <rect x="40" y="32" width="280" height="44" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="180" y="60" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4">YOU</text>

  <rect x="340" y="32" width="300" height="44" rx="10" fill="url(#darkGradL)" filter="url(#shadowL)"/>
  <text x="490" y="60" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2.4">GENERAL MARKET</text>

  <rect x="660" y="32" width="280" height="44" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="800" y="60" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4">REAL WORLD</text>

  <!-- Lane separators (dashed) -->
  <line x1="180" y1="80" x2="180" y2="560" stroke="#0A0A0A" stroke-opacity="0.06" stroke-dasharray="4,4"/>
  <line x1="490" y1="80" x2="490" y2="560" stroke="#0A0A0A" stroke-opacity="0.06" stroke-dasharray="4,4"/>
  <line x1="800" y1="80" x2="800" y2="560" stroke="#0A0A0A" stroke-opacity="0.06" stroke-dasharray="4,4"/>

  <!-- ============ ROW 1: Buy ITP ============ -->
  <text x="40" y="112" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">BUY ITP</text>

  <!-- Action 1: user → GM -->
  <rect x="56" y="124" width="248" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="180" y="148" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="500">"Buy the Top-100 ITP"</text>
  <line x1="304" y1="144" x2="356" y2="144" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#arrowR)"/>

  <rect x="360" y="124" width="260" height="40" rx="8" fill="url(#darkGradL)"/>
  <text x="490" y="148" text-anchor="middle" fill="white" font-size="11" opacity="0.85">Oracle consensus — 1s cycle</text>

  <line x1="624" y1="144" x2="676" y2="144" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <rect x="680" y="124" width="248" height="40" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="804" y="148" text-anchor="middle" fill="#0A0A0A" font-size="12">Execute on Bitget</text>

  <!-- Return arrow user ← GM -->
  <line x1="356" y1="184" x2="304" y2="184" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="180" y="188" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">ITP shares in wallet</text>
  <line x1="676" y1="184" x2="624" y2="184" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="804" y="188" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.55">fill confirmed</text>

  <!-- Row divider -->
  <line x1="40" y1="220" x2="940" y2="220" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- ============ ROW 2: Vision Bet ============ -->
  <text x="40" y="248" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">VISION BET</text>

  <rect x="56" y="260" width="248" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="180" y="284" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="500">"Bet: RATP Line 13 late"</text>
  <line x1="304" y1="280" x2="356" y2="280" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#arrowR)"/>

  <rect x="360" y="260" width="260" height="40" rx="8" fill="url(#darkGradL)"/>
  <text x="490" y="284" text-anchor="middle" fill="white" font-size="11" opacity="0.85">Sealed bet — nobody sees it</text>

  <!-- Resolution input from real world -->
  <line x1="676" y1="320" x2="624" y2="320" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <rect x="680" y="300" width="248" height="40" rx="8" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="804" y="324" text-anchor="middle" fill="#0A0A0A" font-size="12">Actual delay data</text>

  <rect x="360" y="316" width="260" height="40" rx="8" fill="url(#darkGradL)"/>
  <text x="490" y="340" text-anchor="middle" fill="white" font-size="11" opacity="0.85">BLS-verified resolution</text>

  <!-- Payout -->
  <line x1="356" y1="376" x2="304" y2="376" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="180" y="380" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">Payout if right</text>

  <line x1="40" y1="408" x2="940" y2="408" stroke="#0A0A0A" stroke-opacity="0.06"/>

  <!-- ============ ROW 3: Supply USDC ============ -->
  <text x="40" y="436" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">LEND</text>

  <rect x="56" y="448" width="248" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="180" y="472" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="500">"Supply USDC to lending"</text>
  <line x1="304" y1="468" x2="356" y2="468" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.2" marker-end="url(#arrowR)"/>

  <rect x="360" y="448" width="260" height="40" rx="8" fill="url(#darkGradL)"/>
  <text x="490" y="472" text-anchor="middle" fill="white" font-size="11" opacity="0.85">Morpho vault accepts deposit</text>

  <line x1="356" y1="508" x2="304" y2="508" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="180" y="512" text-anchor="middle" fill="#10B981" font-size="11" font-weight="600">Yield from borrowers</text>

  <!-- Footer -->
  <text x="490" y="570" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.35">Three paths in, three paths out. The middle is the protocol.</text>
</svg>
