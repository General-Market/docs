<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="460" fill="white"/>

  <!-- Decorative corner blobs -->
  <circle cx="60" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="920" cy="420" r="180" fill="#0A0A0A" opacity="0.02"/>

  <!-- Title -->
  <text x="490" y="48" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">THE THREE PILLARS</text>

  <!-- Pillar 1 — Index -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="84" width="290" height="336" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.06"/>
  </g>
  <rect x="40" y="84" width="3" height="80" rx="1.5" fill="#10B981"/>
  <text x="64" y="124" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">PILLAR 01</text>
  <text x="64" y="156" fill="#0A0A0A" font-size="22" font-weight="700">Index</text>
  <text x="64" y="180" fill="#0A0A0A" font-size="12" opacity="0.55">On-chain ETFs (DTFs).</text>

  <!-- Mock basket inside pillar 1 -->
  <rect x="64" y="208" width="242" height="148" rx="10" fill="url(#darkGrad)"/>
  <text x="80" y="232" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.45">BASKET</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="white">
    <text x="80" y="256">BTC</text><text x="290" y="256" text-anchor="end" opacity="0.7">12.5%</text>
    <text x="80" y="276">ETH</text><text x="290" y="276" text-anchor="end" opacity="0.7">10.0%</text>
    <text x="80" y="296">SOL</text><text x="290" y="296" text-anchor="end" opacity="0.7">8.0%</text>
    <text x="80" y="316" opacity="0.5">...</text><text x="290" y="316" text-anchor="end" opacity="0.45">69.5%</text>
  </g>
  <line x1="76" y1="328" x2="294" y2="328" stroke="white" stroke-opacity="0.1"/>
  <text x="80" y="346" fill="white" font-size="11" font-weight="700">NAV $1.34</text>

  <text x="64" y="384" fill="#0A0A0A" font-size="11" opacity="0.55">Up to 100 assets. Real exchange execution.</text>
  <text x="64" y="402" fill="#0A0A0A" font-size="11" opacity="0.55">BLS-verified fills. No AMM. No pretending.</text>

  <!-- Pillar 2 — Vision -->
  <g filter="url(#cardShadow)">
    <rect x="345" y="84" width="290" height="336" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.06"/>
  </g>
  <rect x="345" y="84" width="3" height="80" rx="1.5" fill="#10B981"/>
  <text x="369" y="124" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">PILLAR 02</text>
  <text x="369" y="156" fill="#0A0A0A" font-size="22" font-weight="700">Vision</text>
  <text x="369" y="180" fill="#0A0A0A" font-size="12" opacity="0.55">Prediction markets. 90+ data sources.</text>

  <!-- Mock prompt card -->
  <rect x="369" y="208" width="242" height="148" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="385" y="232" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">QUESTION</text>
  <text x="385" y="266" fill="#0A0A0A" font-size="15" font-weight="600">Will the Paris Metro</text>
  <text x="385" y="286" fill="#0A0A0A" font-size="15" font-weight="600">be late today?</text>
  <line x1="381" y1="306" x2="599" y2="306" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <circle cx="391" cy="328" r="4" fill="#10B981"/>
  <text x="403" y="332" fill="#0A0A0A" font-size="11" opacity="0.55">It usually is.</text>

  <text x="369" y="384" fill="#0A0A0A" font-size="11" opacity="0.55">Sealed bets. Parimutuel payouts.</text>
  <text x="369" y="402" fill="#0A0A0A" font-size="11" opacity="0.55">Resolution by data, not by jury.</text>

  <!-- Pillar 3 — Lending -->
  <g filter="url(#cardShadow)">
    <rect x="650" y="84" width="290" height="336" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.06"/>
  </g>
  <rect x="650" y="84" width="3" height="80" rx="1.5" fill="#10B981"/>
  <text x="674" y="124" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">PILLAR 03</text>
  <text x="674" y="156" fill="#0A0A0A" font-size="22" font-weight="700">Lending</text>
  <text x="674" y="180" fill="#0A0A0A" font-size="12" opacity="0.55">Morpho-powered. ITP shares as collateral.</text>

  <rect x="674" y="208" width="242" height="148" rx="10" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="690" y="232" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2" opacity="0.4">TWO SIDES</text>

  <rect x="690" y="248" width="210" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="704" y="266" fill="#0A0A0A" font-size="11" font-weight="600">Supply USDC</text>
  <text x="704" y="282" fill="#0A0A0A" font-size="10" opacity="0.45">earn yield from borrowers</text>

  <rect x="690" y="300" width="210" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.06"/>
  <text x="704" y="318" fill="#0A0A0A" font-size="11" font-weight="600">Borrow USDC</text>
  <text x="704" y="334" fill="#0A0A0A" font-size="10" opacity="0.45">against ITP collateral</text>

  <text x="674" y="384" fill="#0A0A0A" font-size="11" opacity="0.55">Settlement side. NAV oracle as price.</text>
  <text x="674" y="402" fill="#0A0A0A" font-size="11" opacity="0.55">Hold the basket. Spend the bid.</text>
</svg>
