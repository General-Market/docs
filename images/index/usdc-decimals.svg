<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradUd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowUd">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aUd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="460" fill="white"/>
  <circle cx="50" cy="50" r="140" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="420" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="44" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">100 USDC IN RAW UNITS</text>

  <!-- Settlement card -->
  <g filter="url(#shadowUd)">
    <rect x="60" y="80" width="400" height="200" rx="14" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  </g>
  <text x="84" y="108" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">SETTLEMENT · 6 DECIMALS</text>
  <text x="84" y="160" fill="#0A0A0A" font-size="22" font-weight="700" font-family="ui-monospace, SF Mono, Menlo, monospace">100_000_000</text>
  <text x="84" y="186" fill="#0A0A0A" font-size="12" opacity="0.55" font-family="ui-monospace, SF Mono, Menlo, monospace">100 × 10^6</text>
  <line x1="84" y1="208" x2="436" y2="208" stroke="#0A0A0A" stroke-opacity="0.08"/>
  <text x="84" y="240" fill="#0A0A0A" font-size="11" opacity="0.6">standard ERC-20 USDC</text>
  <text x="84" y="258" fill="#0A0A0A" font-size="11" opacity="0.6">same as Ethereum, Arbitrum, Sonic</text>

  <!-- L3 card -->
  <g filter="url(#shadowUd)">
    <rect x="520" y="80" width="400" height="200" rx="14" fill="url(#darkGradUd)"/>
  </g>
  <text x="544" y="108" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">INDEX L3 · 18 DECIMALS</text>
  <text x="544" y="160" fill="white" font-size="22" font-weight="700" font-family="ui-monospace, SF Mono, Menlo, monospace">100_000_000_000_000_000_000</text>
  <text x="544" y="186" fill="white" font-size="12" opacity="0.6" font-family="ui-monospace, SF Mono, Menlo, monospace">100 × 10^18</text>
  <line x1="544" y1="208" x2="896" y2="208" stroke="white" stroke-opacity="0.12"/>
  <text x="544" y="240" fill="white" font-size="11" opacity="0.6">like ETH · matches L3 native precision</text>
  <text x="544" y="258" fill="white" font-size="11" opacity="0.6">Vision · TVL · NAV all in 1e18</text>

  <!-- Ratio band -->
  <rect x="60" y="312" width="860" height="64" rx="12" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="84" y="340" fill="#059669" font-size="11" font-weight="700" letter-spacing="2.4">RATIO</text>
  <text x="84" y="362" fill="#0A0A0A" font-size="14">1e12 between the two. Not a rounding error.</text>

  <!-- Bridge conversion -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">
    <text x="60" y="412" fill="#0A0A0A" opacity="0.55">Settlement → L3</text>
    <text x="240" y="412" fill="#0A0A0A" font-weight="700">toInternal()</text>
    <text x="380" y="412" fill="#0A0A0A" opacity="0.55">multiplies by 1e12</text>

    <text x="520" y="412" fill="#0A0A0A" opacity="0.55">L3 → Settlement</text>
    <text x="700" y="412" fill="#0A0A0A" font-weight="700">toUsdc()</text>
    <text x="820" y="412" fill="#0A0A0A" opacity="0.55">divides by 1e12</text>
  </g>

  <text x="490" y="442" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">Handled by DecimalLib. You never see it. It never fails. These are two separate reassurances.</text>
</svg>
