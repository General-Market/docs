<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" width="980" height="880" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect width="980" height="880" fill="white"/>
  <circle cx="80" cy="820" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="80" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">DATA FLOW</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">The world generates data. The protocol consumes it. What remains is a price.</text>

  <!-- Column headers -->
  <text x="160" y="98" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">EXTERNAL SOURCES</text>
  <text x="490" y="98" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">DATA NODE</text>
  <text x="820" y="98" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">CONSUMERS</text>

  <!-- Source chips (left column) -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace">
    <rect x="40" y="120" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="145" fill="#0A0A0A" font-size="12" font-weight="600">CoinGecko</text>
    <text x="264" y="145" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.4" font-family="Inter, sans-serif">crypto prices</text>

    <rect x="40" y="168" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="193" fill="#0A0A0A" font-size="12" font-weight="600">Binance</text>
    <text x="264" y="193" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.4" font-family="Inter, sans-serif">WebSocket</text>

    <rect x="40" y="216" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="241" fill="#0A0A0A" font-size="12" font-weight="600">Exchange APIs</text>
    <text x="264" y="241" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.4" font-family="Inter, sans-serif">REST</text>

    <rect x="40" y="264" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="289" fill="#0A0A0A" font-size="12" font-weight="600">1inch DEX</text>

    <rect x="40" y="312" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="337" fill="#0A0A0A" font-size="12" font-weight="600">GitHub</text>
    <text x="264" y="337" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.4" font-family="Inter, sans-serif">stars, commits</text>

    <rect x="40" y="360" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="385" fill="#0A0A0A" font-size="12" font-weight="600">Transport</text>
    <text x="264" y="385" text-anchor="end" fill="#0A0A0A" font-size="10" opacity="0.4" font-family="Inter, sans-serif">RATP, TfL, MTA, DB</text>

    <rect x="40" y="408" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="56" y="433" fill="#0A0A0A" font-size="12" font-weight="600">Weather · Energy · Outages</text>

    <rect x="40" y="456" width="240" height="40" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.04" stroke-dasharray="4,4"/>
    <text x="160" y="481" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.4" font-family="Inter, sans-serif">+ 83 others</text>
  </g>

  <!-- Funnel into Data Node -->
  <g stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1">
    <line x1="280" y1="140" x2="360" y2="280"/>
    <line x1="280" y1="188" x2="360" y2="280"/>
    <line x1="280" y1="236" x2="360" y2="280"/>
    <line x1="280" y1="284" x2="360" y2="280"/>
    <line x1="280" y1="332" x2="360" y2="280"/>
    <line x1="280" y1="380" x2="360" y2="280"/>
    <line x1="280" y1="428" x2="360" y2="280"/>
    <line x1="280" y1="476" x2="360" y2="280"/>
  </g>

  <!-- Data Node panel -->
  <g filter="url(#shadow)">
    <rect x="360" y="120" width="280" height="500" rx="14" fill="url(#darkGrad)"/>
  </g>
  <text x="380" y="150" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.55">RUST · PORT 8200</text>
  <text x="380" y="178" fill="white" font-size="18" font-weight="700">Data Node</text>

  <!-- Stage pills -->
  <rect x="380" y="200" width="240" height="62" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
  <text x="500" y="222" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">INGESTION</text>
  <text x="500" y="240" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Scheduled fetchers per asset</text>
  <text x="500" y="254" text-anchor="middle" fill="white" font-size="10" opacity="0.5">90+ sources, one process</text>

  <line x1="500" y1="262" x2="500" y2="280" stroke="white" stroke-opacity="0.5" stroke-width="1" marker-end="url(#arrowDown)"/>

  <rect x="380" y="284" width="240" height="62" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
  <text x="500" y="306" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">VALIDATION</text>
  <text x="500" y="324" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Outlier detect</text>
  <text x="500" y="338" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Staleness guard</text>

  <line x1="500" y1="346" x2="500" y2="364" stroke="white" stroke-opacity="0.5" stroke-width="1" marker-end="url(#arrowDown)"/>

  <rect x="380" y="368" width="240" height="62" rx="10" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
  <text x="500" y="390" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">POSTGRESQL</text>
  <text x="500" y="408" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Price history</text>
  <text x="500" y="422" text-anchor="middle" fill="white" font-size="10" opacity="0.5">Snapshots</text>

  <line x1="500" y1="430" x2="500" y2="448" stroke="white" stroke-opacity="0.5" stroke-width="1" marker-end="url(#arrowDown)"/>

  <rect x="380" y="452" width="240" height="62" rx="10" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="500" y="474" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700" letter-spacing="1.6">NAV ENGINE</text>
  <text x="500" y="492" text-anchor="middle" fill="white" font-size="10" opacity="0.7">qty × price / 1e18</text>
  <text x="500" y="506" text-anchor="middle" fill="white" font-size="10" opacity="0.5">authoritative pricing</text>

  <!-- output pills -->
  <rect x="380" y="540" width="115" height="48" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
  <text x="437" y="562" text-anchor="middle" fill="white" font-size="11" font-weight="700">REST API</text>
  <text x="437" y="578" text-anchor="middle" fill="white" font-size="10" opacity="0.5">:8200</text>

  <rect x="505" y="540" width="115" height="48" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.1"/>
  <text x="562" y="562" text-anchor="middle" fill="white" font-size="11" font-weight="700">SSE STREAMS</text>
  <text x="562" y="578" text-anchor="middle" fill="white" font-size="10" opacity="0.5">live updates</text>

  <!-- Consumers (right column) -->
  <g>
    <rect x="700" y="138" width="240" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="720" y="162" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">ORACLE NODES</text>
    <text x="720" y="186" fill="#0A0A0A" font-size="13" font-weight="600">Price consensus</text>
    <text x="720" y="206" fill="#0A0A0A" font-size="11" opacity="0.55">NAV inputs</text>
    <text x="720" y="224" fill="#0A0A0A" font-size="11" opacity="0.55">3× Rust · BLS aggregate</text>

    <rect x="700" y="258" width="240" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="720" y="282" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">FRONTEND</text>
    <text x="720" y="306" fill="#0A0A0A" font-size="13" font-weight="600">Next.js</text>
    <text x="720" y="326" fill="#0A0A0A" font-size="11" opacity="0.55">Dashboard · Portfolio</text>
    <text x="720" y="344" fill="#0A0A0A" font-size="11" opacity="0.55">Backtesting UI</text>

    <rect x="700" y="378" width="240" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="720" y="402" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">VISION BOT</text>
    <text x="720" y="426" fill="#0A0A0A" font-size="13" font-weight="600">Python</text>
    <text x="720" y="446" fill="#0A0A0A" font-size="11" opacity="0.55">Strategy signals</text>
    <text x="720" y="464" fill="#0A0A0A" font-size="11" opacity="0.55">Automated bets</text>

    <rect x="700" y="498" width="240" height="122" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.1"/>
    <text x="720" y="522" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2" opacity="0.5">SOCIAL BOT</text>
    <text x="720" y="546" fill="#0A0A0A" font-size="13" font-weight="600">Python</text>
    <text x="720" y="566" fill="#0A0A0A" font-size="11" opacity="0.55">Anomaly detection · 98 sources</text>
    <text x="720" y="588" fill="#0A0A0A" font-size="11" opacity="0.55">Posts to Twitter/X</text>
    <text x="720" y="608" fill="#10B981" font-size="11" font-weight="600">The world breaking, in feed form.</text>
  </g>

  <!-- Output arrows: Data Node → consumers -->
  <g stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1" fill="none">
    <path d="M 640 564 Q 670 188, 700 188"/>
    <path d="M 640 564 Q 670 308, 700 308"/>
    <path d="M 640 564 Q 670 428, 700 428"/>
    <path d="M 640 564 Q 670 548, 700 548"/>
  </g>

  <!-- Footer note -->
  <rect x="40" y="660" width="900" height="48" rx="14" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="688" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">One database. Two purposes: prices for the oracles, anomalies for the bot.</text>
</svg>
