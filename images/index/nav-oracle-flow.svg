<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arrDn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect width="980" height="760" fill="white"/>
  <circle cx="80" cy="700" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="40" y="44" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">NAV ORACLE FLOW</text>
  <text x="40" y="68" fill="#0A0A0A" font-size="13" opacity="0.4">Three signers. One aggregate. One push. One contract reads.</text>

  <!-- Row of 3 oracles -->
  <g>
    <rect x="60" y="96" width="260" height="120" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
    <text x="84" y="124" fill="#0A0A0A" font-size="13" font-weight="700">Oracle 1</text>
    <text x="84" y="148" fill="#0A0A0A" font-size="11" opacity="0.55">Compute NAV</text>
    <text x="84" y="168" fill="#0A0A0A" font-size="11" opacity="0.55">BLS-sign (price, cycle, time)</text>
    <rect x="220" y="138" width="86" height="28" rx="14" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.35"/>
    <text x="263" y="156" text-anchor="middle" fill="#059669" font-size="10" font-weight="700" letter-spacing="1.2">SIGNED</text>

    <rect x="360" y="96" width="260" height="120" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
    <text x="384" y="124" fill="#0A0A0A" font-size="13" font-weight="700">Oracle 2</text>
    <text x="384" y="148" fill="#0A0A0A" font-size="11" opacity="0.55">Compute NAV</text>
    <text x="384" y="168" fill="#0A0A0A" font-size="11" opacity="0.55">BLS-sign (price, cycle, time)</text>
    <rect x="520" y="138" width="86" height="28" rx="14" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.35"/>
    <text x="563" y="156" text-anchor="middle" fill="#059669" font-size="10" font-weight="700" letter-spacing="1.2">SIGNED</text>

    <rect x="660" y="96" width="260" height="120" rx="12" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
    <text x="684" y="124" fill="#0A0A0A" font-size="13" font-weight="700">Oracle 3</text>
    <text x="684" y="148" fill="#0A0A0A" font-size="11" opacity="0.55">Compute NAV</text>
    <text x="684" y="168" fill="#0A0A0A" font-size="11" opacity="0.55">BLS-sign (price, cycle, time)</text>
    <rect x="820" y="138" width="86" height="28" rx="14" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.35"/>
    <text x="863" y="156" text-anchor="middle" fill="#059669" font-size="10" font-weight="700" letter-spacing="1.2">SIGNED</text>
  </g>

  <!-- GET label -->
  <text x="490" y="248" text-anchor="middle" fill="#0A0A0A" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.4">GET /api/nav-sign?itp=0x…</text>

  <!-- Funnel lines -->
  <g stroke="#0A0A0A" stroke-opacity="0.18" stroke-width="1">
    <line x1="190" y1="220" x2="490" y2="260"/>
    <line x1="490" y1="220" x2="490" y2="260"/>
    <line x1="790" y1="220" x2="490" y2="260"/>
  </g>
  <line x1="490" y1="262" x2="490" y2="280" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- NavCollector dark panel -->
  <rect x="60" y="288" width="860" height="148" rx="16" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="84" y="320" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">LAYER 01</text>
  <text x="84" y="346" fill="white" font-size="18" font-weight="700">NavCollector</text>
  <text x="84" y="372" fill="white" font-size="11" opacity="0.55">1. HTTP GET each oracle in parallel</text>
  <text x="84" y="390" fill="white" font-size="11" opacity="0.55">2. Parse NavSignResponse (price, sig, id)</text>
  <text x="84" y="408" fill="white" font-size="11" opacity="0.55">3. Validate consensus — all prices, all cycles, ceil(2n/3) responses</text>
  <text x="84" y="426" fill="white" font-size="11" opacity="0.55">4. Aggregate signatures · build signer bitmask</text>

  <text x="900" y="350" text-anchor="end" fill="white" font-size="10" font-weight="700" letter-spacing="2.4" opacity="0.45">DISAGREEMENT</text>
  <text x="900" y="368" text-anchor="end" fill="white" font-size="10" opacity="0.5">= rejection</text>

  <line x1="490" y1="438" x2="490" y2="468" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>
  <text x="490" y="458" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.45">aggregated sig + price + cycle + bitmask</text>

  <!-- OraclePusher -->
  <rect x="60" y="476" width="860" height="128" rx="16" fill="#0A0A0A" fill-opacity="0.04" filter="url(#shadow)"/>
  <text x="84" y="508" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">LAYER 02</text>
  <text x="84" y="534" fill="#0A0A0A" font-size="18" font-weight="700">OraclePusher</text>
  <text x="84" y="560" fill="#0A0A0A" font-size="11" opacity="0.5">Read lastCycleNumber · skip if not newer · pushPrice() · await confirmation</text>
  <text x="84" y="580" fill="#0A0A0A" font-size="11" opacity="0.5">Stale pushes are silently dropped, not retried — freshness or nothing.</text>

  <line x1="490" y1="606" x2="490" y2="630" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Final contract -->
  <rect x="60" y="638" width="860" height="98" rx="16" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="84" y="670" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">SETTLEMENT</text>
  <text x="84" y="696" fill="white" font-size="18" font-weight="700">ITPNAVOracle.sol</text>
  <text x="84" y="720" fill="white" font-size="11" opacity="0.55">Verifies BLS on-chain · stores price + timestamp · Morpho reads via oracle interface</text>
</svg>
