<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.04"/>
    </filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A0A0A" fill-opacity="0.5"/>
    </marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#0A0A0A" fill-opacity="0.5"/>
    </marker>
  </defs>

  <rect width="980" height="540" fill="white"/>
  <circle cx="80" cy="480" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="80" r="140" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">BRIDGE ORDER FLOW</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Same pipeline. Different geography. The order crosses chains.</text>

  <!-- Swimlanes -->
  <rect x="60" y="92" width="260" height="40" rx="10" fill="url(#darkGrad)"/>
  <text x="190" y="117" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">USER · ARBITRUM</text>

  <rect x="360" y="92" width="260" height="40" rx="10" fill="url(#darkGrad)"/>
  <text x="490" y="117" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">SETTLEMENT</text>

  <rect x="660" y="92" width="260" height="40" rx="10" fill="url(#darkGrad)"/>
  <text x="790" y="117" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">L3</text>

  <!-- Swimlane guides -->
  <g stroke="#0A0A0A" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4,4">
    <line x1="190" y1="138" x2="190" y2="490"/>
    <line x1="490" y1="138" x2="490" y2="490"/>
    <line x1="790" y1="138" x2="790" y2="490"/>
  </g>

  <!-- Step 1: submitOrder -->
  <line x1="190" y1="170" x2="490" y2="170" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <text x="340" y="162" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace">submitOrder(buy)</text>

  <!-- BridgeProxy chip -->
  <rect x="406" y="190" width="168" height="36" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="490" y="213" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">BridgeProxy relays</text>

  <!-- Step 2: cross-chain message -->
  <line x1="490" y1="252" x2="790" y2="252" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowR)"/>
  <text x="640" y="244" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.7">cross-chain message</text>

  <!-- L3 absorbs into normal lifecycle -->
  <rect x="660" y="270" width="260" height="80" rx="12" fill="url(#darkGrad)"/>
  <text x="790" y="298" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1.6">SAME LIFECYCLE</text>
  <text x="790" y="318" text-anchor="middle" fill="white" font-size="11" opacity="0.55">BLS consensus · AP execution</text>
  <text x="790" y="335" text-anchor="middle" fill="white" font-size="11" opacity="0.55">shares minted on L3</text>

  <!-- Step 3: bridge shares back to Settlement -->
  <line x1="790" y1="384" x2="490" y2="384" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="1.2" marker-end="url(#arrowL)"/>
  <text x="640" y="376" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.7">bridge shares back</text>

  <!-- Step 4: BridgedITP to user -->
  <line x1="490" y1="430" x2="190" y2="430" stroke="#10B981" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#arrowL)"/>
  <text x="340" y="422" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700">BridgedITP shares</text>
  <text x="340" y="446" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.5">ERC-20 on Arbitrum</text>

  <!-- Footer -->
  <rect x="60" y="490" width="860" height="36" rx="12" fill="#0A0A0A" fill-opacity="0.03"/>
  <text x="490" y="514" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.5">Bridged ERC-20. Composable as Morpho collateral via ITPNAVOracle.</text>
</svg>
