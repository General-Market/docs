<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradCx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowCx">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
    <marker id="aCx" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.45"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="white"/>
  <circle cx="50" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="660" r="180" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="40" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">CONTRACT TOPOLOGY</text>
  <text x="490" y="62" text-anchor="middle" fill="#0A0A0A" font-size="11" opacity="0.45">Twenty-nine contracts. Two chains. The bridge is the seam.</text>

  <!-- ============ L3 PANEL ============ -->
  <g filter="url(#shadowCx)">
    <rect x="40" y="84" width="900" height="356" rx="16" fill="url(#darkGradCx)"/>
  </g>
  <text x="64" y="116" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">CHAIN 111222333</text>
  <text x="64" y="140" fill="white" font-size="20" font-weight="700">Index L3 · Orbit</text>

  <!-- Core protocol group -->
  <text x="64" y="172" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.45">CORE PROTOCOL</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">
    <rect x="64" y="184" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="154" y="211" text-anchor="middle" fill="white" font-weight="600">Index</text>

    <rect x="256" y="184" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="346" y="211" text-anchor="middle" fill="white" font-weight="600">Governance</text>

    <rect x="448" y="184" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="538" y="211" text-anchor="middle" fill="white" font-weight="600">OracleRegistry</text>

    <rect x="640" y="184" width="220" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="750" y="211" text-anchor="middle" fill="white" font-weight="600">CollateralRegistry</text>
  </g>

  <!-- Bridge group -->
  <text x="64" y="256" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.45">BRIDGE · CUSTODY</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">
    <rect x="64" y="268" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="154" y="295" text-anchor="middle" fill="white" font-weight="600">L3BridgeProxy</text>

    <rect x="256" y="268" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="346" y="295" text-anchor="middle" fill="white" font-weight="600">L3BridgeCustody</text>

    <rect x="448" y="268" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="538" y="295" text-anchor="middle" fill="white" font-weight="600">BLSCustody</text>

    <rect x="640" y="268" width="220" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="750" y="295" text-anchor="middle" fill="white" font-weight="600">L3BridgedItpFactory</text>
  </g>

  <!-- Markets group -->
  <text x="64" y="340" fill="white" font-size="10" font-weight="700" letter-spacing="2" opacity="0.45">MARKETS · ASSETS</text>
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">
    <rect x="64" y="352" width="180" height="44" rx="8" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="154" y="379" text-anchor="middle" fill="white" font-weight="700">Vision</text>

    <rect x="256" y="352" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="346" y="379" text-anchor="middle" fill="white" font-weight="600">DTF Vaults · n×</text>

    <rect x="448" y="352" width="180" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="538" y="379" text-anchor="middle" fill="white" font-weight="600">L3 WUSDC · 18d</text>

    <rect x="640" y="352" width="220" height="44" rx="8" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.12"/>
    <text x="750" y="379" text-anchor="middle" fill="white" font-weight="600">Morpho · NAV Oracle</text>
  </g>

  <!-- Bridge gap -->
  <line x1="200" y1="460" x2="780" y2="460" stroke="#0A0A0A" stroke-opacity="0.15" stroke-dasharray="6,4"/>
  <rect x="430" y="448" width="120" height="28" rx="980" fill="#10B981"/>
  <text x="490" y="466" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="2">BRIDGE</text>

  <!-- Arrows up & down through the bridge -->
  <line x1="350" y1="448" x2="350" y2="436" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="350" y1="476" x2="350" y2="488" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="630" y1="448" x2="630" y2="436" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="630" y1="476" x2="630" y2="488" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2"/>

  <!-- ============ SETTLEMENT PANEL ============ -->
  <g filter="url(#shadowCx)">
    <rect x="40" y="496" width="900" height="200" rx="16" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
  </g>
  <rect x="40" y="496" width="3" height="60" rx="1.5" fill="#10B981"/>
  <text x="64" y="528" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.45">CHAIN 14601</text>
  <text x="64" y="552" fill="#0A0A0A" font-size="20" font-weight="700">Settlement · Sonic</text>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11">
    <rect x="64" y="584" width="200" height="44" rx="8" fill="#0A0A0A" fill-opacity="0.03" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="164" y="611" text-anchor="middle" fill="#0A0A0A" font-weight="600">SettlementBridgeProxy</text>

    <rect x="276" y="584" width="220" height="44" rx="8" fill="#0A0A0A" fill-opacity="0.03" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="386" y="611" text-anchor="middle" fill="#0A0A0A" font-weight="600">SettlementBridgeCustody</text>

    <rect x="508" y="584" width="220" height="44" rx="8" fill="#0A0A0A" fill-opacity="0.03" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="618" y="611" text-anchor="middle" fill="#0A0A0A" font-weight="600">SettlementBridgedItpFactory</text>

    <rect x="740" y="584" width="180" height="44" rx="8" fill="#0A0A0A" fill-opacity="0.03" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <text x="830" y="611" text-anchor="middle" fill="#0A0A0A" font-weight="600">SettlementOracleReg.</text>

    <rect x="64" y="640" width="200" height="44" rx="8" fill="white" stroke="#0A0A0A" stroke-opacity="0.08"/>
    <rect x="64" y="640" width="3" height="44" rx="1.5" fill="#10B981"/>
    <text x="164" y="667" text-anchor="middle" fill="#0A0A0A" font-weight="600">Settlement USDC · 6d</text>
  </g>

  <text x="490" y="702" text-anchor="middle" fill="#0A0A0A" font-size="10" opacity="0.4">Addresses change between deployments. The shape does not.</text>
</svg>
