<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.03"/>
    </filter>
    <marker id="arrDn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,0 L5,9 z" fill="#0A0A0A" fill-opacity="0.4"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="white"/>
  <circle cx="80" cy="660" r="180" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="900" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>

  <text x="490" y="42" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700" letter-spacing="3.6" opacity="0.45">DTF ORDER LIFECYCLE</text>
  <text x="490" y="68" text-anchor="middle" fill="#0A0A0A" font-size="13" opacity="0.4">Submit. Batch. Sign. Confirm. Fill. Mint.</text>

  <!-- Step 1 -->
  <rect x="260" y="96" width="460" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <circle cx="288" cy="126" r="3.5" fill="#10B981"/>
  <text x="306" y="122" fill="#0A0A0A" font-size="13" font-weight="600">User submits order</text>
  <text x="306" y="140" fill="#0A0A0A" font-size="11" opacity="0.5">L3 directly, or via BridgeProxy from L1/L2</text>
  <line x1="490" y1="158" x2="490" y2="180" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 2 -->
  <rect x="260" y="188" width="460" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="306" y="214" fill="#0A0A0A" font-size="13" font-weight="600">Index.sol stores pending order</text>
  <text x="306" y="232" fill="#0A0A0A" font-size="11" opacity="0.5">on-chain queue, no execution yet</text>
  <line x1="490" y1="250" x2="490" y2="272" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 3 — dark batching -->
  <rect x="180" y="280" width="620" height="76" rx="14" fill="url(#darkGrad)" filter="url(#shadow)"/>
  <text x="208" y="310" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">OFF-CHAIN</text>
  <text x="208" y="334" fill="white" font-size="14" font-weight="600">Oracle nodes batch pending orders</text>
  <text x="208" y="352" fill="white" font-size="11" opacity="0.5">2/3+ BLS partial signatures, leader aggregates</text>
  <line x1="490" y1="358" x2="490" y2="380" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 4 -->
  <rect x="260" y="388" width="460" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="306" y="414" fill="#0A0A0A" font-size="13" font-weight="600">confirmBatch() with aggregated signature</text>
  <text x="306" y="432" fill="#0A0A0A" font-size="11" opacity="0.5">BLSLib verifies against stored aggregated pubkey</text>
  <line x1="490" y1="450" x2="490" y2="472" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 5 -->
  <rect x="260" y="480" width="460" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="306" y="506" fill="#0A0A0A" font-size="13" font-weight="600">Batch confirmed · TradeRequest emitted</text>
  <text x="306" y="524" fill="#0A0A0A" font-size="11" opacity="0.5">events become the only channel to the AP</text>
  <line x1="490" y1="542" x2="490" y2="564" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 6 -->
  <rect x="260" y="572" width="460" height="60" rx="12" fill="#0A0A0A" fill-opacity="0.03" filter="url(#shadow)"/>
  <text x="306" y="598" fill="#0A0A0A" font-size="13" font-weight="600">AP executes fills · confirmFills()</text>
  <text x="306" y="616" fill="#0A0A0A" font-size="11" opacity="0.5">BLS-signed again — execution proof, not trust</text>
  <line x1="490" y1="634" x2="490" y2="656" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrDn)"/>

  <!-- Step 7 — terminal emerald -->
  <rect x="260" y="664" width="460" height="40" rx="12" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="490" y="690" text-anchor="middle" fill="#059669" font-size="12" font-weight="700" letter-spacing="1.2">ITP SHARES MINTED · COLLATERAL SETTLED</text>
</svg>
