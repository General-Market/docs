<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="darkGradTc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#1F1F1F"/>
    </linearGradient>
    <filter id="shadowTc">
      <feDropShadow dx="0" dy="2" stdDeviation="10" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="980" height="620" fill="white"/>
  <circle cx="50" cy="60" r="160" fill="#0A0A0A" opacity="0.02"/>
  <circle cx="940" cy="560" r="180" fill="#0A0A0A" opacity="0.02"/>

  <!-- Chain headers -->
  <g filter="url(#shadowTc)">
    <rect x="40" y="40" width="440" height="64" rx="14" fill="url(#darkGradTc)"/>
  </g>
  <text x="64" y="68" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">INDEX L3 · ORBIT</text>
  <text x="64" y="90" fill="white" font-size="12" opacity="0.6">Chain 111222333 · GM · USDC 18 decimals</text>

  <g filter="url(#shadowTc)">
    <rect x="500" y="40" width="440" height="64" rx="14" fill="url(#darkGradTc)"/>
  </g>
  <text x="524" y="68" fill="white" font-size="11" font-weight="700" letter-spacing="2.4" opacity="0.5">SETTLEMENT · SONIC TESTNET</text>
  <text x="524" y="90" fill="white" font-size="12" opacity="0.6">Chain 14601 · S · USDC 6 decimals</text>

  <!-- Vertical dashed divider -->
  <line x1="490" y1="116" x2="490" y2="600" stroke="#0A0A0A" stroke-opacity="0.08" stroke-dasharray="4,4"/>

  <!-- L3 cards -->
  <rect x="40" y="124" width="440" height="148" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <rect x="40" y="124" width="3" height="60" rx="1.5" fill="#10B981"/>
  <text x="64" y="152" fill="#0A0A0A" font-size="14" font-weight="700">ITP Trading</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="64" y="180">· Buy / sell ITP shares</text>
    <text x="64" y="202">· Order submission · matching</text>
    <text x="64" y="224">· NAV computation</text>
  </g>

  <rect x="40" y="288" width="440" height="148" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <text x="64" y="316" fill="#0A0A0A" font-size="14" font-weight="700">Vision Prediction Markets</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="64" y="344">· Create + resolve markets</text>
    <text x="64" y="366">· Place sealed bets</text>
    <text x="64" y="388">· Claim winnings</text>
  </g>

  <rect x="40" y="452" width="440" height="148" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <text x="64" y="480" fill="#0A0A0A" font-size="14" font-weight="700">Core Protocol</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="64" y="508">· BLS consensus</text>
    <text x="64" y="530">· Batch · fill lifecycle</text>
    <text x="64" y="552">· Oracle registry</text>
  </g>

  <!-- Settlement cards -->
  <rect x="500" y="124" width="440" height="112" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <text x="524" y="152" fill="#0A0A0A" font-size="14" font-weight="700">Bridge Custody</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="524" y="180">· USDC escrow for bridge buys</text>
    <text x="524" y="202">· BridgedITP escrow for sells</text>
  </g>

  <rect x="500" y="252" width="440" height="124" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <rect x="500" y="252" width="3" height="60" rx="1.5" fill="#10B981"/>
  <text x="524" y="280" fill="#0A0A0A" font-size="14" font-weight="700">BridgedITP Tokens</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="524" y="308">· ERC-20 replicas of L3 ITP shares</text>
    <text x="524" y="330">· Tradable on Settlement</text>
    <text x="524" y="352">· Usable as Morpho collateral</text>
  </g>

  <rect x="500" y="392" width="440" height="100" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <text x="524" y="420" fill="#0A0A0A" font-size="14" font-weight="700">Morpho Lending</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="524" y="448">· Supply USDC · earn yield</text>
    <text x="524" y="470">· Borrow USDC against BridgedITP</text>
  </g>

  <rect x="500" y="508" width="440" height="92" rx="12" fill="white" stroke="#0A0A0A" stroke-opacity="0.08" filter="url(#shadowTc)"/>
  <text x="524" y="536" fill="#0A0A0A" font-size="14" font-weight="700">Vision Deposits</text>
  <g font-size="12" fill="#0A0A0A" opacity="0.6">
    <text x="524" y="564">· Deposit USDC for Vision</text>
    <text x="524" y="586">· Withdraw to Settlement wallet</text>
  </g>
</svg>
