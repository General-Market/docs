version: '3.8'

# Index L3 Local Development Environment
# Alternative to start.sh for containerized development
#
# Usage:
#   docker-compose up                # Start all services
#   docker-compose up -d             # Start in detached mode
#   docker-compose down              # Stop all services
#   docker-compose logs -f           # Tail all logs
#
# Monitoring:
#   Prometheus:    http://localhost:9090
#   AlertManager:  http://localhost:9093
#   Grafana:       http://localhost:3000 (admin/admin)

services:
  # ============ Anvil (Local Chain) ============
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: index-anvil
    command: >
      anvil
      --chain-id 111222333
      --host 0.0.0.0
      --accounts 10
      --balance 10000
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - index-local
    restart: unless-stopped

  # ============ Contract Deployer ============
  contracts-deployer:
    build:
      context: .
      dockerfile: Dockerfile.foundry
    container_name: index-deployer
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      - RPC_URL=http://anvil:8545
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - ./deployments:/app/deployments
    networks:
      - index-local
    # This service exits after deployment

  # ============ Issuer Node 1 ============
  issuer-1:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: index-issuer-1
    depends_on:
      contracts-deployer:
        condition: service_completed_successfully
    command: >
      issuer
      --node-id 1
      --port 9001
      --rpc http://anvil:8545
      --log-dir /app/logs
    ports:
      - "9001:9001"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - index-local
    restart: unless-stopped

  # ============ Issuer Node 2 ============
  issuer-2:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: index-issuer-2
    depends_on:
      contracts-deployer:
        condition: service_completed_successfully
    command: >
      issuer
      --node-id 2
      --port 9002
      --rpc http://anvil:8545
      --log-dir /app/logs
    ports:
      - "9002:9002"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - index-local
    restart: unless-stopped

  # ============ Issuer Node 3 ============
  issuer-3:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: index-issuer-3
    depends_on:
      contracts-deployer:
        condition: service_completed_successfully
    command: >
      issuer
      --node-id 3
      --port 9003
      --rpc http://anvil:8545
      --log-dir /app/logs
    ports:
      - "9003:9003"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - index-local
    restart: unless-stopped

  # ============ AP / Keeper Service ============
  ap:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: index-ap
    depends_on:
      contracts-deployer:
        condition: service_completed_successfully
    command: >
      ap
      --port 9100
      --rpc http://anvil:8545
      --mock-bitget
      --log-dir /app/logs
    ports:
      - "9100:9100"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - index-local
    restart: unless-stopped

  # ============ Monitoring: Prometheus ============
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: index-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - index-local
    restart: unless-stopped

  # ============ Monitoring: AlertManager ============
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: index-alertmanager
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - prometheus
    networks:
      - index-local
    restart: unless-stopped

  # ============ Monitoring: Grafana ============
  grafana:
    image: grafana/grafana:11.4.0
    container_name: index-grafana
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/index-overview.json
    depends_on:
      - prometheus
    networks:
      - index-local
    restart: unless-stopped

  # ============ Monitoring: JSON Exporter (multi-target) ============
  # Single instance handles all issuer nodes via Prometheus relabel_configs
  json-exporter:
    image: prometheuscommunity/json-exporter:v0.6.0
    container_name: index-json-exporter
    volumes:
      - ./monitoring/prometheus/json-exporter-config.yml:/config.yml:ro
    command:
      - "--config.file=/config.yml"
    networks:
      - index-local
    restart: unless-stopped

  # ============ PostgreSQL (Data Node) ============
  postgres:
    image: postgres:16-alpine
    container_name: index-postgres
    environment:
      POSTGRES_DB: index_prices
      POSTGRES_USER: index
      POSTGRES_PASSWORD: index_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U index"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - index-local
    restart: unless-stopped

  # ============ Data Node Service ============
  data-node:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: index-data-node
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      data-node
      --database-url postgres://index:index_dev@postgres:5432/index_prices
      --assets-file /app/assets.json
    ports:
      - "8200:8200"
    volumes:
      - ./assets.json:/app/assets.json:ro
    env_file:
      - bitget-credentials.env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - index-local
    restart: unless-stopped

networks:
  index-local:
    name: index-local
    driver: bridge

volumes:
  logs:
  deployments:
  prometheus-data:
  grafana-data:
  postgres-data:
