[workspace]
resolver = "2"
members = [
    "common",
    "issuer",
    "ap",
    "curator",
    "data-node",
    "itp-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }
async-trait = "0.1"

# Error handling
thiserror = "1.0"

# Ethereum types and interactions
ethers = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1"  # MessagePack for P2P

# Futures/streams
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal math (for precise slippage calculations)
rust_decimal = "1.33"

# Force bincode v1 to avoid v3.0.0 joke error
bincode = "1.3"
