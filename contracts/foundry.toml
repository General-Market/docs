[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
auto_detect_solc = false
# NOTE: Morpho vendor libs have strict pragmas (0.8.19, 0.8.21) patched to >=
remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@morpho-blue/=lib/morpho-blue/src/",
  "@morpho-blue-irm/=lib/morpho-blue-irm/src/",
  "@metamorpho/=lib/metamorpho/src/",
  "lib/metamorpho/lib/morpho-blue/=lib/morpho-blue/",
  "lib/metamorpho/lib/openzeppelin-contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/",
  "lib/metamorpho/lib/morpho-blue-irm/=lib/morpho-blue-irm/",
  "lib/morpho-blue-irm/lib/morpho-blue/=lib/morpho-blue/"
]

# Optimizer settings
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

# Test settings
fuzz = { runs = 256 }
ffi = true

# Allow filesystem access for deployment scripts
fs_permissions = [
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../data" },
  { access = "read-write", path = "../frontend/public" }
]

[profile.l3-testnet]
eth_rpc_url = "${INDEX_L3_RPC_URL}"
chain_id = 111222333

[etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
